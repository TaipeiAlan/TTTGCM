<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>銷控表 hprice</title>
  <style>
    :root {
      --bg:#f7f4ee;--card:#fff;--line:#d9d1c4;--head:#ead4ab;--floor:#efe5d5;--text:#2f2f2f;--muted:#7f7f7f;
      --danger:#d64f41;--accent:#e8953f;--empty:#efefef;
      --cell-w:148px;--cell-h:84px;--floor-w:38px;
      --num-size:30px;--total-size:30px;--date-size:16px;--sub-size:13px;
    }
    body.size-m{--cell-w:122px;--cell-h:68px;--num-size:24px;--total-size:24px;--date-size:14px;--sub-size:12px;}
    body.size-s{--cell-w:98px;--cell-h:56px;--num-size:16px;--total-size:16px;--date-size:12px;--sub-size:11px;}
    body.size-xs{--cell-w:68px;--cell-h:30px;--total-size:12px;--date-size:10px;--sub-size:9px;}
    body.size-xs td.cell.empty{font-size:9px;}
    body.size-xs .unit-price{display:none;}
    body.size-xs .badge{display:none;}
    body.size-xs td.cell[data-parking="1"]::after{content:'P';position:absolute;top:0;right:0;background:var(--accent);color:#fff;border-radius:0 0 0 4px;font-size:8px;font-weight:700;padding:1px 3px;line-height:1;}
    body.size-xs .floor .f{font-size:11px;}
    body.size-xs .floor .s{font-size:7px;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
    .wrap{padding:8px}
    .topbar{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:7px;display:grid;gap:6px}
    .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    h1{margin:0;font-size:16px;line-height:1.1}
    .controls,.sizes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .btn{border:1px solid #c7954f;background:#f7e8cd;color:#79552a;border-radius:7px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;line-height:1.2}
    .btn.active{background:#e8953f;color:#fff;border-color:#d27b23}
    #status{font-size:12px;color:var(--muted);line-height:1.2}
    .grid-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:#fff;max-height:calc(100vh - 120px)}

    table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
    th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    thead th{position:sticky;top:0;z-index:4;background:var(--head);min-width:var(--cell-w);padding:6px 5px;text-align:center;color:#7b5b2f;font-size:12px;cursor:pointer;transition:.15s}
    thead th:first-child{min-width:var(--floor-w);width:var(--floor-w);left:0;z-index:6;position:sticky;background:linear-gradient(140deg,var(--floor) 55%,#f3ede2 55%);padding:0;writing-mode:vertical-rl;text-orientation:mixed;font-size:12px;letter-spacing:2px;user-select:none}
    .unit-head{display:grid;gap:2px}.unit-name{font-weight:800;font-size:18px}.unit-layout{font-size:11px;color:#71542f;font-weight:600}
    tbody th.floor{position:sticky;left:0;z-index:3;width:var(--floor-w);min-width:var(--floor-w);background:var(--floor);text-align:center;color:#74542d;padding:0;cursor:pointer;user-select:none;transition:.15s}
    .floor .f{display:block;font-size:17px;font-weight:900;padding-top:3px;line-height:1}.floor .s{display:block;font-size:9px;font-weight:800;padding-bottom:3px;letter-spacing:1px}
    td.cell{width:var(--cell-w);height:var(--cell-h);vertical-align:top;background:#fff;padding:2px 3px;cursor:pointer;position:relative;transition:.12s}
    td.cell.empty{background:var(--empty);color:#939393;text-align:center;vertical-align:middle;font-size:calc(var(--sub-size) + 1px);font-weight:600}
    td.cell.active{outline:2px solid var(--accent);outline-offset:-2px;background:#fffdf8}
    .date{font-size:var(--date-size);color:#666;font-weight:700;margin-bottom:0;line-height:1.1}
    .unit-price{display:flex;align-items:baseline;gap:2px}.num{color:var(--danger);font-weight:900;font-size:var(--num-size);line-height:1}
    .u{font-size:var(--sub-size);font-weight:700}.total{font-size:var(--total-size);font-weight:850;line-height:1.1}
    .badge{position:absolute;top:0;right:0;background:var(--accent);color:#fff;border-radius:0 0 0 8px;font-size:10px;padding:2px 5px}

    body.emph-unit .total{opacity:.3}
    body.emph-total .unit-price{opacity:.3}
    .hover-row,.hover-col,.hover-head,.hover-floor{background:#fff4de!important}
    .hover-row.hover-col{background:#ffe7c5!important}

    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:8px}
    .modal.show{display:flex}.modal-card{width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:12px;background:#fff;padding:12px}
    .modal-head{display:flex;justify-content:space-between;align-items:center}.modal-title{margin:0;font-size:20px}
    .close-btn{border:none;background:transparent;font-size:28px;color:#777;cursor:pointer}
    .kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}.kpi .box{background:#f7f1e5;border-radius:8px;padding:7px}
    .kpi .label{color:#7f7a72;font-size:12px}.kpi .value{font-size:18px;font-weight:800}
    .detail,.stats-table,.summary-grid{width:100%;border-collapse:collapse;font-size:13px}
    .detail th,.detail td,.stats-table th,.stats-table td,.summary-grid th,.summary-grid td{border:1px solid #e4dfd4;padding:7px;text-align:left}
    .detail th,.stats-table th,.summary-grid th{background:#f5f1e8;color:#5f513c}

    @media (max-width:640px){.unit-name{font-size:16px}}
    .deadline-ctrl{display:none;align-items:center;gap:5px;user-select:none}
    .deadline-pill{display:inline-flex;align-items:center;background:#e5f3e5;border:1.5px solid #7ab87a;border-radius:20px;overflow:hidden;font-weight:700;font-size:12px;color:#2d6b2d;line-height:1}
    .deadline-pill .darrow{border:none;background:transparent;color:#2d6b2d;cursor:pointer;padding:4px 0;width:26px;font-size:12px;transition:.12s;text-align:center}
    .deadline-pill .darrow:hover{background:#c5e8c5}
    .deadline-pill .darrow + .darrow{border-left:1px solid #b6dab6}
    .deadline-pill .dlabel{padding:4px 10px;cursor:ew-resize;width:118px;text-align:center;touch-action:none;border-left:1px solid #b6dab6;display:inline-flex;align-items:baseline;justify-content:center;gap:4px;white-space:nowrap}
    .deadline-pill .dbound{font-size:10px;font-weight:600;opacity:.75}
    .deadline-pill .dlabel:hover{background:#d4ecda}
    .deadline-pill.dragging .dlabel{background:#c5e8c5}
    .deadline-pill.all-mode{background:#f7e8cd;border-color:#c7954f;color:#79552a}
    .deadline-pill.all-mode .darrow{color:#79552a}
    .deadline-pill.all-mode .darrow:hover,.deadline-pill.all-mode .dlabel:hover{background:#ead4ab}
    .deadline-pill.all-mode .darrow + .darrow,.deadline-pill.all-mode .dlabel{border-color:#dcbf8a}
    /* CSV overlay */
    .csv-banner{background:#e0f2f7;border:1.5px solid #5ba8bf;border-radius:8px;padding:5px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .csv-banner-info{font-size:12px;color:#1a5f7a;font-weight:600;flex:1;min-width:0}
    .btn.csv-btn{border-color:#5ba8bf;background:#d0ecf5;color:#1a5f7a}
    .btn.csv-hide{background:#5ba8bf;color:#fff;border-color:#3d8fa8}
    td.cell.csv-only{background:#eaf6fb}
    td.cell.csv-only.active{outline:2px solid #5ba8bf;outline-offset:-2px;background:#d4eef7}
    .csv-overlay-strip{position:absolute;bottom:0;left:0;right:0;background:#bce5f5cc;border-top:1px solid #8dcde0;padding:1px 4px;font-size:10px;color:#0d4f6b;font-weight:700;line-height:1.4;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    body.size-xs .csv-overlay-strip{display:none}
    tbody th.floor.csv-unknown{background:#c8e9f3;color:#0d4f6b}
    td.cell.csv-unknown-empty{background:#f0fafd;color:#7fb8c8;text-align:center;vertical-align:middle;font-size:calc(var(--sub-size) + 1px);font-weight:600}
    #chartModal{align-items:center}
    #chartModal .modal-card{width:min(880px,100%);max-height:92vh}
  </style>
</head>
<body class="size-l">
  <div class="wrap">
    <section class="topbar">
      <div class="top-row">
        <h1>銷控表 hprice</h1>
        <div class="controls">
          <label class="btn" for="fileInput">開啟 XLS/XLSX</label>
          <input id="fileInput" type="file" accept=".xls,.xlsx" hidden>
          <label class="btn" for="csvInput">開啟 CSV</label>
          <input id="csvInput" type="file" accept=".csv" hidden>
          <label class="btn" style="display:inline-flex;align-items:center;gap:6px;">
            <input id="priceToggle" type="checkbox" checked>
            與車位一起計算單坪價格
          </label>
          <button id="trendBtn" class="btn">交易趨勢圖</button>
        </div>
      </div>
      <div class="top-row">
        <div class="sizes">
          <span style="font-size:12px;color:#7d7d7d;">尺寸：</span>
          <button class="btn size-btn active" data-size="l">大</button>
          <button class="btn size-btn" data-size="m">中</button>
          <button class="btn size-btn" data-size="s">小</button>
          <button class="btn size-btn" data-size="xs">迷你</button>
        </div>
        <div class="sizes">
          <span style="font-size:12px;color:#7d7d7d;">凸顯：</span>
          <button class="btn emph-btn active" data-emph="none">無</button>
          <button class="btn emph-btn" data-emph="unit">單價</button>
          <button class="btn emph-btn" data-emph="total">總價</button>
        </div>
        <div id="deadlineCtrl" class="deadline-ctrl">
          <span style="font-size:12px;color:#7d7d7d;">截止：</span>
          <div class="deadline-pill all-mode" id="deadlinePill">
            <button class="darrow" id="deadlinePrev" title="往前一個月">◀</button>
            <button class="darrow" id="deadlineNext" title="往後一個月">▶</button>
            <button class="darrow dall" id="deadlineAll" title="顯示全部月份">全</button>
            <span class="dlabel" id="deadlineLabel" title="拖曳左右調整截止月份，雙擊顯示全部"><span id="deadlineLabelText">全部</span><span class="dbound" id="deadlineBoundary"></span></span>
          </div>
        </div>
        <div id="status">請先載入 Excel（第一個工作表）。</div>
      </div>
      <div id="csvBanner" class="top-row csv-banner" style="display:none;">
        <span id="csvBannerInfo" class="csv-banner-info">CSV 預覽資料</span>
        <button id="csvToggleBtn" class="btn csv-btn">隱藏 CSV 疊層</button>
        <button id="csvClearBtn" class="btn csv-btn">清除 CSV</button>
      </div>
    </section>
    <div class="grid-wrap" id="gridWrap"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle" class="modal-title">明細</h2>
        <button id="closeModal" class="close-btn">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="modal" id="chartModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 class="modal-title">交易趨勢圖</h2>
        <button id="closeChartModal" class="close-btn">×</button>
      </div>
      <p style="font-size:12px;color:#999;margin:4px 0 8px">X 軸：月份（資料起迄，含無交易月份）　Y 軸：交易戶數　每條線代表一個棟及號</p>
      <div style="position:relative;height:400px"><canvas id="trendChart"></canvas></div>
      <div id="trendDetail" style="display:none;margin-top:10px;background:#f7f1e5;border-radius:8px;padding:10px 14px;font-size:13px"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script>
    const CACHE_KEY='hprice_cache_v5';
    const CSV_OVERLAY_KEY='hprice_csv_overlay_v1';
    const LEGACY_CACHE_KEYS=['hprice_cache','hprice_cache_v1','hprice_cache_v2','hprice_cache_v3','hprice_cache_v4'];
    const SIZE_KEY='hprice_size';
    const EMPH_KEY='hprice_emph';
    const PRICE_MODE_KEY='hprice_price_with_parking';
    const fileInput=document.getElementById('fileInput');
    const priceToggle=document.getElementById('priceToggle');
    const gridWrap=document.getElementById('gridWrap');
    const statusEl=document.getElementById('status');
    const modal=document.getElementById('modal');
    const modalTitle=document.getElementById('modalTitle');
    const modalBody=document.getElementById('modalBody');
    const closeModal=document.getElementById('closeModal');
    const sizeBtns=[...document.querySelectorAll('.size-btn')];
    const emphBtns=[...document.querySelectorAll('.emph-btn')];
    let withParkingPrice=true;
    let currentRecords=[];
    let deadlineYM=null;
    let deadlineMonthRange=[];
    let csvState={records:[],dataDate:'',visible:true};

    function parseROCDate(v){const m=String(v||'').match(/(\d+)[^\d]+(\d+)[^\d]+(\d+)/);return m?Number(m[1])*10000+Number(m[2])*100+Number(m[3]):0}
    function cleanNumber(v){if(v===undefined||v===null||v==='')return '';const n=Number(String(v).replace(/,/g,'').trim());return Number.isNaN(n)?String(v).trim():n}
    function formatAmount(v,d=0){const n=cleanNumber(v);if(typeof n!=='number')return v||'-';return n.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d})}
    function parseFloor(t){const m=String(t||'').split('/')[0].match(/-?\d+/);return m?Number(m[0]):null}
    function detectHeaderRow(rows){return rows.findIndex(r=>r.includes('棟及號')&&r.includes('交易日期')&&r.includes('總價(萬元)'))}
    function detectDataDate(rows){for(const row of rows.slice(0,6)){for(const c of row){const m=String(c||'').match(/(\d{4})年\s*(\d{2})月\s*(\d{2})日/);if(m)return `${m[1]}-${m[2]}-${m[3]}`}}return new Date().toISOString().slice(0,10)}
    function toNumber(v){const n=Number(v);return Number.isFinite(n)?n:null}
    function clampPositive(n){return (n!==null&&n>0)?n:null}

    function getByAlias(row,col,aliases){for(const a of aliases){if(col[a]!==undefined)return row[col[a]]}return ''}
    function normalizeSerial(v){const raw=String(v||'').trim();if(!raw)return '';const m=raw.match(/^(\d+)/);return m?m[1]:raw}
    function normalizeUnit(u){return String(u||'').trim().replace(/棟[\d\-之]+號.*$/,'棟')}
    function parseArea(v){const n=Number(String(v||'').replace(/[^\d.-]/g,''));return Number.isFinite(n)?n:null}
    function parsePriceYuan(v){const n=Number(String(v||'').replace(/[^\d.-]/g,''));return Number.isFinite(n)?n:null}
    function findSheetName(names,keyword){return names.find(n=>String(n).includes(keyword))||''}

    function parseSubSheet(rows,type){
      if(!rows||!rows.length)return new Map();
      const headerIdx=rows.findIndex(r=>r.includes('序號'));
      if(headerIdx<0)return new Map();
      const header=rows[headerIdx];
      const col=Object.fromEntries(header.map((h,i)=>[h,i]));
      const out=new Map();
      rows.slice(headerIdx+1).forEach(r=>{
        const serial=normalizeSerial(getByAlias(r,col,['序號']));
        if(!serial)return;
        let item=null;
        if(type==='land'){
          item={序號:getByAlias(r,col,['序號']),土地位置:getByAlias(r,col,['土地位置']),土地交易面積:parseArea(getByAlias(r,col,['土地交易面積'])),使用分區:getByAlias(r,col,['使用分區或編定'])};
        }else if(type==='building'){
          item={序號:getByAlias(r,col,['序號']),建物交易面積:parseArea(getByAlias(r,col,['建物交易面積'])),建物分層:getByAlias(r,col,['建物分層'])};
        }else if(type==='parking'){
          const yuan=parsePriceYuan(getByAlias(r,col,['車位價格']));
          item={序號:getByAlias(r,col,['序號']),車位類別:getByAlias(r,col,['車位類別']),車位價格元:yuan,車位面積:parseArea(getByAlias(r,col,['車位面積'])),所在樓層:getByAlias(r,col,['所在樓層'])};
        }
        if(!item)return;
        if(!out.has(serial))out.set(serial,[]);
        out.get(serial).push(item);
      });
      return out;
    }

    function enrichFromSubSheets(records,maps){
      return records.map(r=>{
        const serial=normalizeSerial(r.編號);
        const 土地明細=maps.land.get(serial)||[];
        const 建物明細=maps.building.get(serial)||[];
        const 車位明細=maps.parking.get(serial)||[];
        const 土地坪數合計=土地明細.reduce((s,x)=>s+(x.土地交易面積||0),0);
        const 車位坪數合計=車位明細.reduce((s,x)=>s+(x.車位面積||0),0);
        const 車位總價元合計=車位明細.reduce((s,x)=>s+(x.車位價格元||0),0);
        const 車位數量=車位明細.length||r.車位數量||'';
        const totalArea=toNumber(r.總面積);
        const parkingArea=toNumber(車位坪數合計||r.車位坪數);
        const houseArea=(totalArea!==null&&parkingArea!==null)?Math.max(totalArea-parkingArea,0):totalArea;
        return {...r,土地明細,建物明細,車位明細,土地坪數:土地坪數合計||r.土地坪數,車位坪數:車位坪數合計||r.車位坪數,車位總價:(車位總價元合計?車位總價元合計/10000:r.車位總價),車位數量,房屋總面積:houseArea};
      });
    }

    function calcUnitPrice(record,includeParking){
      const total=toNumber(record.總價);
      const totalArea=clampPositive(toNumber(record.總面積));
      const parkingPrice=toNumber(record.車位總價)||0;
      const houseArea=clampPositive(toNumber(record.房屋總面積));
      if(includeParking){
        if(total!==null&&totalArea!==null)return total/totalArea;
        return toNumber(record.單價);
      }
      if(total!==null&&houseArea!==null){
        const housePrice=total-parkingPrice;
        if(housePrice>0)return housePrice/houseArea;
      }
      return toNumber(record.單價);
    }

    function extractData(rows){
      const hi=detectHeaderRow(rows);if(hi<0)throw new Error('找不到標題列');
      const header=rows[hi];const col=Object.fromEntries(header.map((h,i)=>[h,i]));
      const required=['棟及號','交易日期','總價(萬元)','單價(萬元/坪)','樓別/樓高'];
      const miss=required.filter(k=>col[k]===undefined);if(miss.length)throw new Error('缺少欄位：'+miss.join('、'));
      return rows.slice(hi+1)
        .filter(r=>r[col['棟及號']]&&r[col['樓別/樓高']])
        .map(r=>({
          編號:getByAlias(r,col,['編號']),建物坐落:getByAlias(r,col,['建物坐落']),棟及號:normalizeUnit(getByAlias(r,col,['棟及號'])),建案名稱:getByAlias(r,col,['建案名稱']),交易日期:getByAlias(r,col,['交易日期']),
          總價:cleanNumber(getByAlias(r,col,['總價(萬元)'])),單價:cleanNumber(getByAlias(r,col,['單價(萬元/坪)'])),總面積:cleanNumber(getByAlias(r,col,['總面積(坪)','建物移轉總面積(坪)'])),
          室內坪數:cleanNumber(getByAlias(r,col,['主建物面積(坪)','主建物坪數'])),陽台坪數:cleanNumber(getByAlias(r,col,['陽台面積(坪)','附屬建物面積(坪)'])),車位坪數:cleanNumber(getByAlias(r,col,['車位移轉總面積(坪)','車位面積(坪)'])),
          土地坪數:cleanNumber(getByAlias(r,col,['土地移轉總面積(坪)','土地面積(坪)'])),
          主建物佔比:getByAlias(r,col,['主建物佔比(%)']),型態:getByAlias(r,col,['型態']),樓別樓高:getByAlias(r,col,['樓別/樓高']),樓層:parseFloor(getByAlias(r,col,['樓別/樓高'])),
          交易標的:getByAlias(r,col,['交易標的']),交易筆棟數:getByAlias(r,col,['交易筆棟數']),建物格局:getByAlias(r,col,['建物格局']),車位總價:cleanNumber(getByAlias(r,col,['車位總價(萬元)'])),
          車位數量:cleanNumber(getByAlias(r,col,['車位個數','停車位個數'])),主要用途:getByAlias(r,col,['主要用途']),主要建材:getByAlias(r,col,['主要建材']),備註:getByAlias(r,col,['備註'])
        })).filter(r=>r.樓層!==null&&r.棟及號)
    }

    function pickLatest(records){const m=new Map();records.forEach(r=>{const k=`${r.樓層}__${r.棟及號}`;const o=m.get(k);if(!o||parseROCDate(r.交易日期)>=parseROCDate(o.交易日期))m.set(k,r)});return m}
    function openModal(t,h){modalTitle.textContent=t;modalBody.innerHTML=h;modal.classList.add('show')}
    function closeDetail(){modal.classList.remove('show')}
    function summarize(records){const sold=records.length;const areas=records.map(r=>Number(r.總面積)).filter(n=>!Number.isNaN(n));return{sold,maxArea:areas.length?Math.max(...areas):0,minArea:areas.length?Math.min(...areas):0}}

    function groupUnitByContiguousFloors(unitRecords,allFloors){
      const known=unitRecords
        .map(r=>({floor:r.樓層,area:Number(r.總面積)}))
        .filter(x=>!Number.isNaN(x.area))
        .sort((a,b)=>a.floor-b.floor);
      const inferredMap=new Map();
      for(let i=0;i<known.length-1;i++){
        const a=known[i],b=known[i+1];
        if(Math.abs(a.area-b.area)<0.11&&b.floor-a.floor>1){
          for(let f=a.floor+1;f<b.floor;f++)inferredMap.set(f,a.area);
        }
      }
      const knownMap=new Map(known.map(k=>[k.floor,k.area]));
      const floors=[...allFloors].sort((a,b)=>b-a);
      if(!floors.length)return [];
      const list=floors.map(f=>{
        if(knownMap.has(f))return {floor:f,label:`${formatAmount(knownMap.get(f),1)} 坪`};
        if(inferredMap.has(f))return {floor:f,label:`${formatAmount(inferredMap.get(f),1)} 坪`};
        return {floor:f,label:'尚未得知'};
      });
      const groups=[];let start=list[0].floor,end=list[0].floor,label=list[0].label;
      for(let i=1;i<list.length;i++){
        const cur=list[i],prev=list[i-1];
        if(cur.label===label&&(prev.floor-cur.floor)===1){end=cur.floor;}
        else{groups.push({start,end,label});start=cur.floor;end=cur.floor;label=cur.label;}
      }
      groups.push({start,end,label});
      return groups;
    }

    function buildStatsTable(rows){return `<table class="stats-table">${rows.map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table>`}

    function showUnitStats(unit,unitRecords,floors){
      const s=summarize(unitRecords);const soldFloors=new Set(unitRecords.map(r=>r.樓層)).size;
      const grouped=groupUnitByContiguousFloors(unitRecords,floors).map(g=>`<tr><th>${g.start===g.end?g.start:`${g.end}~${g.start}`}</th><td>${g.label}</td></tr>`).join('')||'<tr><td colspan="2">無坪數資料</td></tr>';
      openModal(`戶別統計｜${unit}`,
        buildStatsTable([
          ['戶別',unit],['已售筆數',s.sold],['已售樓層數',`${soldFloors} / ${floors.length}`],['最大坪數',s.maxArea?`${formatAmount(s.maxArea,2)} 坪`:'-'],['最小坪數',s.minArea?`${formatAmount(s.minArea,2)} 坪`:'-']
        ])+
        `<h3 style="font-size:15px;margin:10px 0 6px;">坪數收攏（連續樓層）</h3><table class="summary-grid"><tr><th>樓層區間</th><th>坪數</th></tr>${grouped}</table>`
      )
    }

    function showFloorStats(floor,floorRecords,unitCount){

      openModal(`樓層統計｜${floor}F`,buildStatsTable([
        ['樓層',`${floor}F`],['已售筆數',s.sold],['已售戶數',`${soldUnits} / ${unitCount}`],['最大坪數',s.maxArea?`${formatAmount(s.maxArea,2)} 坪`:'-'],['最小坪數',s.minArea?`${formatAmount(s.minArea,2)} 坪`:'-']

      const floorRows=floors.map(f=>{const rs=latestRecords.filter(r=>r.樓層===f);return `<tr><td>${f}F</td><td>${rs.length}</td><td>${rs.length?formatAmount(Math.min(...rs.map(x=>Number(x.總面積)).filter(x=>!Number.isNaN(x))),2):'-'}</td><td>${rs.length?formatAmount(Math.max(...rs.map(x=>Number(x.總面積)).filter(x=>!Number.isNaN(x))),2):'-'}</td></tr>`}).join('');
      const unitRows=units.map(u=>{const rs=latestRecords.filter(r=>r.棟及號===u);return `<tr><td>${u}</td><td>${rs.length}</td><td>${rs.length?formatAmount(Math.min(...rs.map(x=>Number(x.總面積)).filter(x=>!Number.isNaN(x))),2):'-'}</td><td>${rs.length?formatAmount(Math.max(...rs.map(x=>Number(x.總面積)).filter(x=>!Number.isNaN(x))),2):'-'}</td></tr>`}).join('');
      openModal('整棟統計',

        ])+
        `<h3 style="font-size:15px;margin:10px 0 6px;">樓層統計</h3><table class="summary-grid"><tr><th>樓層</th><th>已售</th><th>最小坪數</th><th>最大坪數</th></tr>${floorRows}</table>`+

    function clearHover(){gridWrap.querySelectorAll('.hover-row,.hover-col,.hover-head,.hover-floor').forEach(el=>el.classList.remove('hover-row','hover-col','hover-head','hover-floor'))}
    function applyHover(floor,unit){
      clearHover();
      if(floor!==undefined){gridWrap.querySelectorAll(`[data-floor="${floor}"]`).forEach(el=>el.classList.add('hover-row'));const floorEl=gridWrap.querySelector(`th.floor[data-floor="${floor}"]`);if(floorEl)floorEl.classList.add('hover-floor');}
      if(unit!==undefined){gridWrap.querySelectorAll(`[data-unit="${unit}"]`).forEach(el=>el.classList.add('hover-col'));const headEl=gridWrap.querySelector(`thead th[data-unit="${unit}"]`);if(headEl)headEl.classList.add('hover-head');}
    }
    function removeActive(){gridWrap.querySelectorAll('td.cell.active').forEach(c=>c.classList.remove('active'))}

    function renderTable(records,info={},csvLatestMap=null,csvNullFloor=null){
      if(!records.length&&!csvLatestMap?.size&&!csvNullFloor?.size){gridWrap.innerHTML='<div style="padding:16px;color:#777;">沒有資料</div>';return}
      const latestMap=pickLatest(records);
      // 只取有樓層的 CSV 紀錄來決定欄位/列位
      const csvRecordsAll=csvLatestMap?[...csvLatestMap.values()]:[];
      // 也從 null-floor 群組中補充欄位（純 CSV 場景下 XLS 可能尚未載入）
      // 若 null-floor CSV 的戶別已在 XLS 欄位中（unitKeyMatch），沿用 XLS 欄位名，避免重複欄
      const xlsAndCsvKnownUnits=[...records.map(r=>r.棟及號),...csvRecordsAll.map(r=>r.棟及號)];
      const csvNullUnits=csvNullFloor?[...csvNullFloor.values()].map(g=>{
        const c=g.latest.棟及號;
        return xlsAndCsvKnownUnits.find(u=>unitKeyMatch(u,c))||c;
      }):[];
      const allUnits=[...new Set([...records.map(r=>r.棟及號),...csvRecordsAll.map(r=>r.棟及號),...csvNullUnits])].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true}));
      // 不把 null 樓層加進 floors
      const allFloors=[...new Set([...records.map(r=>r.樓層),...csvRecordsAll.map(r=>r.樓層)])].filter(f=>f!==null&&f!==undefined).sort((a,b)=>b-a);
      const units=allUnits;
      const floors=allFloors;
      const latestRecords=[...latestMap.values()];

      const table=document.createElement('table');const thead=document.createElement('thead');const hr=document.createElement('tr');
      const corner=document.createElement('th');corner.textContent='全棟';corner.addEventListener('click',()=>showBuildingStats(latestRecords,floors,units));hr.appendChild(corner);

      units.forEach(unit=>{
        const th=document.createElement('th');th.dataset.unit=unit;
        const layout=latestRecords.find(r=>r.棟及號===unit)?.建物格局||'-';
        th.innerHTML=`<div class="unit-head"><div class="unit-name">${unit}</div><div class="unit-layout">${layout}</div></div>`;
        th.addEventListener('click',()=>showUnitStats(unit,latestRecords.filter(r=>r.棟及號===unit),floors));
        th.addEventListener('mouseenter',()=>applyHover(undefined,unit));
        th.addEventListener('mouseleave',clearHover);
        hr.appendChild(th);
      });
      thead.appendChild(hr);table.appendChild(thead);

      const tbody=document.createElement('tbody');
      floors.forEach(floor=>{
        const tr=document.createElement('tr');
        const fth=document.createElement('th');fth.className='floor';fth.dataset.floor=floor;fth.innerHTML=`<span class="f">${floor}</span><span class="s">F</span>`;
        fth.addEventListener('click',()=>showFloorStats(floor,latestRecords.filter(r=>r.樓層===floor),units.length));
        fth.addEventListener('mouseenter',()=>applyHover(floor,undefined));fth.addEventListener('mouseleave',clearHover);
        tr.appendChild(fth);

        units.forEach(unit=>{
          const td=document.createElement('td');td.className='cell';td.dataset.floor=floor;td.dataset.unit=unit;
          const record=latestMap.get(`${floor}__${unit}`);
          const csvRecord=csvLatestMap?csvLatestMap.get(`${floor}__${unit}`):null;
          td.addEventListener('mouseenter',()=>applyHover(floor,unit));td.addEventListener('mouseleave',clearHover);
          if(!record&&!csvRecord){
            td.classList.add('empty');td.textContent='尚未登錄';
            td.addEventListener('click',()=>{removeActive();td.classList.add('active')});
          } else if(!record&&csvRecord){
            // CSV-only cell (no XLS data for this position)
            td.classList.add('csv-only');
            const hasParking=String(csvRecord.交易標的).includes('車位')||Number(csvRecord.車位總價)>0;
            const unitPrice=calcUnitPrice(csvRecord,withParkingPrice);
            td.dataset.parking=hasParking?'1':'0';
            td.innerHTML=`<span class="badge" style="background:#5ba8bf">CSV</span><div class="date" style="color:#1a5f7a">${csvRecord.交易日期||'-'}</div><div class="unit-price"><span class="num" style="color:#1a5f7a">${unitPrice!==null?formatAmount(unitPrice,2):'-'}</span><span class="u">萬/坪</span></div><div class="total" style="color:#1a5f7a">${csvRecord.總價?formatAmount(csvRecord.總價,0)+' 萬':'-'}</div>`;
            td.addEventListener('click',()=>{removeActive();td.classList.add('active');showRecordDetail(csvRecord,floor,unit)});
          } else {
            // XLS cell — show normally, add CSV strip if available
            const hasParking=String(record.交易標的).includes('車位')||Number(record.車位總價)>0;
            const unitPrice=calcUnitPrice(record,withParkingPrice);
            td.dataset.parking=hasParking?'1':'0';
            td.innerHTML=`<span class="badge">${hasParking?'含車位':'無車位'}</span><div class="date">${record.交易日期||'-'}</div><div class="unit-price"><span class="num">${unitPrice!==null?formatAmount(unitPrice,2):'-'}</span><span class="u">萬/坪</span></div><div class="total">${formatAmount(record.總價,0)} 萬</div>`;
            if(csvRecord){
              const csvUp=calcUnitPrice(csvRecord,withParkingPrice);
              const strip=document.createElement('div');strip.className='csv-overlay-strip';
              strip.textContent=`新 ${csvRecord.交易日期||'?'}${csvUp!==null?' '+formatAmount(csvUp,2)+'萬/坪':''}`;
              td.appendChild(strip);
            }
            td.addEventListener('click',()=>{removeActive();td.classList.add('active');showRecordDetail(record,floor,unit)});
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      // ── 未知樓層列（CSV 搶先版無樓層資訊的紀錄，每筆獨立一行）────────────
      if(csvNullFloor?.size){
        // 每個 group 的 records 依日期排序（新→舊），取最多行數
        const sortedGroups=new Map([...csvNullFloor.entries()].map(([k,g])=>[k,{
          ...g,
          sorted:[...g.records].sort((a,b)=>parseROCDate(b.交易日期)-parseROCDate(a.交易日期))
        }]));
        const maxRows=Math.max(...[...sortedGroups.values()].map(g=>g.sorted.length));
        const unknownRows=[];
        for(let ri=0;ri<maxRows;ri++){
          const tr=document.createElement('tr');
          const th=document.createElement('th');
          th.className='floor csv-unknown';th.title='CSV 搶先版資料（未知樓層）';
          th.innerHTML=`<span class="f">?</span><span class="s">CSV</span>`;
          tr.appendChild(th);
          units.forEach(unit=>{
            const td=document.createElement('td');td.className='cell';
            td.dataset.floor='csv-unknown';td.dataset.unit=unit;
            td.addEventListener('mouseenter',()=>applyHover(undefined,unit));td.addEventListener('mouseleave',clearHover);
            const matchKey=[...sortedGroups.keys()].find(k=>unitKeyMatch(unit,k));
            if(!matchKey||ri>=sortedGroups.get(matchKey).sorted.length){
              td.classList.add('csv-unknown-empty');td.textContent='-';
            } else {
              const rec=sortedGroups.get(matchKey).sorted[ri];
              const up=calcUnitPrice(rec,withParkingPrice);
              td.classList.add('csv-only');
              td.innerHTML=`<span class="badge" style="background:#5ba8bf">CSV</span><div class="date" style="color:#1a5f7a">${rec.交易日期||'-'}</div><div class="unit-price"><span class="num" style="color:#1a5f7a">${up!==null?formatAmount(up,2):'-'}</span><span class="u">萬/坪</span></div><div class="total" style="color:#1a5f7a">${rec.總價?formatAmount(rec.總價,0)+' 萬':'-'}</div>`;
              td.addEventListener('click',()=>{removeActive();td.classList.add('active');showRecordDetail(rec,'?',unit);});
            }
            tr.appendChild(td);
          });
          unknownRows.push(tr);
        }
        // 由下往上插入，讓 row 0 在最頂
        for(let i=unknownRows.length-1;i>=0;i--) tbody.insertBefore(unknownRows[i],tbody.firstChild);
      }
      // ─────────────────────────────────────────────────────────────────────

      table.appendChild(tbody);gridWrap.innerHTML='';gridWrap.appendChild(table);
      const dataDate=info.dataDate||'-';const cachedAt=info.cachedAt?new Date(info.cachedAt).toLocaleString('zh-TW'):new Date().toLocaleString('zh-TW');
      const deadlineStr=deadlineYM?`截止：${toROCYM(deadlineYM)}｜`:'';
      const csvCount=csvState.records.length;const csvNullCount=csvState.records.filter(r=>r.樓層===null||r.樓層===undefined).length;
      const csvStr=(csvLatestMap||csvNullFloor)?`｜CSV：${csvCount}筆${csvNullCount?'（'+csvNullCount+'筆未知樓層）':''}`:'';
      statusEl.textContent=`${deadlineStr}資料日期：${dataDate}｜快取時間：${cachedAt}｜交易筆數：${records.length}${csvStr}｜單價模式：${withParkingPrice?'含車位':'不含車位'}`;
    }

    function saveCache(records,dataDate){localStorage.setItem(CACHE_KEY,JSON.stringify({records,dataDate,cachedAt:new Date().toISOString()}))}
    function cleanupLegacyCaches(){LEGACY_CACHE_KEYS.forEach(k=>localStorage.removeItem(k))}
    function isValidCachePayload(p){return !!(p&&Array.isArray(p.records)&&p.records.every(r=>r&&r.棟及號!==undefined&&r.樓層!==undefined))}
    function loadCache(){
      cleanupLegacyCaches();
      try{
        const raw=localStorage.getItem(CACHE_KEY);if(!raw)return null;
        const p=JSON.parse(raw);
        if(!isValidCachePayload(p)){localStorage.removeItem(CACHE_KEY);return null}
        return p;
      }catch{
        localStorage.removeItem(CACHE_KEY);
        return null
      }
    }

    function saveCsvCache(records,dataDate){try{localStorage.setItem(CSV_OVERLAY_KEY,JSON.stringify({records,dataDate,cachedAt:new Date().toISOString()}))}catch(e){}}
    function loadCsvCache(){try{const raw=localStorage.getItem(CSV_OVERLAY_KEY);if(!raw)return null;const p=JSON.parse(raw);return(p&&Array.isArray(p.records))?p:null}catch{return null}}
    function clearCsvCache(){localStorage.removeItem(CSV_OVERLAY_KEY)}

    // 正規化戶別 key：移除棟/號/樓等字，提取字母+數字，用於跨來源比對
    function normalizeUnitKey(unit){
      return String(unit||'').replace(/[棟號樓]/g,'').replace(/\s+/g,'').toUpperCase();
    }
    function unitKeyMatch(xlsUnit,csvUnit){
      const x=normalizeUnitKey(xlsUnit),c=normalizeUnitKey(csvUnit);
      return x===c||c.startsWith(x)||x.startsWith(c);
    }

    // 建立 XLS 已知交易的 matchSet（同戶別 + 同總價視為重複）
    function buildXlsMatchSet(){
      const s=new Set();
      currentRecords.forEach(r=>{
        const price=Math.round(Number(r.總價)||0);
        s.add(`${normalizeUnitKey(r.棟及號)}_${price}`);
      });
      return s;
    }

    function isCsvDupOfXls(r,xlsSet){
      const price=Math.round(Number(r.總價)||0);
      return xlsSet.has(`${normalizeUnitKey(r.棟及號)}_${price}`);
    }

    function getCsvLatestMap(){
      if(!csvState.visible||!csvState.records.length)return null;
      const xlsSet=buildXlsMatchSet();
      // 只取有樓層資訊的 CSV 紀錄（用於格子疊層），並去除 XLS 已有的重複
      const filtered=csvState.records.filter(r=>{
        if(r.樓層===null||r.樓層===undefined)return false;
        return !isCsvDupOfXls(r,xlsSet);
      });
      return filtered.length?pickLatest(filtered):null;
    }

    // 取無樓層 CSV 紀錄（加到「未知樓層」列），同樣去除 XLS 重複
    function getCsvNullFloor(){
      if(!csvState.visible||!csvState.records.length)return null;
      const xlsSet=buildXlsMatchSet();
      const nullFloor=csvState.records.filter(r=>{
        if(r.樓層!==null&&r.樓層!==undefined)return false;
        return !isCsvDupOfXls(r,xlsSet);
      });
      if(!nullFloor.length)return null;
      // 按 normalizeUnitKey 分組，保留所有記錄及最新一筆（latest 用於決定欄位名稱）
      const groups=new Map();
      nullFloor.forEach(r=>{
        const k=normalizeUnitKey(r.棟及號);
        if(!groups.has(k))groups.set(k,{records:[],latest:null});
        const g=groups.get(k);
        g.records.push(r);
        if(!g.latest||parseROCDate(r.交易日期)>=parseROCDate(g.latest.交易日期))g.latest=r;
      });
      return groups;
    }

    function updateCsvBanner(){

    async function handleUpload(file){
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const caseName=wb.SheetNames[0];
      if(!caseName)throw new Error('Excel 沒有工作表');
      const caseRows=XLSX.utils.sheet_to_json(wb.Sheets[caseName],{header:1,raw:false,defval:''});
      let records=extractData(caseRows);

      const landName=findSheetName(wb.SheetNames,'土地');
      const buildingName=findSheetName(wb.SheetNames,'建物');
      const parkingName=findSheetName(wb.SheetNames,'車位');
      const landRows=landName?XLSX.utils.sheet_to_json(wb.Sheets[landName],{header:1,raw:false,defval:''}):[];
      const buildingRows=buildingName?XLSX.utils.sheet_to_json(wb.Sheets[buildingName],{header:1,raw:false,defval:''}):[];
      const parkingRows=parkingName?XLSX.utils.sheet_to_json(wb.Sheets[parkingName],{header:1,raw:false,defval:''}):[];
      records=enrichFromSubSheets(records,{
        land:parseSubSheet(landRows,'land'),
        building:parseSubSheet(buildingRows,'building'),
        parking:parseSubSheet(parkingRows,'parking')
      });

      const dataDate=detectDataDate(caseRows);
      saveCache(records,dataDate);

    }

    // ── CSV support ──────────────────────────────────────────────────────────
    const csvInput=document.getElementById('csvInput');
    function parseCsvLine(line){
      const out=[];let cur='',inQ=false;
      for(let i=0;i<line.length;i++){
        const c=line[i];
        if(inQ){if(c==='"'&&line[i+1]==='"'){cur+='"';i++;}else if(c==='"'){inQ=false;}else cur+=c;}
        else if(c==='"'){inQ=true;}
        else if(c===','){out.push(cur.trim());cur='';}
        else cur+=c;
      }
      out.push(cur.trim());return out;
    }
    function extractUnitFromAddr(addr){
      const s=String(addr||'').trim();
      let m=s.match(/([A-Za-z]?\d+之?\d*號)\s*$/);if(m)return m[1];
      m=s.match(/棟([A-Za-z\d]+)/);if(m)return `棟${m[1]}`;
      return s.split(/[市縣區道路街巷弄]/).filter(Boolean).pop()||s;
    }
    function extractFloorFromAddr(addr){const m=String(addr||'').match(/(\d+)\s*樓/);return m?Number(m[1]):null;}
    function parseCsvData(text){
      text=text.replace(/^﻿/,'');
      const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim());
      if(lines.length<2)throw new Error('CSV 資料不足（需有標題列與資料列）');
      const header=parseCsvLine(lines[0]);
      const col=Object.fromEntries(header.map((h,i)=>[h.trim(),i]));
      const g=(row,field)=>col[field]!==undefined?String(row[col[field]]||'').trim():'';
      const gv=(row,field)=>{const v=g(row,field);return(v&&v!=='undefined')?v:'';};
      const gn=(row,field)=>{const v=parseFloat(g(row,field));return Number.isFinite(v)?v:null;};
      const records=[];let skipped=0,noFloor=0,dataDate='';
      for(let i=1;i<lines.length;i++){
        const row=parseCsvLine(lines[i]);
        if(!row.length||!row.some(c=>c))continue;
        const addr=gv(row,'建物座落(門牌地址)');if(!addr){skipped++;continue;}
        if(!dataDate){const ym=g(row,'申報年月').replace(/[^\d]/g,'');if(ym.length>=5)dataDate=`${ym.slice(0,ym.length-2)}年${ym.slice(-2)}月`;}
        const 樓層概況=gv(row,'樓層概況');
        let floor=null;
        if(樓層概況){const m=樓層概況.match(/(-?\d+)\s*樓/);if(m)floor=Number(m[1]);}
        if(floor===null)floor=extractFloorFromAddr(addr);
        if(floor===null)noFloor++;
        // 從門牌提取戶別，移除末尾「號」讓格式與 XLS 相容（A7號→A7）
        const rawUnit=extractUnitFromAddr(addr).replace(/號\s*$/,'');
        const unit=normalizeUnit(rawUnit);
        const totalYuan=gn(row,'總價');
        const totalWan=totalYuan!==null?totalYuan/10000:null;
        const unitPrice=gn(row,'每坪單價(萬)');
        const bldgSqm=gn(row,'建物移轉平方公尺');
        const totalPing=bldgSqm!==null&&bldgSqm>0?bldgSqm/3.30578:null;
        const landSqm=gn(row,'土地移轉平方公尺');
        const landPing=landSqm!==null&&landSqm>0?landSqm/3.30578:null;
        const rooms=gv(row,'房').replace(/[^\d]/g,'');
        const halls=gv(row,'廳').replace(/[^\d]/g,'');
        const baths=gv(row,'衛').replace(/[^\d]/g,'');
        const layout=[rooms&&`${rooms}房`,halls&&`${halls}廳`,baths&&`${baths}衛`].filter(Boolean).join('');
        const ym=g(row,'交易年月').replace(/[^\d]/g,'');
        const txDate=ym.length>=5?`${ym.slice(0,ym.length-2)}年${ym.slice(-2)}月`:ym;
        const 物件數=gv(row,'物件數');
        const hasParking=物件數.includes('車位')&&!/車位0/.test(物件數);
        records.push({
          編號:String(i),建物坐落:addr,棟及號:unit,
          建案名稱:gv(row,'行政區')+gv(row,'地段'),
          交易日期:txDate,總價:totalWan,單價:unitPrice,
          總面積:totalPing,室內坪數:'',陽台坪數:'',車位坪數:'',土地坪數:landPing,
          主建物佔比:'',型態:gv(row,'型態'),
          樓別樓高:floor!==null?`${floor}樓`:'未知',樓層:floor,
          交易標的:物件數,交易筆棟數:物件數,建物格局:layout,
          車位總價:null,車位數量:hasParking?1:0,
          主要用途:gv(row,'申報用途'),主要建材:gv(row,'結構'),備註:gv(row,'車位類型'),
          土地明細:[],建物明細:[],車位明細:[],房屋總面積:totalPing
        });
      }
      if(!records.length)throw new Error(`CSV 中沒有可解析的記錄${skipped?`（${skipped} 筆略過）`:''}`);
      return{records,skipped,noFloor,dataDate:dataDate||new Date().toISOString().slice(0,10)};
    }

    // ── 交易趨勢圖 ──────────────────────────────────────────────────────────
    const TREND_COLORS=['#e8953f','#d64f41','#4a90d9','#5ba85a','#9b59b6','#16a085','#f39c12','#8e44ad','#2980b9','#c0392b'];

    function rocToISO(v){
      const s=String(v||'').trim();
      // 純數字民國日期：1131205
      const m1=s.match(/^(\d{2,3})(\d{2})(\d{2})$/);
      if(m1)return `${Number(m1[1])+1911}-${m1[2]}-${m1[3]}`;
      // 文字民國日期：113年12月05日 or 113年12月
      const m2=s.match(/(\d+)年\s*(\d+)月(?:\s*(\d+)日)?/);
      if(m2)return `${Number(m2[1])+1911}-${m2[2].padStart(2,'0')}-${m2[3]?m2[3].padStart(2,'0'):'15'}`;
      // 斜線/連字號：113/12/05 or 113-12-05
      const m3=s.match(/^(\d{2,3})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
      if(m3)return `${Number(m3[1])+1911}-${m3[2].padStart(2,'0')}-${m3[3].padStart(2,'0')}`;
      return '';
    }

    function floorBand(f){
      const n=Number(f);
      if(n<=5)return '1–5F';if(n<=10)return '6–10F';if(n<=15)return '11–15F';if(n<=20)return '16–20F';return '21F+';
    }

    let trendChartInst=null;

    function nextMonth(ym){
      const[y,m]=ym.split('-').map(Number);
      return m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`;
    }

    function buildTrendChart(records){
      const canvas=document.getElementById('trendChart');
      const withMonthFull=records.map(r=>{const iso=rocToISO(r.交易日期);return iso?{unit:r.棟及號,ym:iso.slice(0,7),record:r}:null;}).filter(Boolean);
      if(!withMonthFull.length){
        if(trendChartInst){trendChartInst.destroy();trendChartInst=null;}
        const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.save();ctx.fillStyle='#999';ctx.font='14px sans-serif';ctx.textAlign='center';
        ctx.fillText('無法解析交易日期資料',canvas.width/2,canvas.height/2);ctx.restore();
        return;
      }

      const sortedYms=withMonthFull.map(r=>r.ym).sort();
      const minYm=sortedYms[0],maxYm=sortedYms[sortedYms.length-1];
      const allMonths=[];let cur=minYm;while(cur<=maxYm){allMonths.push(cur);cur=nextMonth(cur);}

      const units=[...new Set(records.map(r=>r.棟及號))].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true}));
      const unitColors=units.map((_,i)=>TREND_COLORS[i%TREND_COLORS.length]);
      let hoveredIdx=-1;

      const datasets=units.map((unit,i)=>{
        const color=unitColors[i];
        const detailData=allMonths.map(ym=>withMonthFull.filter(r=>r.unit===unit&&r.ym===ym).map(r=>r.record));
        return{label:unit,data:detailData.map(d=>d.length||null),detailData,borderColor:color,backgroundColor:color+'33',pointRadius:3,pointHoverRadius:7,tension:0.1,borderWidth:2,fill:false,spanGaps:false};
      });

      // 線尾直接繪製棟及號標籤（固定顏色，向上偏移避免被線遮擋）
      const endLabelPlugin={
        id:'endLabel',
        afterDraw(chart){
          const c=chart.ctx;c.save();
          chart.data.datasets.forEach((ds,i)=>{
            const meta=chart.getDatasetMeta(i);
            if(meta.hidden||!meta.data.length)return;
            const lastNonNullIdx=ds.data.reduce((last,v,idx)=>v!==null?idx:last,-1);
            if(lastNonNullIdx<0)return;
            const pt=meta.data[lastNonNullIdx];
            c.globalAlpha=1;
            c.fillStyle=unitColors[i];
            c.font=`bold 11px -apple-system,sans-serif`;
            c.textAlign='left';c.textBaseline='bottom';
            c.fillText(ds.label,pt.x+6,pt.y-4);
          });
          c.restore();
        }
      };

      if(trendChartInst)trendChartInst.destroy();
      trendChartInst=new Chart(canvas.getContext('2d'),{
        type:'line',
        data:{labels:allMonths,datasets},
        plugins:[endLabelPlugin],
        options:{
          responsive:true,maintainAspectRatio:false,
          layout:{padding:{right:80}},
          interaction:{mode:'nearest',intersect:true},
          onHover:(_,active,chart)=>{
            const idx=active.length?active[0].datasetIndex:-1;
            if(idx===hoveredIdx)return;
            hoveredIdx=idx;
            chart.data.datasets.forEach((ds,i)=>{
              if(idx<0){ds.borderColor=unitColors[i];ds.borderWidth=2;}
              else if(i===idx){ds.borderColor=unitColors[i];ds.borderWidth=3;}
              else{ds.borderColor=unitColors[i]+'33';ds.borderWidth=1;}
            });
            chart.update('none');
          },
          onClick:(_,active)=>{
            if(!active.length)return;
            const{datasetIndex,index}=active[0];
            const ds=trendChartInst.data.datasets[datasetIndex];
            const month=allMonths[index];
            const count=ds.data[index];
            const details=ds.detailData[index]||[];
            const detailEl=document.getElementById('trendDetail');
            const tdStyle='padding:4px 6px;border-top:1px solid #e4dfd4';
            const rows=details.map(r=>{
              const up=calcUnitPrice(r,withParkingPrice);
              return`<tr>
                <td style="${tdStyle}">${r.交易日期||'-'}</td>
                <td style="${tdStyle};text-align:right">${formatAmount(r.總價,0)} 萬</td>
                <td style="${tdStyle};text-align:right">${up!==null?formatAmount(up,1)+' 萬/坪':'-'}</td>
                <td style="${tdStyle};text-align:right">${r.總面積?formatAmount(r.總面積,1)+' 坪':'-'}</td>
              </tr>`;
            }).join('');
            detailEl.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <span style="font-weight:800;font-size:15px;color:#2f2f2f">${ds.label}&ensp;<span style="font-weight:400;font-size:13px;color:#777">${month}</span></span>
              <span style="color:#e8953f;font-weight:700">成交 ${count} 筆</span>
              <button onclick="document.getElementById('trendDetail').style.display='none'" style="border:none;background:transparent;cursor:pointer;font-size:20px;color:#aaa;line-height:1">×</button>
            </div>
            ${rows?`<table style="width:100%;border-collapse:collapse;font-size:12px">
              <thead><tr style="color:#7f7a72">
                <th style="text-align:left;padding:3px 6px">交易日期</th>
                <th style="text-align:right;padding:3px 6px">總價</th>
                <th style="text-align:right;padding:3px 6px">單坪價</th>
                <th style="text-align:right;padding:3px 6px">坪數</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>`:'<div style="color:#999">無交易資料</div>'}`;
            detailEl.style.display='block';
          },
          scales:{
            x:{title:{display:true,text:'月份'},ticks:{maxRotation:45}},
            y:{title:{display:true,text:'交易戶數'},ticks:{stepSize:1,callback:v=>Number.isInteger(v)?v:null},beginAtZero:true},
          },
          plugins:{
            legend:{display:false},
            datalabels:{display:false},
            tooltip:{enabled:false},
          },
        },
      });
    }

    // ── 截止月份拖曳控制 ─────────────────────────────────────────────────────
    function toROCYM(ym){const[y,m]=ym.split('-').map(Number);return `${y-1911}年${m}月`}

    function computeDeadlineRange(){
      if(!currentRecords.length){deadlineMonthRange=[];return}
      const isos=currentRecords.map(r=>rocToISO(r.交易日期)).filter(Boolean);
      if(!isos.length){deadlineMonthRange=[];return}
      const yms=isos.map(d=>d.slice(0,7));
      const minYm=yms.slice().sort()[0];
      const today=new Date();
      const curYm=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
      const maxDataYm=yms.slice().sort().reverse()[0];
      const endYm=maxDataYm>curYm?maxDataYm:curYm;
      const range=[];let cur=minYm;
      while(cur<=endYm){range.push(cur);cur=nextMonth(cur);}
      deadlineMonthRange=range;
    }

    function getFilteredRecords(){
      if(!deadlineYM)return currentRecords;
      return currentRecords.filter(r=>{const iso=rocToISO(r.交易日期);return iso?iso.slice(0,7)<=deadlineYM:true});
    }

    function updateDeadlineUI(){
      const ctrl=document.getElementById('deadlineCtrl');
      const pill=document.getElementById('deadlinePill');
      const labelText=document.getElementById('deadlineLabelText');
      const bound=document.getElementById('deadlineBoundary');
      if(!currentRecords.length){ctrl.style.display='none';return}
      ctrl.style.display='flex';
      if(!deadlineYM){
        pill.classList.add('all-mode');
        labelText.textContent='全部';
        bound.textContent='';
      } else {
        pill.classList.remove('all-mode');
        labelText.textContent=toROCYM(deadlineYM);
        const idx=deadlineMonthRange.indexOf(deadlineYM);
        if(idx===0&&deadlineMonthRange.length>1)bound.textContent='最早';
        else if(idx===deadlineMonthRange.length-1&&deadlineMonthRange.length>1)bound.textContent='最新';
        else bound.textContent='';
      }
    }

    function setDeadlineYM(ym){
      deadlineYM=ym;updateDeadlineUI();
      const cached=loadCache();
      renderWithCsv(getFilteredRecords(),cached||{});
    }

    (function(){
      const PXPM=28;
      let dragging=false,dragStartX=0,dragStartIdx=0;

      function getCurrentIdx(){
        if(!deadlineYM||!deadlineMonthRange.length)return deadlineMonthRange.length-1;
        const i=deadlineMonthRange.indexOf(deadlineYM);
        return i<0?deadlineMonthRange.length-1:i;
      }

      const pill=document.getElementById('deadlinePill');
      const label=document.getElementById('deadlineLabel');
      const prevBtn=document.getElementById('deadlinePrev');
      const nextBtn=document.getElementById('deadlineNext');
      const allBtn=document.getElementById('deadlineAll');

      function startDrag(clientX){
        if(!deadlineMonthRange.length)return;
        dragging=true;dragStartX=clientX;dragStartIdx=getCurrentIdx();
        pill.classList.add('dragging');
      }
      function moveDrag(clientX){
        if(!dragging||!deadlineMonthRange.length)return;
        const shift=Math.round((clientX-dragStartX)/PXPM);
        const newIdx=Math.max(0,Math.min(deadlineMonthRange.length-1,dragStartIdx+shift));
        const newYm=deadlineMonthRange[newIdx];
        if(newYm!==deadlineYM){deadlineYM=newYm;updateDeadlineUI();const cached=loadCache();renderWithCsv(getFilteredRecords(),cached||{});}
      }
      function endDrag(){if(dragging){dragging=false;pill.classList.remove('dragging');}}

      label.addEventListener('mousedown',e=>{startDrag(e.clientX);e.preventDefault();});
      document.addEventListener('mousemove',e=>{moveDrag(e.clientX);});
      document.addEventListener('mouseup',endDrag);
      label.addEventListener('touchstart',e=>{startDrag(e.touches[0].clientX);e.preventDefault();},{passive:false});
      label.addEventListener('touchmove',e=>{moveDrag(e.touches[0].clientX);e.preventDefault();},{passive:false});
      label.addEventListener('touchend',endDrag);
      label.addEventListener('dblclick',()=>setDeadlineYM(null));

      prevBtn.addEventListener('click',()=>{
        if(!deadlineMonthRange.length)return;
        const i=getCurrentIdx();
        setDeadlineYM(i>0?deadlineMonthRange[i-1]:deadlineMonthRange[0]);
      });
      nextBtn.addEventListener('click',()=>{
        if(!deadlineMonthRange.length)return;
        const i=getCurrentIdx();
        if(i>=deadlineMonthRange.length-1)setDeadlineYM(null);
        else setDeadlineYM(deadlineMonthRange[i+1]);
      });
      allBtn.addEventListener('click',()=>setDeadlineYM(null));
    })();
    // ─────────────────────────────────────────────────────────────────────────
  </script>
</body>
</html>
