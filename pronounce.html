<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日語發音練習 · 第01–02課</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #273449;
    --border: #334155;
    --accent: #38bdf8;
    --accent-hover: #7dd3fc;
    --purple: #a78bfa;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --playing: #22d3ee;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'PingFang TC', 'Noto Sans TC', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 80px;
    line-height: 1.5;
  }

  .container { max-width: 980px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 20px; }

  h1 {
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    font-weight: 700;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }

  .subtitle { color: var(--muted); font-size: 0.9rem; }

  /* ---- 控制列 ---- */
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 18px;
    align-items: center;
  }

  .ctrl { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }

  select, input[type="search"] {
    background: #0f172a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.85rem;
    font-family: inherit;
    max-width: 100%;
  }

  select:focus, input[type="search"]:focus { outline: none; border-color: var(--accent); }

  input[type="range"] { accent-color: var(--accent); width: 110px; }

  .rate-val { font-variant-numeric: tabular-nums; color: var(--accent); min-width: 32px; }

  .switch { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .switch input { accent-color: var(--accent); width: 15px; height: 15px; }

  #search { flex: 1 1 200px; min-width: 160px; }

  .warn {
    margin-top: 10px;
    font-size: 0.82rem;
    color: #fca5a5;
    display: none;
  }

  /* ---- 頁碼索引 ---- */
  .pagenav {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .pagenav .label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--purple);
    margin-right: 2px;
    padding-left: 4px;
    border-left: 2px solid rgba(167, 139, 250, 0.5);
  }
  .pagenav .label:first-child { border-left: none; padding-left: 0; }

  .pagebtn {
    background: #0f172a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 0.85rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .pagebtn:hover { border-color: var(--accent); color: var(--accent); }
  .pagebtn.active { background: var(--accent); border-color: var(--accent); color: #0f172a; font-weight: 700; }

  /* ---- 頁區塊 ---- */
  .page { margin-bottom: 34px; scroll-margin-top: 74px; }

  .page-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 14px;
  }

  .page-no {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
  }

  .page-title { font-size: 1.05rem; font-weight: 600; }
  .page-lesson { font-size: 0.78rem; color: var(--muted); }
  .mp3-tag {
    font-size: 0.72rem;
    color: var(--purple);
    border: 1px solid rgba(167, 139, 250, 0.4);
    border-radius: 999px;
    padding: 2px 8px;
  }

  /* ---- 群組 ---- */
  .group { margin-bottom: 18px; }

  .group-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .group-name {
    font-size: 0.9rem;
    font-weight: 600;
    background: rgba(56, 189, 248, 0.14);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: var(--accent);
    border-radius: 8px;
    padding: 3px 10px;
  }

  .group-note { font-size: 0.78rem; color: var(--muted); }

  .playall {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 4px 11px;
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .playall:hover { border-color: var(--accent); color: var(--accent); }
  .playall.stop { border-color: #f87171; color: #f87171; }

  /* ---- 條目 ---- */
  .items { display: flex; flex-direction: column; gap: 6px; }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
    text-align: left;
    width: 100%;
    font-family: inherit;
    color: inherit;
  }

  .item:hover { background: var(--card-hover); border-left-color: var(--accent); }
  .item.playing { background: #0e3a45; border-color: var(--playing); border-left-color: var(--playing); }

  .accent {
    flex: 0 0 auto;
    min-width: 30px;
    text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem;
    color: var(--purple);
    background: rgba(167, 139, 250, 0.12);
    border-radius: 6px;
    padding: 2px 5px;
  }

  .body { flex: 1 1 auto; min-width: 0; }

  .jp {
    font-size: 1.05rem;
    font-weight: 600;
    word-break: break-word;
  }

  .jp .hl { color: var(--playing); text-decoration: underline; text-underline-offset: 3px; }

  .reading {
    font-size: 0.8rem;
    color: var(--accent);
    margin-top: 2px;
    word-break: break-word;
  }

  .kanji { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

  .zh {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 3px;
  }

  .zh .tag {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--purple);
    border: 1px solid rgba(167, 139, 250, 0.35);
    border-radius: 5px;
    padding: 0 5px;
    margin-left: 6px;
  }

  .note { font-size: 0.76rem; color: #64748b; margin-top: 3px; }

  .speaker {
    flex: 0 0 auto;
    font-size: 1.05rem;
    color: var(--muted);
    opacity: 0.6;
  }
  .item:hover .speaker { color: var(--accent); opacity: 1; }
  .item.playing .speaker { color: var(--playing); opacity: 1; }

  .speaker-name {
    flex: 0 0 auto;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--purple);
    min-width: 3.4em;
  }

  /* ---- 文法說明卡 ---- */
  .memo {
    background: rgba(56, 189, 248, 0.07);
    border: 1px dashed rgba(56, 189, 248, 0.35);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .memo b { color: var(--text); }
  .memo .hl { color: var(--playing); }

  .memo table.ref {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0 10px;
    font-size: 0.8rem;
    min-width: 520px;
  }
  .memo table.ref th, .memo table.ref td {
    border: 1px solid var(--border);
    padding: 5px 7px;
    text-align: center;
    vertical-align: middle;
  }
  .memo table.ref th { background: rgba(56, 189, 248, 0.12); color: var(--text); font-weight: 600; }
  .memo table.ref td { color: var(--text); }

  .empty { color: var(--muted); font-size: 0.9rem; padding: 20px 0; text-align: center; }

  footer {
    text-align: center;
    margin-top: 44px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  .hide-zh .zh, .hide-zh .note { display: none; }

  @media (max-width: 600px) {
    .item { gap: 9px; padding: 9px 10px; }
    .jp { font-size: 1rem; }
    .playall { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>日語發音練習 · 第01–02課</h1>
    <p class="subtitle">はじめまして、陳です。／洋服売り場はどこですか。· 以頁碼 016–043 為索引，點任一條目即可聽發音</p>
  </header>

  <div class="panel">
    <div class="controls">
      <div class="ctrl">
        <span>語音</span>
        <select id="voice"></select>
      </div>
      <div class="ctrl">
        <span>語速</span>
        <input type="range" id="rate" min="0.5" max="1.3" step="0.05" value="0.9">
        <span class="rate-val" id="rateVal">0.90</span>
      </div>
      <label class="switch"><input type="checkbox" id="repeat"><span>重複兩次</span></label>
      <label class="switch"><input type="checkbox" id="hideZh"><span>隱藏中文</span></label>
      <input type="search" id="search" placeholder="搜尋日文 / 漢字 / 中文…">
    </div>
    <p class="warn" id="warn">此瀏覽器不支援語音合成（Web Speech API），請改用 Chrome、Edge 或 Safari。</p>
  </div>

  <nav class="pagenav" id="pagenav"></nav>

  <main id="content"></main>

  <footer>
    <p>資料來源：課本第01～02課 P.016–P.043 · <a href="index.html">回工具總覽</a></p>
  </footer>
</div>

/* ============ 語音合成 ============ */
const synth = window.speechSynthesis;
const voiceSel = document.getElementById('voice');
const rateInput = document.getElementById('rate');
const rateVal = document.getElementById('rateVal');
const repeatChk = document.getElementById('repeat');
let voices = [];

if (!synth) {
  document.getElementById('warn').style.display = 'block';
}

function loadVoices() {
  if (!synth) return;
  voices = synth.getVoices().filter(v => /^ja/i.test(v.lang));
  const prev = voiceSel.value;
  voiceSel.innerHTML = '';
  if (!voices.length) {
    const opt = document.createElement('option');
    opt.textContent = '系統預設（未偵測到日文語音）';
    opt.value = '';
    voiceSel.appendChild(opt);
    return;
  }
  voices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = v.name + (v.localService ? '' : '（線上）');
    voiceSel.appendChild(opt);
  });
  if (prev && voiceSel.querySelector(`option[value="${prev}"]`)) voiceSel.value = prev;
}

if (synth) {
  loadVoices();
  synth.onvoiceschanged = loadVoices;
}

rateInput.addEventListener('input', () => { rateVal.textContent = Number(rateInput.value).toFixed(2); });

function makeUtterance(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = Number(rateInput.value);
  const v = voices[Number(voiceSel.value)];
  if (v) u.voice = v;
  return u;
}

/* 連續播放時，每一條之間停頓 0.5 秒 */
const GAP_MS = 500;

/* 播放序列：一次可排入多段文字，結束後執行 done */
let currentEl = null;
let sequence = null;   // { els, idx, btn }

function clearHighlight() {
  if (currentEl) currentEl.classList.remove('playing');
  currentEl = null;
}

function stopAll() {
  if (synth) synth.cancel();
  clearHighlight();
  if (sequence && sequence.btn) {
    sequence.btn.textContent = '▶ 全部播放';
    sequence.btn.classList.remove('stop');
  }
  sequence = null;
}

function speakEl(el, done) {
  if (!synth) return;
  const text = el.dataset.say;
  if (!text) { if (done) done(); return; }
  clearHighlight();
  el.classList.add('playing');
  currentEl = el;
  const times = repeatChk.checked ? 2 : 1;
  let n = 0;
  const run = () => {
    n++;
    const u = makeUtterance(text);
    u.onend = () => {
      if (n < times) { setTimeout(run, 220); return; }
      if (currentEl === el) el.classList.remove('playing');
      if (currentEl === el) currentEl = null;
      if (done) done();
    };
    u.onerror = () => {
      if (currentEl === el) el.classList.remove('playing');
      if (done) done();
    };
    synth.speak(u);
  };
  run();
}

function playSingle(el) {
  const wasPlaying = el.classList.contains('playing');
  stopAll();
  if (wasPlaying) return;   // 再點一次＝停止
  speakEl(el, null);
}

function playGroup(btn, container) {
  const running = sequence && sequence.btn === btn;
  stopAll();
  if (running) return;
  const els = [...container.querySelectorAll('.item')].filter(e => e.style.display !== 'none');
  if (!els.length) return;
  sequence = { els, idx: 0, btn };
  btn.textContent = '■ 停止';
  btn.classList.add('stop');
  const step = () => {
    if (!sequence || sequence.btn !== btn) return;
    if (sequence.idx >= els.length) { stopAll(); return; }
    const el = els[sequence.idx++];
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    speakEl(el, () => setTimeout(step, GAP_MS));
  };
  step();
}

/* ============ 建立畫面 ============ */
const content = document.getElementById('content');
const pagenav = document.getElementById('pagenav');

function sayTextOf(item) {
  return item.s || item.j || item.k || '';
}

function buildItem(item, type) {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'item';
  el.dataset.say = sayTextOf(item);
  el.dataset.search = [item.k, item.h, item.j, item.r, item.z, item.n, item.sp].filter(Boolean).join(' ').toLowerCase();

  if (type === 'word' && item.a) {
    const a = document.createElement('span');
    a.className = 'accent';
    a.textContent = item.a;
    el.appendChild(a);
  }
  if (item.sp) {
    const sp = document.createElement('span');
    sp.className = 'speaker-name';
    sp.textContent = item.sp + '：';
    el.appendChild(sp);
  }

  const body = document.createElement('div');
  body.className = 'body';

  const jp = document.createElement('div');
  jp.className = 'jp';
  jp.textContent = item.j || item.k;
  body.appendChild(jp);

  if (item.r) {
    const r = document.createElement('div');
    r.className = 'reading';
    r.innerHTML = item.r;          // 部分讀音含 <b class="hl"> 標記
    body.appendChild(r);
  }
  if (item.h) {
    const h = document.createElement('div');
    h.className = 'kanji';
    h.textContent = item.h;
    body.appendChild(h);
  }
  if (item.z) {
    const z = document.createElement('div');
    z.className = 'zh';
    z.textContent = item.z;
    if (item.tag) {
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = item.tag;
      z.appendChild(t);
    }
    body.appendChild(z);
  }
  if (item.n) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = '※ ' + item.n;
    body.appendChild(n);
  }

  el.appendChild(body);

  const sp = document.createElement('span');
  sp.className = 'speaker';
  sp.textContent = '🔊';
  el.appendChild(sp);

  el.addEventListener('click', () => playSingle(el));
  return el;
}

let lastCourse = '';
PAGES.forEach(p => {
  if (p.course !== lastCourse) {
    const lab = document.createElement('span');
    lab.className = 'label';
    lab.textContent = p.course;
    pagenav.appendChild(lab);
    lastCourse = p.course;
  }

  const btn = document.createElement('button');
  btn.className = 'pagebtn';
  btn.textContent = 'P.' + p.page;
  btn.dataset.page = p.page;
  btn.addEventListener('click', () => {
    document.getElementById('p' + p.page).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  pagenav.appendChild(btn);

  const sec = document.createElement('section');
  sec.className = 'page';
  sec.id = 'p' + p.page;

  const head = document.createElement('div');
  head.className = 'page-head';
  head.innerHTML = `<span class="page-no">${p.page}</span>` +
    `<span class="page-title">${p.title}</span>` +
    `<span class="page-lesson">${p.course === p.lesson ? p.course : p.course + ' · ' + p.lesson}</span>` +
    (p.mp3 ? `<span class="mp3-tag">${p.mp3}</span>` : '');
  sec.appendChild(head);

  if (p.memo) {
    const memo = document.createElement('div');
    memo.className = 'memo';
    memo.innerHTML = p.memo;
    sec.appendChild(memo);
  }

  p.groups.forEach(g => {
    const wrap = document.createElement('div');
    wrap.className = 'group';

    const gh = document.createElement('div');
    gh.className = 'group-head';
    gh.innerHTML = `<span class="group-name">${g.name}</span>` +
      (g.note ? `<span class="group-note">※ ${g.note}</span>` : '');

    const playBtn = document.createElement('button');
    playBtn.className = 'playall';
    playBtn.textContent = '▶ 全部播放';
    gh.appendChild(playBtn);
    wrap.appendChild(gh);

    const list = document.createElement('div');
    list.className = 'items';
    g.items.forEach(it => list.appendChild(buildItem(it, g.type)));
    wrap.appendChild(list);

    playBtn.addEventListener('click', () => playGroup(playBtn, list));

    sec.appendChild(wrap);
  });

  content.appendChild(sec);
});

/* ============ 搜尋 ============ */
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  stopAll();
  document.querySelectorAll('.page').forEach(sec => {
    let pageHit = 0;
    sec.querySelectorAll('.group').forEach(g => {
      let hit = 0;
      g.querySelectorAll('.item').forEach(it => {
        const show = !q || it.dataset.search.includes(q);
        it.style.display = show ? '' : 'none';
        if (show) hit++;
      });
      g.style.display = hit ? '' : 'none';
      pageHit += hit;
    });
    const memo = sec.querySelector('.memo');
    if (memo) memo.style.display = q ? 'none' : '';
    sec.style.display = (!q || pageHit) ? '' : 'none';
  });
});

/* ============ 隱藏中文 ============ */
document.getElementById('hideZh').addEventListener('change', e => {
  document.body.classList.toggle('hide-zh', e.target.checked);
});

/* ============ 捲動時標示目前頁碼 ============ */
const pageBtns = [...pagenav.querySelectorAll('.pagebtn')];
const obs = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    const id = en.target.id.slice(1);
    pageBtns.forEach(b => b.classList.toggle('active', b.dataset.page === id));
  });
}, { rootMargin: '-70px 0px -65% 0px' });
document.querySelectorAll('.page').forEach(s => obs.observe(s));

/* Esc 停止播放；離開頁面時取消語音 */
document.addEventListener('keydown', e => { if (e.key === 'Escape') stopAll(); });
window.addEventListener('beforeunload', () => { if (synth) synth.cancel(); });
