<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中油加油方式比較</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 20px 16px 40px;
      color: #2d3748;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #1a202c;
    }

    header p {
      margin-top: 6px;
      font-size: 0.9rem;
      color: #718096;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }

    .card-title {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #a0aec0;
      margin-bottom: 16px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
    }

    .input-group input {
      padding: 11px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #2d3748;
      outline: none;
      transition: border-color 0.18s;
      width: 100%;
    }

    .input-group input:focus { border-color: #4299e1; }

    .input-hint {
      font-size: 0.75rem;
      color: #a0aec0;
      margin-top: -10px;
      margin-bottom: 4px;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      background: #fffbeb;
      border: 2px solid #fbd38d;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.18s;
    }

    .toggle-label:hover { background: #fef3c7; }

    .toggle-label input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #d69e2e;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle-text {
      font-size: 0.92rem;
      font-weight: 600;
      color: #744210;
    }

    .toggle-sub {
      font-size: 0.78rem;
      color: #b7791f;
      font-weight: 400;
    }

    /* Results grid */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .method-card {
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .method-card.self-service {
      background: linear-gradient(145deg, #5a67d8, #434190);
      color: #fff;
    }

    .method-card.attended {
      background: linear-gradient(145deg, #e53e82, #b83280);
      color: #fff;
    }

    .method-card.winner {
      transform: scale(1.05);
      box-shadow: 0 8px 28px rgba(0,0,0,0.2);
    }

    .method-card.loser {
      opacity: 0.78;
    }

    .crown {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.4rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .method-name {
      font-size: 0.82rem;
      opacity: 0.85;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .method-cost {
      font-size: 1.9rem;
      font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.1;
    }

    .method-cost span {
      font-size: 1rem;
      font-weight: 600;
    }

    .method-benefit {
      font-size: 0.78rem;
      opacity: 0.85;
    }

    /* Verdict */
    .verdict {
      border-radius: 14px;
      padding: 16px 18px;
      text-align: center;
    }

    .verdict.self-wins {
      background: linear-gradient(135deg, #6b46c1, #553c9a);
      color: #fff;
    }

    .verdict.attended-wins {
      background: linear-gradient(135deg, #c53030, #9b2c2c);
      color: #fff;
    }

    .verdict.tie {
      background: linear-gradient(135deg, #2f855a, #276749);
      color: #fff;
    }

    .verdict-label {
      font-size: 0.78rem;
      opacity: 0.8;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .verdict-msg {
      font-size: 1.08rem;
      font-weight: 700;
    }

    .verdict-diff {
      font-size: 0.85rem;
      opacity: 0.88;
      margin-top: 4px;
    }

    /* Breakdown */
    .breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f7fafc;
      font-size: 0.88rem;
    }

    .breakdown-row:last-child { border-bottom: none; }

    .br-label { color: #718096; }

    .br-val { font-weight: 600; color: #2d3748; text-align: right; }

    .br-val.green { color: #2f855a; }
    .br-val.red { color: #c53030; }

    .section-divider {
      margin: 6px 0;
      border: none;
      border-top: 2px dashed #edf2f7;
    }

    /* Break-even box */
    .breakeven-box {
      background: #ebf8ff;
      border: 2px solid #bee3f8;
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #2c5282;
    }

    .breakeven-box strong { font-weight: 700; }

    .be-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .be-row:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>⛽ 中油加油比較</h1>
    <p>自助加油 vs 人工加油，哪個拿回饋更划算？</p>
  </header>

  <!-- Inputs -->
  <div class="card">
    <div class="card-title">加油設定</div>

    <div class="input-row">
      <div class="input-group">
        <label for="priceInput">人工油價（元/公升）</label>
        <input type="number" id="priceInput" value="30" min="1" step="0.1" inputmode="decimal">
      </div>
      <div class="input-group">
        <label for="litersInput">加油量（公升）</label>
        <input type="number" id="litersInput" value="30" min="1" step="1" inputmode="decimal">
      </div>
    </div>
    <p class="input-hint">自助加油每公升自動減 $0.8；油價可參考中油官網當週牌價</p>

    <label class="toggle-label" for="doubleCheck">
      <input type="checkbox" id="doubleCheck" checked>
      <div>
        <div class="toggle-text">🎯 雙倍點數活動</div>
        <div class="toggle-sub">人工加油每消費 $1 得 2 點（平常為 1 點）</div>
      </div>
    </label>
  </div>

  <!-- Results -->
  <div class="card">
    <div class="card-title">比較結果</div>

    <div class="results-grid">
      <div class="method-card self-service" id="selfCard">
        <div class="method-name">自助加油</div>
        <div class="method-cost"><span>$</span><span id="selfCostVal">—</span></div>
        <div class="method-benefit" id="selfBenefit">—</div>
      </div>
      <div class="method-card attended" id="attendedCard">
        <div class="method-name">人工加油</div>
        <div class="method-cost"><span>$</span><span id="attendedCostVal">—</span></div>
        <div class="method-benefit" id="attendedBenefit">—</div>
      </div>
    </div>

    <div class="verdict" id="verdict">
      <div class="verdict-label">綜合判斷</div>
      <div class="verdict-msg" id="verdictMsg">—</div>
      <div class="verdict-diff" id="verdictDiff"></div>
    </div>
  </div>

  <!-- Breakdown -->
  <div class="card">
    <div class="card-title">明細試算</div>

    <div class="breakdown-row">
      <span class="br-label">人工油價（標準）</span>
      <span class="br-val" id="brPriceAttended">—</span>
    </div>
    <div class="breakdown-row">
      <span class="br-label">自助油價（折扣後）</span>
      <span class="br-val" id="brPriceSelf">—</span>
    </div>
    <hr class="section-divider">
    <div class="breakdown-row">
      <span class="br-label">自助 ─ 實付金額</span>
      <span class="br-val" id="brSelfPaid">—</span>
    </div>
    <div class="breakdown-row">
      <span class="br-label">自助 ─ 省油錢</span>
      <span class="br-val green" id="brSelfSaved">—</span>
    </div>
    <hr class="section-divider">
    <div class="breakdown-row">
      <span class="br-label">人工 ─ 實付金額</span>
      <span class="br-val" id="brAttendedPaid">—</span>
    </div>
    <div class="breakdown-row">
      <span class="br-label">人工 ─ 獲得點數</span>
      <span class="br-val" id="brPoints">—</span>
    </div>
    <div class="breakdown-row">
      <span class="br-label">人工 ─ 點數折抵價值</span>
      <span class="br-val green" id="brPointsValue">—</span>
    </div>
    <div class="breakdown-row">
      <span class="br-label">人工 ─ 扣除點數後等效支出</span>
      <span class="br-val" id="brAttendedEffective">—</span>
    </div>

    <div class="breakeven-box" id="breakevenBox">
      <div class="be-row">
        <span>⚖️ 損益平衡油價（一般點數）</span>
        <strong id="beNormal">—</strong>
      </div>
      <div class="be-row">
        <span>⚖️ 損益平衡油價（雙倍點數）</span>
        <strong id="beDouble">—</strong>
      </div>
      <div style="margin-top:8px; font-size:0.8rem; color:#3182ce;">
        油價低於損益平衡點時，自助加油較划算；高於時，人工加油較划算。
      </div>
    </div>
  </div>

</div>

<script>
  const priceInput   = document.getElementById('priceInput');
  const litersInput  = document.getElementById('litersInput');
  const doubleCheck  = document.getElementById('doubleCheck');

  const selfCard        = document.getElementById('selfCard');
  const attendedCard    = document.getElementById('attendedCard');
  const selfCostVal     = document.getElementById('selfCostVal');
  const attendedCostVal = document.getElementById('attendedCostVal');
  const selfBenefit     = document.getElementById('selfBenefit');
  const attendedBenefit = document.getElementById('attendedBenefit');
  const verdict         = document.getElementById('verdict');
  const verdictMsg      = document.getElementById('verdictMsg');
  const verdictDiff     = document.getElementById('verdictDiff');

  function f1(n)  { return n.toFixed(1); }
  function f2(n)  { return n.toFixed(2); }
  function pct(n) { return (n * 100).toFixed(2) + '%'; }

  function removeCrowns() {
    document.querySelectorAll('.crown').forEach(el => el.remove());
  }

  function addCrown(card) {
    const crown = document.createElement('div');
    crown.className = 'crown';
    crown.textContent = '👑';
    card.appendChild(crown);
  }

  function calculate() {
    const price  = parseFloat(priceInput.value)  || 0;
    const liters = parseFloat(litersInput.value) || 0;
    const isDouble = doubleCheck.checked;

    if (price <= 0 || liters <= 0) return;

    // Self-service
    const selfPricePerL = price - 0.8;
    const selfPaid      = selfPricePerL * liters;
    const selfSaved     = 0.8 * liters;

    // Attended
    const attendedPaid  = price * liters;
    const pointRate     = isDouble ? 2 : 1;
    const points        = attendedPaid * pointRate;
    const pointsValue   = points / 100;          // 100 pts = $1
    const attendedEff   = attendedPaid - pointsValue;

    // Comparison
    const diff = selfPaid - attendedEff;   // negative = self wins, positive = attended wins
    const selfWins = diff < -0.005;
    const attendedWins = diff > 0.005;

    // --- Method cards ---
    selfCostVal.textContent     = f1(selfPaid);
    attendedCostVal.textContent = f1(attendedEff);
    selfBenefit.textContent     = `省油錢 $${f1(selfSaved)}`;
    attendedBenefit.textContent = `點數折抵 $${f1(pointsValue)}`;

    removeCrowns();
    selfCard.classList.remove('winner', 'loser');
    attendedCard.classList.remove('winner', 'loser');

    if (selfWins) {
      selfCard.classList.add('winner');
      attendedCard.classList.add('loser');
      addCrown(selfCard);
    } else if (attendedWins) {
      attendedCard.classList.add('winner');
      selfCard.classList.add('loser');
      addCrown(attendedCard);
    } else {
      selfCard.classList.add('winner');
      attendedCard.classList.add('winner');
    }

    // --- Verdict ---
    verdict.className = 'verdict';
    if (selfWins) {
      verdict.classList.add('self-wins');
      verdictMsg.textContent = '自助加油比較划算';
      verdictDiff.textContent = `每次省 $${f2(Math.abs(diff))}，比人工少花 ${pct(Math.abs(diff) / attendedEff)}`;
    } else if (attendedWins) {
      verdict.classList.add('attended-wins');
      verdictMsg.textContent = '人工加油比較划算';
      verdictDiff.textContent = `每次省 $${f2(Math.abs(diff))}，比自助少花 ${pct(Math.abs(diff) / selfPaid)}`;
    } else {
      verdict.classList.add('tie');
      verdictMsg.textContent = '兩者幾乎相同';
      verdictDiff.textContent = '差距 < $0.01，選方便的就好';
    }

    // --- Breakdown ---
    document.getElementById('brPriceAttended').textContent   = `$${f2(price)} / 公升`;
    document.getElementById('brPriceSelf').textContent       = `$${f2(selfPricePerL)} / 公升`;
    document.getElementById('brSelfPaid').textContent        = `$${f1(selfPaid)}`;
    document.getElementById('brSelfSaved').textContent       = `+$${f1(selfSaved)}（省油錢）`;
    document.getElementById('brAttendedPaid').textContent    = `$${f1(attendedPaid)}`;
    document.getElementById('brPoints').textContent          = `${Math.round(points)} 點${isDouble ? '（雙倍）' : ''}`;
    document.getElementById('brPointsValue').textContent     = `+$${f2(pointsValue)}（100 點 = $1）`;
    document.getElementById('brAttendedEffective').textContent = `$${f1(attendedEff)}`;

    // Break-even prices
    // P - 0.8 = P * (1 - rate/100)  =>  P = 80 / rate
    document.getElementById('beNormal').textContent = `$${f1(80)} / 公升`;
    document.getElementById('beDouble').textContent = `$${f1(40)} / 公升`;
  }

  priceInput.addEventListener('input', calculate);
  litersInput.addEventListener('input', calculate);
  doubleCheck.addEventListener('change', calculate);

  calculate();
</script>
</body>
</html>
