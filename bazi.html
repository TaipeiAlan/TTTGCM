<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八字命盤計算器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1520;
  --surface: #231d2c;
  --surface2: #2d2540;
  --surface3: #3a3050;
  --border: #3d3456;
  --border2: #4a4060;
  --gold: #c9a84c;
  --gold-light: #e8c97a;
  --gold-dim: #7a6330;
  --text: #e8e0d5;
  --text-muted: #8a7f96;
  --text-faint: #5a5268;
  --red: #e05c5c;
  --blue: #5c9de0;
  --green: #5cb87a;
  --earth: #c4924a;
  --metal: #b0bec5;
  --wood: #5cb87a;
  --fire: #e05c5c;
  --water: #5c9de0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}
a { color: var(--gold); text-decoration: none; }

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
header h1 {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.3rem;
  color: var(--gold);
  letter-spacing: 0.1em;
}
header .subtitle { font-size: 0.75rem; color: var(--text-muted); margin-left: 10px; }
.btn-print {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}
.btn-print:hover { border-color: var(--gold-dim); color: var(--gold); }

/* ── Layout ── */
main { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }

/* ── Cards ── */
.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  border-top: 3px solid var(--gold-dim);
}
.section-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.05rem;
  color: var(--gold);
  letter-spacing: 0.12em;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .icon { font-size: 1rem; }

/* ── Input Form ── */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}
.form-group input[type="date"],
.form-group select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 7px;
  font-size: 14px;
  font-family: 'Noto Sans TC', sans-serif;
  outline: none;
  transition: border-color 0.2s;
  appearance: none;
  -webkit-appearance: none;
}
.form-group input[type="date"]:focus,
.form-group select:focus { border-color: var(--gold-dim); }
.radio-group { display: flex; gap: 16px; padding: 6px 0; }
.radio-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; color: var(--text); margin-bottom: 0; }
.radio-group input[type="radio"] { accent-color: var(--gold); width: 15px; height: 15px; }
.check-group { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.check-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; color: var(--text-muted); margin-bottom: 0; }
.check-group input[type="checkbox"] { accent-color: var(--gold); width: 14px; height: 14px; }
.btn-calc {
  background: var(--gold-dim);
  border: 1px solid var(--gold);
  color: var(--gold-light);
  padding: 11px 28px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  font-family: 'Noto Serif TC', serif;
  letter-spacing: 0.15em;
  font-weight: 600;
  transition: all 0.2s;
  display: block;
  width: 100%;
  margin-top: 6px;
}
.btn-calc:hover { background: var(--gold); color: var(--bg); }
.error-msg { color: var(--red); font-size: 13px; margin-top: 10px; padding: 8px 12px; background: rgba(224,92,92,0.1); border-radius: 6px; border: 1px solid rgba(224,92,92,0.3); }
.warn-msg { color: var(--earth); font-size: 12px; margin-top: 8px; padding: 6px 10px; background: rgba(196,146,74,0.1); border-radius: 5px; border: 1px solid rgba(196,146,74,0.3); }

/* ── Element color classes ── */
.el-木 { color: var(--wood); }
.el-火 { color: var(--fire); }
.el-土 { color: var(--earth); }
.el-金 { color: var(--metal); }
.el-水 { color: var(--water); }

/* ── Pillars Grid ── */
.pillars-outer { overflow-x: auto; }
.pillars-grid {
  display: grid;
  grid-template-columns: 80px repeat(4, 1fr);
  min-width: 420px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.pg-row-label {
  background: var(--surface2);
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  padding: 10px 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--border);
  text-align: center;
}
.pg-cell {
  padding: 8px 6px;
  text-align: center;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.pg-cell:last-child { border-right: none; }
.pg-header {
  background: var(--surface2);
  color: var(--text-muted);
  font-size: 12px;
  letter-spacing: 0.1em;
  padding: 10px 6px;
  text-align: center;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.pg-header:last-child { border-right: none; }
.pg-header.day-col { background: var(--surface3); color: var(--gold); }
.pg-stem {
  font-family: 'Noto Serif TC', serif;
  font-size: 2rem;
  font-weight: 600;
  line-height: 1.2;
  padding: 12px 6px;
}
.pg-stem.day-col { background: var(--surface3); box-shadow: inset 0 0 0 2px var(--gold-dim); }
.pg-branch {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.8rem;
  font-weight: 600;
  padding: 10px 6px;
}
.pg-branch.day-col { background: var(--surface3); }
.pg-nayin { font-size: 11px; color: var(--text-muted); padding: 6px 4px; line-height: 1.4; }
.pg-tengod { font-size: 12px; padding: 6px 4px; font-weight: 500; }
.pg-tengod.day-col { color: var(--text-muted); font-style: italic; }
.pg-hidden { font-size: 11px; color: var(--text-muted); padding: 6px 4px; line-height: 1.5; }
.pg-hidden span { display: inline-block; margin: 1px 2px; padding: 1px 4px; border-radius: 3px; background: var(--surface2); }
.pg-lifestage { font-size: 11px; color: var(--text-faint); padding: 6px 4px; }
/* No-hour column dimmed */
.pg-cell.no-hour, .pg-stem.no-hour, .pg-branch.no-hour { opacity: 0.35; }
.row-divider { grid-column: 1 / -1; height: 1px; background: var(--border); display: none; }

/* ── Five Elements ── */
.wuxing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
@media (max-width: 520px) { .wuxing-grid { grid-template-columns: 1fr; } }
.wuxing-row { display: flex; align-items: center; gap: 10px; }
.wuxing-label { font-family: 'Noto Serif TC', serif; font-size: 1.3rem; font-weight: 600; width: 24px; text-align: center; flex-shrink: 0; }
.wuxing-bar-track { flex: 1; background: var(--surface2); border-radius: 4px; height: 10px; overflow: hidden; }
.wuxing-bar { height: 100%; border-radius: 4px; transition: width 0.5s; }
.wuxing-count { width: 36px; text-align: right; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
.wuxing-summary { margin-top: 14px; padding: 12px; background: var(--surface2); border-radius: 8px; font-size: 13px; }
.wuxing-summary .tag { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 12px; margin: 2px 3px; }
.tag-strong { background: rgba(201,168,76,0.2); color: var(--gold); border: 1px solid var(--gold-dim); }
.tag-weak   { background: rgba(90,128,120,0.2); color: #6cb8b0; border: 1px solid #3a7870; }
.tag-fav    { background: rgba(92,184,122,0.15); color: var(--green); border: 1px solid #3a7850; }
.tag-avoid  { background: rgba(224,92,92,0.15); color: var(--red); border: 1px solid #8a3030; }

/* ── Pattern Analysis ── */
.pattern-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.tg-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 14px;
  font-size: 12px; border: 1px solid var(--border2);
  background: var(--surface2);
}
.tg-chip .tg-pos { font-size: 10px; color: var(--text-faint); }
.pattern-note { font-size: 12px; color: var(--text-muted); margin-top: 8px; line-height: 1.7; }

/* ── Dayun Table ── */
.dayun-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.dayun-table th {
  background: var(--surface2);
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  font-weight: 500;
  padding: 8px 10px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.dayun-table td { padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--border); }
.dayun-table tr:last-child td { border-bottom: none; }
.dayun-table tr.active-cycle { background: rgba(201,168,76,0.08); }
.dayun-table tr.active-cycle td:first-child { border-left: 3px solid var(--gold); }
.dayun-big { font-family: 'Noto Serif TC', serif; font-size: 1.3rem; font-weight: 600; }
.dayun-age { color: var(--gold); font-size: 12px; }
.dayun-year-range { color: var(--text-muted); font-size: 11px; }
.dayun-nayin { color: var(--text-muted); font-size: 11px; }
.start-age-note { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; padding: 8px 12px; background: var(--surface2); border-radius: 6px; }
.start-age-note strong { color: var(--gold); }

/* ── Liu Nian Table ── */
.liuyear-wrap { overflow-x: auto; }
.liuyear-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 560px; }
.liuyear-table th {
  background: var(--surface2);
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  padding: 7px 8px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  font-weight: 500;
}
.liuyear-table td { padding: 7px 8px; text-align: center; border-bottom: 1px solid var(--border); }
.liuyear-table tr:last-child td { border-bottom: none; }
.liuyear-table tr.current-year { background: rgba(201,168,76,0.1); }
.liuyear-table tr.current-year td { color: var(--gold-light); }
.liuyear-table tr.current-year td:first-child { border-left: 3px solid var(--gold); font-weight: 600; }
.ly-jiazi { font-family: 'Noto Serif TC', serif; font-size: 1.1rem; font-weight: 600; }

/* ── Interpretation Enhanced ── */
.interp-block { margin-bottom: 14px; }
.interp-block h4 { color: var(--gold); font-size: 13px; margin-bottom: 8px; letter-spacing: 0.08em; font-family: 'Noto Serif TC', serif; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.interp-block p { font-size: 13px; color: var(--text); line-height: 1.9; }
.interp-divider { height: 1px; background: var(--border); margin: 16px 0; }
.interp-domain { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 10px 0; }
.domain-card { background: var(--surface2); border-radius: 8px; padding: 12px 14px; border-left: 3px solid var(--border2); }
.domain-card.good    { border-left-color: var(--green); }
.domain-card.caution { border-left-color: var(--red); }
.domain-title { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.06em; }
.domain-rating { font-size: 11px; padding: 2px 8px; border-radius: 10px; display: inline-block; }
.rating-good    { background: rgba(92,184,122,0.2); color: var(--green); border: 1px solid rgba(92,184,122,0.4); }
.rating-ok      { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid rgba(201,168,76,0.3); }
.rating-caution { background: rgba(224,92,92,0.15); color: var(--red); border: 1px solid rgba(224,92,92,0.3); }
.verdict-badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; }
.verdict-good { background: rgba(92,184,122,0.2); color: var(--green); }
.verdict-ok   { background: rgba(201,168,76,0.15); color: var(--gold); }
.verdict-bad  { background: rgba(224,92,92,0.15); color: var(--red); }
.tg-legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 8px; margin-top: 10px; }
.tg-legend-item { display: flex; gap: 8px; padding: 9px 11px; background: var(--surface2); border-radius: 7px; align-items: flex-start; border: 1px solid var(--border); }
.tg-legend-name { font-family: 'Noto Serif TC', serif; font-size: 1.05rem; font-weight: 700; flex-shrink: 0; width: 30px; }
.tg-legend-body { flex: 1; min-width: 0; }
.tg-legend-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.tg-legend-desc { font-size: 12px; line-height: 1.6; color: var(--text); }
.interp-list { list-style: none; padding: 0; margin: 6px 0; }
.interp-list li { padding: 3px 0; font-size: 13px; line-height: 1.8; }
.interp-list li::before { content: '▸ '; color: var(--gold-dim); }
.luck-good { background: rgba(92,184,122,0.2); color: var(--green); padding: 1px 7px; border-radius: 8px; font-size: 11px; }
.luck-ok   { background: rgba(201,168,76,0.12); color: var(--gold); padding: 1px 7px; border-radius: 8px; font-size: 11px; }
.luck-bad  { background: rgba(224,92,92,0.15); color: var(--red); padding: 1px 7px; border-radius: 8px; font-size: 11px; }
.el-block { padding: 9px 12px; background: var(--surface2); border-radius: 7px; border-left: 3px solid; }
.el-desc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-top: 12px; }

/* ── Responsive ── */
@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr 1fr; }
  header h1 { font-size: 1.1rem; }
  .section-card { padding: 14px; }
}
@media (max-width: 400px) {
  .form-grid { grid-template-columns: 1fr; }
}

/* ── Print ── */
@media print {
  body { background: #fff; color: #000; font-size: 12px; }
  header .btn-print, #input-section, .no-print { display: none !important; }
  #result-section { display: block !important; }
  .section-card { background: #fff; border: 1px solid #ccc; border-top: 2px solid #888; break-inside: avoid; margin-bottom: 12px; }
  .section-title { color: #333; border-color: #ccc; }
  .pillars-grid { border-color: #ccc; }
  .pg-cell, .pg-header, .pg-row-label { background: #fff !important; border-color: #ccc; }
  .pg-stem, .pg-branch { color: #000 !important; }
  .el-木 { color: #2a6a3a !important; }
  .el-火 { color: #8a2020 !important; }
  .el-土 { color: #7a5020 !important; }
  .el-金 { color: #555 !important; }
  .el-水 { color: #1a4a8a !important; }
  .dayun-table th, .dayun-table td, .liuyear-table th, .liuyear-table td { border-color: #ccc; }
}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center">
    <h1>八字命盤計算器</h1>
    <span class="subtitle">四柱推命 · 純前端計算</span>
  </div>
  <button class="btn-print no-print" onclick="window.print()">列印命盤</button>
</header>

<main>

<!-- Input -->
<section id="input-section" class="section-card">
  <div class="section-title"><span class="icon">✦</span>生辰資料輸入</div>
  <div class="form-grid">
    <div class="form-group">
      <label>出生日期</label>
      <input type="date" id="inp-date" required>
    </div>
    <div class="form-group">
      <label>出生時辰（24小時制）</label>
      <select id="inp-hour">
        <option value="0">00時｜子時（前）23:00–01:00</option>
        <option value="1">01時｜丑時（前）01:00–03:00</option>
        <option value="2">02時｜丑時　01:00–03:00</option>
        <option value="3">03時｜寅時　03:00–05:00</option>
        <option value="4">04時｜寅時　03:00–05:00</option>
        <option value="5">05時｜卯時　05:00–07:00</option>
        <option value="6">06時｜卯時　05:00–07:00</option>
        <option value="7">07時｜辰時　07:00–09:00</option>
        <option value="8">08時｜辰時　07:00–09:00</option>
        <option value="9">09時｜巳時　09:00–11:00</option>
        <option value="10">10時｜巳時　09:00–11:00</option>
        <option value="11">11時｜午時　11:00–13:00</option>
        <option value="12">12時｜午時　11:00–13:00</option>
        <option value="13">13時｜未時　13:00–15:00</option>
        <option value="14">14時｜未時　13:00–15:00</option>
        <option value="15">15時｜申時　15:00–17:00</option>
        <option value="16">16時｜申時　15:00–17:00</option>
        <option value="17">17時｜酉時　17:00–19:00</option>
        <option value="18">18時｜酉時　17:00–19:00</option>
        <option value="19">19時｜戌時　19:00–21:00</option>
        <option value="20">20時｜戌時　19:00–21:00</option>
        <option value="21">21時｜亥時　21:00–23:00</option>
        <option value="22">22時｜亥時　21:00–23:00</option>
        <option value="23">23時｜子時（後）23:00–01:00</option>
      </select>
    </div>
    <div class="form-group">
      <label>性別</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="male" checked> 男</label>
        <label><input type="radio" name="gender" value="female"> 女</label>
      </div>
    </div>
    <div class="form-group">
      <label>選項</label>
      <div class="check-group">
        <label><input type="checkbox" id="inp-unknown-time"> 時辰不詳（不排時柱）</label>
      </div>
    </div>
  </div>
  <button class="btn-calc" onclick="calculate()">排　命　盤</button>
  <div id="calc-error" class="error-msg" style="display:none"></div>
  <div id="calc-warn" class="warn-msg" style="display:none"></div>
</section>

<!-- Result (hidden until calculated) -->
<section id="result-section" style="display:none">

  <!-- 四柱八字 -->
  <div class="section-card" id="pillars-section">
    <div class="section-title"><span class="icon">☰</span>四柱八字</div>
    <div class="pillars-outer">
      <div class="pillars-grid" id="pillars-grid"></div>
    </div>
  </div>

  <!-- 五行分析 -->
  <div class="section-card" id="wuxing-section">
    <div class="section-title"><span class="icon">◈</span>五行分析</div>
    <div class="wuxing-grid" id="wuxing-chart"></div>
    <div class="wuxing-summary" id="wuxing-summary"></div>
  </div>

  <!-- 格局十神 -->
  <div class="section-card" id="pattern-section">
    <div class="section-title"><span class="icon">◉</span>格局分析</div>
    <div id="pattern-content"></div>
  </div>

  <!-- 大運 -->
  <div class="section-card" id="dayun-section">
    <div class="section-title"><span class="icon">◎</span>大運</div>
    <div id="dayun-content"></div>
  </div>

  <!-- 流年 -->
  <div class="section-card" id="liuyear-section">
    <div class="section-title"><span class="icon">◷</span>流年（近二十五年）</div>
    <div class="liuyear-wrap">
      <table class="liuyear-table" id="liuyear-table"></table>
    </div>
  </div>

  <!-- 命盤解讀 -->
  <div class="section-card" id="interpret-section">
    <div class="section-title"><span class="icon">✧</span>命盤解讀</div>
    <div id="interpret-content"></div>
  </div>

</section>

</main>

<script>
// ─── Data Tables ──────────────────────────────────────────────────────────────

const STEMS = [
  { char:'甲', element:'木', yin:false },

// ─── Solar Term Engine ────────────────────────────────────────────────────────

function deg2rad(d) { return d * Math.PI / 180; }

function sunLongitude(jd) {
  const T = (jd - 2451545.0) / 36525.0;
  let L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  let M  = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  M = ((M % 360) + 360) % 360;
  const Mr = deg2rad(M);
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr)
           + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr)
           + 0.000289 * Math.sin(3 * Mr);
  return ((L0 + C) % 360 + 360) % 360;
}

// Newton-Raphson: find JD when sun reaches ecliptic longitude `lon`
function solarTermJD(year, lon) {
  // Initial estimate adjusted for J2000.0 mean longitude (~280.47°)
  const L0_J2000 = 280.46646;
  let lonDiff = lon - L0_J2000;
  while (lonDiff < 0) lonDiff += 360;
  let jd = 2451545.0 + (year - 2000.0) * 365.25 + (lonDiff / 360.0) * 365.25;
  for (let i = 0; i < 50; i++) {
    let diff = lon - sunLongitude(jd);
    if (diff > 180)  diff -= 360;
    if (diff < -180) diff += 360;
    const step = diff * (365.25 / 360.0);
    jd += step;
    if (Math.abs(step) < 1e-6) break;
  }
  return jd;
}

// JD to UTC date object
function jdToDate(jd) {
  const z = Math.floor(jd + 0.5);
  const f = (jd + 0.5) - z;
  let A;
  if (z < 2299161) {
    A = z;
  } else {
    const alpha = Math.floor((z - 1867216.25) / 36524.25);
    A = z + 1 + alpha - Math.floor(alpha / 4);
  }
  const B = A + 1524;
  const C = Math.floor((B - 122.1) / 365.25);
  const D = Math.floor(365.25 * C);
  const E = Math.floor((B - D) / 30.6001);
  const day  = B - D - Math.floor(30.6001 * E);
  const month = E < 14 ? E - 1 : E - 13;
  const year = month > 2 ? C - 4716 : C - 4715;
  const hour = f * 24;
  return { year, month, day, hour };
}

// Get CST (UTC+8) Date for the moment sun reaches lon in the given year
function getSolarTermDate(year, lon) {
  const jd = solarTermJD(year, lon);
  // Add 8 hours for CST
  const cstJd = jd + 8 / 24;
  const d = jdToDate(cstJd);
  return new Date(d.year, d.month - 1, d.day, Math.floor(d.hour), Math.round((d.hour % 1) * 60));
}

// Gregorian date → Julian Day Number
function dateToJDN(y, m, d) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524;
}

// Find the nearest JIE in the given direction from birthDate
// direction: 'forward' (next jie after birth) or 'backward' (prev jie before birth)
function findNearestJie(birthDate, direction) {
  const by = birthDate.getFullYear();
  let best = null;
  let bestDiff = Infinity;

  // Search ±2 years to cover all edge cases
  for (let yr = by - 2; yr <= by + 2; yr++) {
    for (const jie of JIE_TERMS) {
      const d = getSolarTermDate(yr, jie.lon);
      const diff = d - birthDate; // ms
      if (direction === 'forward' && diff > 0 && diff < bestDiff) {
        bestDiff = diff;
        best = { date: d, name: jie.name, lon: jie.lon };
      } else if (direction === 'backward' && diff < 0 && -diff < bestDiff) {
        bestDiff = -diff;
        best = { date: d, name: jie.name, lon: jie.lon };
      }
    }
  }
  return best;
}

// ─── Pillar Calculations ──────────────────────────────────────────────────────

function getYearPillar(gYear, birthDate) {
  const lichun = getSolarTermDate(gYear, 315);
  const baziYear = birthDate < lichun ? gYear - 1 : gYear;
  const stemIdx   = ((baziYear - 4) % 10 + 10) % 10;
  const branchIdx = ((baziYear - 4) % 12 + 12) % 12;
  return { stemIdx, branchIdx, stem: STEMS[stemIdx], branch: BRANCHES[branchIdx], baziYear };
}

function getMonthPillar(birthDate, yearStemIdx) {
  const by = birthDate.getFullYear();

  // Find which JIE boundary the birth date most recently passed
  let activeTerm = null;
  let activeDiff = Infinity;

  // Check current year and adjacent years
  for (let yr = by - 1; yr <= by + 1; yr++) {
    for (const jie of JIE_TERMS) {
      const d = getSolarTermDate(yr, jie.lon);
      const diff = birthDate - d; // ms; positive = birth is after this term
      if (diff >= 0 && diff < activeDiff) {
        activeDiff = diff;
        activeTerm = jie;
      }
    }
  }

  if (!activeTerm) activeTerm = JIE_TERMS[0]; // fallback

  const monthBranchIdx = activeTerm.monthBranchIdx;
  // Offset from 寅(2) in the sequence 寅卯辰巳午未申酉戌亥子丑 (0..11)
  const offset = (monthBranchIdx - 2 + 12) % 12;
  const monthStemStart = MONTH_STEM_START[yearStemIdx % 5];
  const stemIdx = (monthStemStart + offset) % 10;
  return { stemIdx, branchIdx: monthBranchIdx, stem: STEMS[stemIdx], branch: BRANCHES[monthBranchIdx] };
}

function getDayPillar(y, m, d) {
  const jdn = dateToJDN(y, m, d);
  // Anchor: JDN 2415021 = 1900-01-01 CST (甲辰日, cycle index 40)
  const ANCHOR_JDN = 2415021;
  const ANCHOR_CYCLE = 40;
  const diff = jdn - ANCHOR_JDN;
  const cycle60 = ((diff + ANCHOR_CYCLE) % 60 + 60) % 60;
  const stemIdx   = cycle60 % 10;
  const branchIdx = cycle60 % 12;
  return { stemIdx, branchIdx, stem: STEMS[stemIdx], branch: BRANCHES[branchIdx], cycle60 };
}

function getHourPillar(hour, dayStemIdx) {
  // 子時: 23:00–00:59 → branch 0; 丑時: 01:00–02:59 → branch 1; ...
  const branchIdx = Math.floor((hour + 1) / 2) % 12;
  const hourStemStart = MONTH_STEM_START[dayStemIdx % 5]; // same formula as Five Rat
  const stemIdx = (hourStemStart + branchIdx) % 10;
  return { stemIdx, branchIdx, stem: STEMS[stemIdx], branch: BRANCHES[branchIdx] };
}

function computePillars(year, month, day, hour, gender, unknownTime) {
  const birthDate = new Date(year, month - 1, day, hour, 0, 0);
  const yearP  = getYearPillar(year, birthDate);
  const monthP = getMonthPillar(birthDate, yearP.stemIdx);
  const dayP   = getDayPillar(year, month, day);
  const hourP  = unknownTime ? null : getHourPillar(hour, dayP.stemIdx);
  return { year: yearP, month: monthP, day: dayP, hour: hourP, birthDate, baziYear: yearP.baziYear };
}

// ─── Jiazi 60-cycle index ─────────────────────────────────────────────────────

function jiazi60Idx(stemIdx, branchIdx) {
  // Find n in [0,59] where n%10===stemIdx && n%12===branchIdx
  for (let n = 0; n < 60; n++) {
    if (n % 10 === stemIdx && n % 12 === branchIdx) return n;
  }
  return 0; // invalid combination
}

function getNayin(stemIdx, branchIdx) {
  const idx = jiazi60Idx(stemIdx, branchIdx);
  const pairIdx = Math.floor(idx / 2);
  return { name: NAYIN_NAMES[pairIdx], element: NAYIN_ELEMENTS[pairIdx] };
}

// ─── Ten Gods ─────────────────────────────────────────────────────────────────

function elementRelation(masterEl, targetEl) {
  if (masterEl === targetEl) return 'same';
  if (ELEMENT_PRODUCES[masterEl] === targetEl) return 'produces';
  if (ELEMENT_PRODUCES[targetEl] === masterEl) return 'produced_by';
  if (ELEMENT_CONTROLS[masterEl] === targetEl) return 'controls';
  return 'controlled_by'; // targetEl controls masterEl
}

function getTenGod(masterStemIdx, targetStemIdx) {
  const master = STEMS[masterStemIdx];
  const target = STEMS[targetStemIdx];
  const rel = elementRelation(master.element, target.element);
  const same = master.yin === target.yin;
  switch (rel) {
    case 'same':         return same ? '比肩' : '劫財';
    case 'produces':     return same ? '食神' : '傷官';
    case 'controlled_by': return same ? '七殺' : '正官';  // target controls master = 官
    case 'controls':      return same ? '偏財' : '正財';  // master controls target = 財
    case 'produced_by':  return same ? '偏印' : '正印';
  }
}

function getBranchTenGod(masterStemIdx, branchIdx) {
  return getTenGod(masterStemIdx, BRANCHES[branchIdx].hidden[0]);
}

function getHiddenStemTenGods(masterStemIdx, branchIdx) {
  return BRANCHES[branchIdx].hidden.map(hi => ({
    stemIdx: hi,
    char: STEMS[hi].char,
    element: STEMS[hi].element,
    tenGod: getTenGod(masterStemIdx, hi),
  }));
}

// ─── Life Stage ───────────────────────────────────────────────────────────────

function getLifeStage(stemIdx, branchIdx) {
  const stemChar = STEMS[stemIdx].char;
  const startBranch = LIFE_STAGE_START_BRANCH[stemChar];
  const isYang = !STEMS[stemIdx].yin;
  const offset = isYang
    ? (branchIdx - startBranch + 12) % 12
    : (startBranch - branchIdx + 12) % 12;
  return LIFE_STAGES[offset];
}

// ─── Five Elements Analysis ───────────────────────────────────────────────────

function countFiveElements(pillars) {
  const counts = { '木':0, '火':0, '土':0, '金':0, '水':0 };
  const ps = [pillars.year, pillars.month, pillars.day, pillars.hour].filter(Boolean);
  ps.forEach(p => {
    counts[p.stem.element] += 1;
    const hidden = BRANCHES[p.branchIdx].hidden;
    counts[STEMS[hidden[0]].element] += 1;
    hidden.slice(1).forEach(hi => { counts[STEMS[hi].element] += 0.5; });
  });
  return counts;
}

function assessDayMasterStrength(pillars, masterStemIdx) {
  const master = STEMS[masterStemIdx];
  const monthEl = pillars.month.branch.element;
  const counts = countFiveElements(pillars);

  // Elements that help day master: same element, or element that produces master
  const helperEl = Object.keys(ELEMENT_PRODUCES).find(k => ELEMENT_PRODUCES[k] === master.element);
  const supportScore = (counts[master.element] || 0) + (helperEl ? (counts[helperEl] || 0) : 0);
  const totalScore = Object.values(counts).reduce((a,b) => a+b, 0);

  // Season support via month branch
  let seasonBonus = 0;
  if (monthEl === master.element) seasonBonus = 2;
  else if (ELEMENT_PRODUCES[monthEl] === master.element) seasonBonus = 1;
  else if (ELEMENT_CONTROLS[monthEl] === master.element || ELEMENT_CONTROLS[master.element] === monthEl) seasonBonus = -1;

  const ratio = (supportScore + seasonBonus) / (totalScore || 1);
  let strength, label;
  if (ratio >= 0.45) { strength = 'strong'; label = '身強'; }
  else if (ratio <= 0.30) { strength = 'weak'; label = '身弱'; }
  else { strength = 'neutral'; label = '中和'; }

  // Favorable elements
  let favEl, avoidEl;
  if (strength === 'strong') {
    // Need to exhaust / control / outlet
    favEl  = [ELEMENT_PRODUCES[master.element], ELEMENT_CONTROLS[master.element]];
    avoidEl = [master.element, helperEl].filter(Boolean);
  } else if (strength === 'weak') {
    favEl  = [master.element, helperEl].filter(Boolean);
    avoidEl = [ELEMENT_PRODUCES[master.element], ELEMENT_CONTROLS[master.element]];
  } else {
    favEl  = [ELEMENT_PRODUCES[master.element]];
    avoidEl = [];
  }

  return { strength, label, ratio: ratio.toFixed(2), favEl, avoidEl, seasonBonus };
}

// ─── Major Cycles (大運) ──────────────────────────────────────────────────────

function getDayunDirection(yearStemIdx, gender) {
  const isYangStem = (yearStemIdx % 2 === 0);
  return (isYangStem && gender === 'male') || (!isYangStem && gender === 'female')
    ? 'forward' : 'backward';
}

function getDayunStartAge(birthDate, direction) {
  const jie = findNearestJie(birthDate, direction);
  const diffMs = Math.abs(jie.date - birthDate);
  const diffDays = diffMs / (1000 * 60 * 60 * 24);
  const totalMonths = diffDays / 3; // 3 days = 1 month; 30 days = 10 years... actually 1 day = 4 months
  // Correct: 1 year = 3 days, so totalYears = diffDays / 3
  const totalYears = diffDays / 3;
  const years  = Math.floor(totalYears);
  const months = Math.round((totalYears - years) * 12);
  return { totalYears, years, months, diffDays, startJie: jie };
}

function computeDayun(monthPillar, direction, startAgeData, birthYear) {
  const step = direction === 'forward' ? 1 : -1;
  let stemIdx   = monthPillar.stemIdx;
  let branchIdx = monthPillar.branchIdx;
  const cycles = [];
  const ageOffset = startAgeData.months >= 6 ? 1 : 0;

  for (let i = 0; i < 10; i++) {
    stemIdx   = ((stemIdx   + step) % 10 + 10) % 10;
    branchIdx = ((branchIdx + step) % 12 + 12) % 12;
    const ageStart = startAgeData.years + ageOffset + i * 10;
    const ageEnd   = ageStart + 9;
    const yearStart = birthYear + ageStart;
    const yearEnd   = birthYear + ageEnd;
    cycles.push({
      stemIdx, branchIdx,
      stem: STEMS[stemIdx],
      branch: BRANCHES[branchIdx],
      nayin: getNayin(stemIdx, branchIdx),
      ageStart, ageEnd, yearStart, yearEnd,
    });
  }
  return cycles;
}

// ─── Annual Fortune (流年) ────────────────────────────────────────────────────

function computeLiuNian(baziYear, dayunCycles, masterStemIdx, currentYear) {
  const startYear = currentYear - 10;
  const endYear   = currentYear + 14;
  const results = [];
  for (let y = startYear; y <= endYear; y++) {
    const stemIdx   = ((y - 4) % 10 + 10) % 10;
    const branchIdx = ((y - 4) % 12 + 12) % 12;
    const age = y - baziYear;
    const dayunIdx = dayunCycles.findIndex(d => age >= d.ageStart && age <= d.ageEnd);
    results.push({
      year: y, stemIdx, branchIdx,
      stem: STEMS[stemIdx], branch: BRANCHES[branchIdx],
      nayin: getNayin(stemIdx, branchIdx),
      age,
      dayunIdx,
      tenGodStem:   getTenGod(masterStemIdx, stemIdx),
      tenGodBranch: getBranchTenGod(masterStemIdx, branchIdx),
      isCurrent: y === currentYear,
    });
  }
  return results;
}

    notes.push({ t:'good',   s:'七殺有制（食神制殺或印化殺）：魄力強且方向明確，壓力轉化為動力，成就顯著。' });

    notes.push({ t:'good',   s:'食神格：個性樂觀，才藝出眾，衣食豐足，長壽之象，有制殺護身之功。' });
  if (tgCounts['傷官'] >= 1 && tgCounts['正官'] >= 1)
    notes.push({ t:'caution',s:'傷官見官：才華洋溢但易得罪上司，官司是非較多，宜自行創業或技術型職業。' });

    notes.push({ t:'good',   s:'傷官生財：憑才智創造財富，財運活躍，適合業務、創業或自由職業。' });
  if ((tgCounts['正財'] >= 1 || tgCounts['偏財'] >= 1) && strength === 'strong')
    notes.push({ t:'good',   s:'身強有財：有能力掌握財富，財運佳，事業財富兩得。' });
  if ((tgCounts['正財'] >= 1 || tgCounts['偏財'] >= 1) && strength === 'weak')
    notes.push({ t:'caution',s:'財多身弱：財源不少但難以留住，宜先增強自身能量（行印運、比劫運）再求財。' });
  if ((tgCounts['正印'] || 0) + (tgCounts['偏印'] || 0) >= 2)
    notes.push({ t:'ok',     s:'印星旺：學習力強，貴人緣好，靠腦力或學術取得成就，行動力需主動加強。' });

    notes.push({ t:'caution',s:'比劫過旺：競爭心強，須防財散及合夥糾紛，個性需避免過於自我。' });
  if (notes.length === 0)
    notes.push({ t:'ok',     s:'命盤諸星調和，格局穩正，宜依大運流年把握時機，穩步前進。' });

  const lblMap = { good:'吉', ok:'平', caution:'注意' };
  const noteHtml = notes.map(n =>
    `<div style="display:flex;align-items:flex-start;gap:8px;margin:6px 0;font-size:13px;line-height:1.7">
      <span class="luck-${n.t === 'caution' ? 'bad' : n.t}" style="flex-shrink:0;margin-top:2px">${lblMap[n.t]}</span>
      <span>${n.s}</span>

  legendHtml += '<div class="tg-legend">';
  tenGods.filter(tg => tg.god !== '日主').forEach(tg => {
    const info = TENGOD_INFO[tg.god];
    if (!info) return;
    const stemEl = STEMS[tg.stemIdx].element;
    const verdict = favEl.includes(stemEl) ? 'good' : avoidEl.includes(stemEl) ? 'bad' : 'ok';
    const vLabel  = verdict === 'good' ? '喜' : verdict === 'bad' ? '忌' : '平';

        </div>
        <div class="tg-legend-desc">${mainText}</div>
      </div>
    </div>`;
  });
  legendHtml += '</div>';

  return `<div style="margin-bottom:14px">${noteHtml}</div>${legendHtml}`;
}

function renderWuxing(pillars, masterStemIdx) {
  const counts = countFiveElements(pillars);
  const total = Object.values(counts).reduce((a,b) => a+b, 0);
  const maxCount = Math.max(...Object.values(counts));
  const chart = document.getElementById('wuxing-chart');
  const elColors = { 木:'var(--wood)', 火:'var(--fire)', 土:'var(--earth)', 金:'var(--metal)', 水:'var(--water)' };

  let html = '';
  ELEMENT_ORDER.forEach(el => {
    const cnt = counts[el] || 0;
    const pct = maxCount > 0 ? (cnt / maxCount * 100).toFixed(1) : 0;
    const displayCnt = cnt % 1 === 0 ? cnt : cnt.toFixed(1);
    html += `<div class="wuxing-row">
      <div class="wuxing-label el-${el}">${el}</div>
      <div class="wuxing-bar-track">
        <div class="wuxing-bar" style="width:${pct}%;background:${elColors[el]}"></div>
      </div>
      <div class="wuxing-count">${displayCnt}</div>
    </div>`;
  });
  chart.innerHTML = html;

  const sa = assessDayMasterStrength(pillars, masterStemIdx);
  const favSpan  = sa.favEl.map(e => `<span class="tag tag-fav">${e}（喜）</span>`).join(' ');
  const avoSpan  = sa.avoidEl.map(e => `<span class="tag tag-avoid">${e}（忌）</span>`).join(' ');
  const strTag   = `<span class="tag ${sa.strength === 'strong' ? 'tag-strong' : sa.strength === 'weak' ? 'tag-weak' : 'tag-strong'}">${sa.label}</span>`;

  // Element description grid
  let elDescHtml = '<div class="el-desc-grid">';
  ELEMENT_ORDER.forEach(el => {
    const cnt = counts[el] || 0;
    const m = ELEMENT_MEANING[el];
    const isExcess = cnt >= 3;
    const isLack = cnt < 0.5;
    const vCls = (isExcess || isLack) ? 'verdict-bad' : 'verdict-ok';
    const vLbl = isExcess ? '偏多' : isLack ? '偏少' : '適中';
    const implication = isExcess ? `⚠ ${m.excess}` : isLack ? `△ ${m.lack}` : `✓ ${m.domain}`;
    elDescHtml += `<div class="el-block" style="border-left-color:${m.color}">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
        <span class="el-${el}" style="font-family:'Noto Serif TC',serif;font-size:1.05rem;font-weight:700">${el}</span>
        <span class="verdict-badge ${vCls}">${vLbl}</span>
        <span style="font-size:10px;color:var(--text-faint)">${m.body}</span>
      </div>
      <div style="font-size:12px;color:var(--text-muted);line-height:1.5">${implication}</div>
    </div>`;
  });
  elDescHtml += '</div>';

  document.getElementById('wuxing-summary').innerHTML =
    `<div style="margin-bottom:10px">日主強弱：${strTag}&nbsp;&nbsp;${favSpan} ${avoSpan}</div>${elDescHtml}`;

  return sa;
}

// Determine luck level for an element relative to favEl/avoidEl
function elLuck(el, favEl, avoidEl) {
  if (favEl.includes(el)) return 'good';
  if (avoidEl.includes(el)) return 'bad';
  return 'ok';
}
// Combined luck for a stem+branch pair
function pillarLuck(stemEl, branchEl, favEl, avoidEl) {
  const s = elLuck(stemEl, favEl, avoidEl);
  const b = elLuck(branchEl, favEl, avoidEl);
  if (s === 'good' && b !== 'bad') return 'good';
  if (s === 'bad'  && b !== 'good') return 'bad';
  if (b === 'good' && s !== 'bad') return 'good';
  if (b === 'bad'  && s !== 'good') return 'bad';
  return 'ok';
}
const LUCK_LBL = { good:'吉', ok:'平', bad:'注意' };

function renderPattern(pillars, masterStemIdx, strengthData) {
  const allCols = [
    { pos:'年干', stemIdx: pillars.year.stemIdx },
    { pos:'年支', stemIdx: pillars.year.branch.hidden[0] },
    { pos:'月干', stemIdx: pillars.month.stemIdx },
    { pos:'月支', stemIdx: pillars.month.branch.hidden[0] },
    { pos:'日支', stemIdx: pillars.day.branch.hidden[0] },
  ];
  if (pillars.hour) {
    allCols.push({ pos:'時干', stemIdx: pillars.hour.stemIdx });
    allCols.push({ pos:'時支', stemIdx: pillars.hour.branch.hidden[0] });
  }
  const tenGods = allCols.map(c => ({ pos: c.pos, god: getTenGod(masterStemIdx, c.stemIdx), stemIdx: c.stemIdx }));
  document.getElementById('pattern-content').innerHTML = detectPatterns(pillars, masterStemIdx, tenGods, strengthData);
  return tenGods;
}

      <td class="dayun-year-range">${c.yearStart}–${c.yearEnd}</td>
    </tr>`;

  html += '</tbody></table>';
  document.getElementById('dayun-content').innerHTML = html;

// ─── Warnings ─────────────────────────────────────────────────────────────────

function checkBoundaryWarnings(birthDate, pillars) {
  const warnings = [];
  const hour = birthDate.getHours();
  if (hour === 23 || hour <= 1) {
    warnings.push('⚠ 出生時辰接近子時（23:00–01:00）交界，日柱可能因此有誤差，建議查閱實際子時交界。');
  }
  // Check if birth is within 2 days of 立春
  const lichun = getSolarTermDate(birthDate.getFullYear(), 315);
  const diffDays = Math.abs(birthDate - lichun) / (1000 * 60 * 60 * 24);
  if (diffDays < 2) {
    warnings.push('⚠ 出生日期接近立春節氣交界（約2日內），年柱可能有誤差，建議確認實際立春時刻。');
  }
  return warnings;
}

// ─── Main Calculate ───────────────────────────────────────────────────────────

function calculate() {
  const errEl  = document.getElementById('calc-error');
  const warnEl = document.getElementById('calc-warn');
  errEl.style.display  = 'none';
  warnEl.style.display = 'none';

  const dateStr     = document.getElementById('inp-date').value;
  const hourVal     = parseInt(document.getElementById('inp-hour').value, 10);
  const gender      = document.querySelector('input[name="gender"]:checked').value;
  const unknownTime = document.getElementById('inp-unknown-time').checked;

  if (!dateStr) {
    errEl.textContent = '請選擇出生日期。';
    errEl.style.display = 'block';
    return;
  }

  const parts = dateStr.split('-');
  const year  = parseInt(parts[0], 10);
  const month = parseInt(parts[1], 10);
  const day   = parseInt(parts[2], 10);
  const hour  = unknownTime ? 12 : hourVal;

  if (year < 1900 || year > 2100) {
    errEl.textContent = '目前僅支援西元 1900–2100 年範圍，請重新輸入。';
    errEl.style.display = 'block';
    return;
  }

  const pillars = computePillars(year, month, day, hour, gender, unknownTime);
  const masterStemIdx = pillars.day.stemIdx;
  const currentYear = new Date().getFullYear();

  // Warnings
  const warns = checkBoundaryWarnings(pillars.birthDate, pillars);
  if (warns.length) {
    warnEl.innerHTML = warns.join('<br>');
    warnEl.style.display = 'block';
  }

  // Render pillars
  renderPillarsGrid(pillars, masterStemIdx);

  // Five elements + strength
  const strengthData = renderWuxing(pillars, masterStemIdx);

  // Pattern
  const tenGods = renderPattern(pillars, masterStemIdx, strengthData);

  // Dayun
  const direction = getDayunDirection(pillars.year.stemIdx, gender);
  const startAgeData = getDayunStartAge(pillars.birthDate, direction);
  const dayunCycles = computeDayun(pillars.month, direction, startAgeData, pillars.baziYear);
  renderDayun(dayunCycles, masterStemIdx, startAgeData, direction, currentYear, pillars.baziYear, strengthData.favEl, strengthData.avoidEl);

  // Liuyear
  const liuNian = computeLiuNian(pillars.baziYear, dayunCycles, masterStemIdx, currentYear);
  liuNian._dayunLabels = dayunCycles.map(c => c.stem.char + c.branch.char);
  renderLiuNian(liuNian, masterStemIdx, strengthData.favEl, strengthData.avoidEl);

  // Interpretation
  const interpParts = generateInterpretation(
    pillars, masterStemIdx, strengthData,
    { years: startAgeData.years, months: startAgeData.months, direction },
    gender
  );
  renderInterpretation(interpParts);

  // Show result
  document.getElementById('result-section').style.display = 'block';
  document.getElementById('result-section').scrollIntoView({ behavior: 'smooth', block: 'start' });

  // Persist
  try {
    localStorage.setItem('bazi_last_v1', JSON.stringify({ year, month, day, hour: hourVal, gender, unknownTime }));
  } catch(e) {}
}

  try {
    const saved = JSON.parse(localStorage.getItem('bazi_last_v1') || 'null');
    if (saved) {
      document.getElementById('inp-date').value =
        `${saved.year}-${pad(saved.month)}-${pad(saved.day)}`;
      document.getElementById('inp-hour').value = String(saved.hour);
      if (saved.gender) {
        const r = document.querySelector(`input[name="gender"][value="${saved.gender}"]`);
        if (r) r.checked = true;
      }
      document.getElementById('inp-unknown-time').checked = !!saved.unknownTime;
    }
  } catch(e) {}
})();
</script>
</body>
</html>
