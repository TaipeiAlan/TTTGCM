<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Dual Subtitles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #141414;
      color: #e5e5e5;
      width: 260px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 18px;
      font-weight: 900;
      color: #e50914;
      letter-spacing: -0.5px;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .subtitle {
      font-size: 10px;
      color: #888;
      margin-top: 1px;
    }

    .section {
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-text {
      font-size: 13px;
      color: #e5e5e5;
    }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #444;
      border-radius: 22px;
      transition: background 0.2s;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    input:checked + .slider {
      background: #e50914;
    }

    input:checked + .slider::before {
      transform: translateX(18px);
    }

    /* Position selector */
    .position-options {
      display: flex;
      gap: 8px;
    }

    .pos-btn {
      flex: 1;
      padding: 7px 4px;
      border: 1.5px solid #444;
      border-radius: 6px;
      background: transparent;
      color: #aaa;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      line-height: 1.3;
    }

    .pos-btn:hover {
      border-color: #666;
      color: #ddd;
    }

    .pos-btn.active {
      border-color: #e50914;
      color: #fff;
      background: rgba(229, 9, 20, 0.12);
    }

    .pos-btn .pos-diagram {
      display: block;
      font-size: 9px;
      color: #666;
      margin-top: 2px;
    }

    .pos-btn.active .pos-diagram {
      color: #e50914;
    }

    /* Status bar */
    .status {
      padding: 8px 10px;
      background: #1f1f1f;
      border-radius: 6px;
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    .status.loaded {
      color: #4caf50;
    }

    .status.waiting {
      color: #ff9800;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: #2a2a2a;
      margin: 14px 0;
    }

    /* Hint */
    .hint {
      font-size: 10px;
      color: #555;
      line-height: 1.5;
    }

    .hint a {
      color: #888;
    }

    .reset-btn {
      width: 100%;
      padding: 7px 10px;
      border: 1.5px solid #444;
      border-radius: 6px;
      background: transparent;
      color: #aaa;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, color 0.15s;
    }

    .reset-btn:hover {
      border-color: #888;
      color: #e5e5e5;
    }

    .debug-info {
      margin-top: 8px;
      padding: 8px 10px;
      background: #1a1a1a;
      border-radius: 6px;
      font-size: 10px;
      color: #666;
      font-family: monospace;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">中EN</div>
    <div>
      <div class="title">Netflix Dual Subtitles</div>
      <div class="subtitle">雙語字幕</div>
    </div>
  </div>

  <!-- Enable/Disable toggle -->
  <div class="section">
    <div class="section-label">English Subtitle 英文字幕</div>
    <div class="toggle-row">
      <span class="toggle-text">Show English subtitle</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enabled-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Position selector -->
  <div class="section" id="position-section">
    <div class="section-label">Position 位置</div>
    <div class="position-options">
      <button class="pos-btn" id="pos-above" data-pos="above">
        English
        <span class="pos-diagram">── ↑ above ──</span>
        Primary
      </button>
      <button class="pos-btn active" id="pos-below" data-pos="below">
        Primary
        <span class="pos-diagram">── ↓ below ──</span>
        English
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Status -->
  <div class="status waiting" id="status-msg">
    Waiting for subtitle data…
  </div>

  <div class="divider"></div>

  <div class="hint">
    On Netflix: select your language subtitle, then the English track loads automatically.
    <br><br>
    在 Netflix 選擇您的語言字幕，英文字幕會自動載入。
  </div>

  <div class="divider"></div>

  <!-- Debug panel -->
  <div class="section">
    <div class="section-label">Debug 除錯</div>
    <button id="reset-btn" class="reset-btn">↺ Reset Subtitles</button>
    <div id="debug-info" class="debug-info" style="display:none"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
