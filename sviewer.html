  document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });

  /* ════════════════════════════════════════
     EDIT MODE  —  Phase 1: skeleton
     ════════════════════════════════════════ */

  const btnEditMode      = document.getElementById('btn-edit-mode');
  const editCanvasWrap   = document.getElementById('edit-canvas-wrap');
  const editSvgContainer = document.getElementById('edit-svg-container');
  const epBg             = document.getElementById('ep-bg');
  const epGrid           = document.getElementById('ep-grid');
  const epElements       = document.getElementById('ep-elements');
  const epPreview        = document.getElementById('ep-preview');
  const epSnap           = document.getElementById('ep-snap');

  let isEditMode      = false;    // mirrors editingSet.has(activeId)
  let editDirty       = false;    // true when there are unsaved changes in edit mode
  let currentBgMarkup = null;     // SVG markup shown as bg in edit mode
  const editingSet   = new Set(); // IDs whose edit mode is active
  const editStateMap = new Map(); // id → { elems[], bgMarkup } working snapshots
  let activeTool  = 'select';   // 'select'|'room'|'vwall'|'hwall'|'reserved'|'door'
  // One-time migration: move old single-key data to per-SVG map
  (function() {
    const old = localStorage.getItem(EDIT_ELEMS_KEY);
    if (!old || !activeId) return;
    if (!localStorage.getItem(EDIT_ELEMS_MAP_KEY)) {
      try {
        const arr = JSON.parse(old);
        if (arr && arr.length) saveEditElemsForId(activeId, arr);
      } catch {}
    }
    localStorage.removeItem(EDIT_ELEMS_KEY);
  })();
  let editElems = loadEditElemsForId(activeId);  // placed elements data (persisted)
  let selectedId  = null;
  let eScale      = 1, ePanX = 0, ePanY = 0;
  let ePanning    = false, ePanSX = 0, ePanSY = 0;
  let snapUnit    = loadSnapUnit(); // 10(normal) or 1(fine)

  // Door tool state
  let doorDir   = 'h';   // 'h' | 'v'
  let doorHinge = 'L';   // 'L'=left/top  'R'=right/bottom
  let doorSwing = 'in';  // 'in' | 'out'

  /* ── Door arc SVG path (quarter-circle) ──
     Hinge corner is the CORNER of the panel, not center of edge.
     Angles in SVG (y-down): 0°=east 90°=south 180°=west 270°=north
     sweep=1 CW (increasing angle) / sweep=0 CCW (decreasing angle)
       h-door L-in : east→north  CCW sweep=0
       h-door L-out: east→south  CW  sweep=1
       h-door R-in : west→north  CW  sweep=1
       h-door R-out: west→south  CCW sweep=0
       v-door L-in : south→west  CW  sweep=1
       v-door L-out: south→east  CCW sweep=0
       v-door R-in : north→west  CCW sweep=0
       v-door R-out: north→east  CW  sweep=1                         */
  function doorArcPath(el) {
    const { x, y, w, dir, hinge, swing } = el;
    if (dir === 'h') {
      if (hinge === 'L') {
        // hinge corner (x, y); free end (x+w, y)
        return swing === 'in'
          ? `M ${x+w},${y} A ${w},${w} 0 0,0 ${x},${y-w}`
          : `M ${x+w},${y} A ${w},${w} 0 0,1 ${x},${y+w}`;
      } else {
        // hinge corner (x+w, y); free end (x, y)
        return swing === 'in'
          ? `M ${x},${y} A ${w},${w} 0 0,1 ${x+w},${y-w}`
          : `M ${x},${y} A ${w},${w} 0 0,0 ${x+w},${y+w}`;
      }
    } else {
      if (hinge === 'L') {
        // hinge corner (x, y); free end (x, y+w)
        return swing === 'in'
          ? `M ${x},${y+w} A ${w},${w} 0 0,1 ${x-w},${y}`
          : `M ${x},${y+w} A ${w},${w} 0 0,0 ${x+w},${y}`;
      } else {
        // hinge corner (x, y+w); free end (x, y)
        return swing === 'in'
          ? `M ${x},${y} A ${w},${w} 0 0,0 ${x-w},${y+w}`
          : `M ${x},${y} A ${w},${w} 0 0,1 ${x+w},${y+w}`;
      }
    }
  }

  /* ── Door bounding square (w×w quarter-circle area) ── */
  function doorBounds(el) {
    const { x, y, w, dir, swing } = el;
    if (dir === 'h') {
      // panel spans x→x+w; arc extends ±w in y
      return swing === 'in'
        ? { bx: x, by: y - w, bw: w, bh: w }
        : { bx: x, by: y,     bw: w, bh: w };
    } else {
      // panel spans y→y+w; arc extends ±w in x
      return swing === 'in'
        ? { bx: x - w, by: y, bw: w, bh: w }
        : { bx: x,     by: y, bw: w, bh: w };
    }
  }

  /* ── Door jamb rectangles (2×12 cm) ── */
  function doorJambRects(el) {
    const t = 2;   // thickness
    const d = 12;  // depth
    if (el.dir === 'h') {
      return [
        { x: el.x - t / 2,        y: el.y - d / 2, w: t, h: d },
        { x: el.x + el.w - t / 2, y: el.y - d / 2, w: t, h: d }
      ];
    }
    return [
      { x: el.x - d / 2, y: el.y - t / 2,        w: d, h: t },
      { x: el.x - d / 2, y: el.y + el.w - t / 2, w: d, h: t }
    ];
  }

  /* ── Per-SVG edit mode helpers ── */
  function updateEditModeUI() {
    isEditMode = editingSet.has(activeId);
    document.body.classList.toggle('edit-mode', isEditMode);
    btnEditMode.style.display = isEditMode ? 'none' : '';
  }

  /* ── SVG record parse / generate ── */

  function parseSvgRecord(svgStr) {
    if (!svgStr) return { elems: [], bgMarkup: null };
    const parser = new DOMParser();
    const doc = parser.parseFromString(svgStr, 'image/svg+xml');
    const root = doc.documentElement;
    if (root.tagName === 'parsererror' || !root) return { elems: [], bgMarkup: null };

    if (root.getAttribute('data-tttgcm-version')) {
      // Our own tttgcm SVG: extract stored data + background
      const dataEl = doc.getElementById('tttgcm-data');
      let elems = [];
      try { elems = dataEl ? JSON.parse(dataEl.textContent || '[]') : []; } catch {}
      const bgEl  = doc.getElementById('tttgcm-bg');
      const bgMarkup = (bgEl && bgEl.innerHTML.trim()) || null;
      return { elems, bgMarkup };
    } else {
      // External SVG: whole thing becomes a background image
      const b64 = btoa(unescape(encodeURIComponent(svgStr)));
      const bgMarkup = `<image href="data:image/svg+xml;base64,${b64}" x="0" y="0" width="1600" height="1300" preserveAspectRatio="xMidYMid meet"/>`;
      return { elems: [], bgMarkup };
    }
  }

  function renderBgLayer() {
    epBg.innerHTML = currentBgMarkup || '';
  }

  function generateRecordSvg() {
    const hasReserved = editElems.some(e => e.type === 'reserved');
    const defs = hasReserved
      ? `\n  <defs>\n    <pattern id="hatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45 0 0)">\n      <line x1="0" y1="0" x2="0" y2="12" stroke="#888" stroke-width="4"/>\n    </pattern>\n  </defs>` : '';

    const sorted = [...editElems].sort((a, b) => (Z[a.type] ?? 0) - (Z[b.type] ?? 0));
    const shapes = sorted.map(el => {
      if (el.type === 'room')
        return `  <rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="white" stroke="#222" stroke-width="10"/>`;
      if (el.type === 'vwall' || el.type === 'hwall')
        return `  <rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="#222"/>`;
      if (el.type === 'door') {
        const dw = el.dir === 'h' ? el.w : el.h;
        const dh = el.dir === 'h' ? el.h : el.w;
        const jambs = doorJambRects(el)
          .map(j => `  <rect x="${j.x}" y="${j.y}" width="${j.w}" height="${j.h}" fill="#444"/>`)
          .join('\n');
        return `  <rect x="${el.x}" y="${el.y}" width="${dw}" height="${dh}" fill="white" stroke="none"/>\n${jambs}\n  <path d="${doorArcPath(el)}" fill="none" stroke="#222" stroke-width="2.2"/>`;
      }
      return `  <rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="#b8c8d4" stroke="#222" stroke-width="10"/>\n  <rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="url(#hatch)" stroke="none"/>`;
    }).join('\n');

    const bgPart   = currentBgMarkup ? `\n  <g id="tttgcm-bg">\n    ${currentBgMarkup}\n  </g>` : '';
    const elemsPart = shapes ? `\n  <g id="tttgcm-elements">\n${shapes}\n  </g>` : '';

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300" data-tttgcm-version="1">${defs}\n  <desc id="tttgcm-data">${JSON.stringify(editElems)}</desc>${bgPart}${elemsPart}\n</svg>`;
  }

  function saveEditToRecord() {
    const rec = records.find(r => r.id === activeId);
    if (!rec) return;
    rec.svg = generateRecordSvg();
    saveRecords(records);
    editDirty = false;
    renderSvg();
    showToast(`已更新「${rec.name}」`);
  }

  function exitEditMode() {
    editingSet.delete(activeId);
    saveEditingSet();
    editStateMap.delete(activeId);
    editElems       = [];
    currentBgMarkup = null;
    selectedId      = null;
    updateEditModeUI();
    renderTabs();
    epPreview.innerHTML = '';
    epSnap.innerHTML    = '';
    epBg.innerHTML      = '';
    renderSvg();
  }

  /* ── Toggle edit mode ── */
  function enterEditMode() {
    if (editingSet.has(activeId)) return;
    const rec = records.find(r => r.id === activeId);
    const { elems, bgMarkup } = rec ? parseSvgRecord(rec.svg) : { elems: [], bgMarkup: null };
    editElems       = elems;
    currentBgMarkup = bgMarkup;
    editDirty       = false;
    editingSet.add(activeId);
    saveEditingSet();
    editStateMap.set(activeId, { elems: [...elems], bgMarkup });
    selectedId = null;
    updateEditModeUI();
    renderTabs();
    renderEditGrid();
    renderBgLayer();
    renderEditElements();
    requestAnimationFrame(fitEditCanvas);
    updateDimSection();
  }

  btnEditMode.addEventListener('click', () => {
    if (!isEditMode) enterEditMode();
  });

  document.getElementById('btn-exit-save').addEventListener('click', () => {
    document.getElementById('exit-edit-overlay').classList.remove('open');
    saveEditToRecord();
    exitEditMode();
  });
  document.getElementById('btn-exit-nosave').addEventListener('click', () => {
    document.getElementById('exit-edit-overlay').classList.remove('open');
    exitEditMode();
  });
  document.getElementById('btn-exit-cancel').addEventListener('click', () => {
    document.getElementById('exit-edit-overlay').classList.remove('open');
  });

  /* ── Sidebar 儲存 / 離開 buttons ── */
  document.getElementById('btn-edit-save').addEventListener('click', () => {
    saveEditToRecord();
  });
  document.getElementById('btn-edit-leave').addEventListener('click', () => {
    if (!editDirty) {
      exitEditMode();
    } else {
      const rec = records.find(r => r.id === activeId);
      document.getElementById('exit-edit-name').textContent = rec ? rec.name : '';
      document.getElementById('exit-edit-overlay').classList.add('open');
    }
  });

  /* ── Fit / transform ── */
  function fitEditCanvas() {
    const ww = editCanvasWrap.clientWidth  - 40;
    const wh = editCanvasWrap.clientHeight - 40;
    eScale = Math.min(ww / 1600, wh / 1300, 1);
    ePanX = 0; ePanY = 0;
    applyEditTransform();
  }

  function applyEditTransform() {
    editSvgContainer.style.transform =
      `translate(${ePanX}px,${ePanY}px) scale(${eScale})`;
    document.getElementById('edit-zoom-label').textContent =
      Math.round(eScale * 100) + '%';
    renderRulers();
  }

  /* ── Rulers ── */
  function renderRulers() {
    const rulerH = document.getElementById('ruler-h');
    const rulerV = document.getElementById('ruler-v');
    if (!rulerH || !rulerV || getComputedStyle(rulerH).display === 'none') return;

    const cw = editCanvasWrap.clientWidth;
    const ch = editCanvasWrap.clientHeight;
    const R  = 28; // ruler band size in px (matches CSS width/height)

    // Pixel-to-SVG: container px → SVG cm
    // svgX = (containerPx - cw/2 - ePanX) / eScale + 800
    // svgY = (containerPy - ch/2 - ePanY) / eScale + 650
    // Ruler h sits at container x = [R, cw), ruler v at container y = [R, ch)
    const svgXLeft  = (R       - cw / 2 - ePanX) / eScale + 800;
    const svgXRight = (cw      - cw / 2 - ePanX) / eScale + 800;
    const svgYTop   = (R       - ch / 2 - ePanY) / eScale + 650;
    const svgYBot   = (ch      - ch / 2 - ePanY) / eScale + 650;

    // Pick tick interval so ticks are ≥40px apart
    const INTERVALS = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
    const tickCm = INTERVALS.find(i => i * eScale >= 40) || 1000;
    const minorCm = tickCm;   // only one level for simplicity

    const rw = cw - R;
    const rh = ch - R;

    // ── Horizontal ruler ──
    let hs = `<svg xmlns="http://www.w3.org/2000/svg" width="${rw}" height="${R}" style="display:block;overflow:visible">`;
    const startX = Math.ceil(svgXLeft / minorCm) * minorCm;
    for (let cx = startX; cx <= svgXRight + minorCm; cx += minorCm) {
      const px = (cx - 800) * eScale + cw / 2 + ePanX - R;
      if (px < -1 || px > rw + 1) continue;
      hs += `<line x1="${px.toFixed(1)}" y1="${R}" x2="${px.toFixed(1)}" y2="${R - 8}" stroke="#94a3b8" stroke-width="1"/>`;
      hs += `<text x="${px.toFixed(1)}" y="${R - 11}" text-anchor="middle" font-size="8" fill="#64748b" font-family="system-ui,sans-serif">${cx}</text>`;
    }
    hs += '</svg>';
    rulerH.innerHTML = hs;

    // ── Vertical ruler ──
    let vs = `<svg xmlns="http://www.w3.org/2000/svg" width="${R}" height="${rh}" style="display:block;overflow:visible">`;
    const startY = Math.ceil(svgYTop / minorCm) * minorCm;
    for (let cy = startY; cy <= svgYBot + minorCm; cy += minorCm) {
      const py = (cy - 650) * eScale + ch / 2 + ePanY - R;
      if (py < -1 || py > rh + 1) continue;
      vs += `<line x1="${R}" y1="${py.toFixed(1)}" x2="${R - 8}" y2="${py.toFixed(1)}" stroke="#94a3b8" stroke-width="1"/>`;
      vs += `<text x="${R - 10}" y="${py.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="8" fill="#64748b" font-family="system-ui,sans-serif">${cy}</text>`;
    }
    vs += '</svg>';
    rulerV.innerHTML = vs;
  }

  /* ── Zoom buttons ── */
  document.getElementById('btn-edit-zoom-in').addEventListener('click', () => {
    eScale = Math.min(eScale * 1.25, 10); applyEditTransform();
  });
  document.getElementById('btn-edit-zoom-out').addEventListener('click', () => {
    eScale = Math.max(eScale / 1.25, 0.1); applyEditTransform();
  });
  document.getElementById('btn-edit-zoom-fit').addEventListener('click', fitEditCanvas);

  /* ── Wheel zoom on edit canvas ── */
  editCanvasWrap.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.1 : 0.9;
    const r = editCanvasWrap.getBoundingClientRect();
    const ox = e.clientX - r.left  - editCanvasWrap.clientWidth  / 2;
    const oy = e.clientY - r.top   - editCanvasWrap.clientHeight / 2;
    ePanX  = ox + (ePanX - ox) * f;
    ePanY  = oy + (ePanY - oy) * f;
    eScale = Math.min(Math.max(eScale * f, 0.1), 10);
    applyEditTransform();
  }, { passive: false });

  /* ── Pan: Ctrl+drag or middle-mouse ── */
  editCanvasWrap.addEventListener('mousedown', e => {
    if (e.button === 1 || (e.button === 0 && e.ctrlKey)) {
      e.preventDefault();
      ePanning = true;
      ePanSX   = e.clientX - ePanX;
      ePanSY   = e.clientY - ePanY;
      editCanvasWrap.style.cursor = 'grabbing';
    }
  });
  window.addEventListener('mousemove', e => {
    if (!ePanning) return;
    ePanX = e.clientX - ePanSX;
    ePanY = e.clientY - ePanSY;
    applyEditTransform();
  });
  window.addEventListener('mouseup', () => {
    if (ePanning) { ePanning = false; editCanvasWrap.style.cursor = ''; }
  });

  /* ── Grid ── */
  function renderEditGrid() {
    const ns = 'http://www.w3.org/2000/svg';
    epGrid.innerHTML = '';
    for (let x = 0; x <= 1600; x += 50) {
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', x); l.setAttribute('y1', 0);
      l.setAttribute('x2', x); l.setAttribute('y2', 1300);
      l.setAttribute('stroke', x % 100 === 0 ? '#aab4be' : '#d4dae0');
      l.setAttribute('stroke-width', '0.5');
      epGrid.appendChild(l);
    }
    for (let y = 0; y <= 1300; y += 50) {
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', 0); l.setAttribute('y1', y);
      l.setAttribute('x2', 1600); l.setAttribute('y2', y);
      l.setAttribute('stroke', y % 100 === 0 ? '#aab4be' : '#d4dae0');
      l.setAttribute('stroke-width', '0.5');
      epGrid.appendChild(l);
    }
    // border
    const bdr = document.createElementNS(ns, 'rect');
    ['x','y','width','height','fill','stroke','stroke-width'].forEach((a,i) =>
      bdr.setAttribute(a, ['0','0','1600','1300','none','#666','1'][i]));
    epGrid.appendChild(bdr);
    // axis labels every 100cm
    for (let x = 100; x <= 1600; x += 100) {
      const t = document.createElementNS(ns, 'text');
      t.setAttribute('x', x); t.setAttribute('y', '-3');
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', '9'); t.setAttribute('fill', '#999');
      t.textContent = x; epGrid.appendChild(t);
    }
    for (let y = 100; y <= 1300; y += 100) {
      const t = document.createElementNS(ns, 'text');
      t.setAttribute('x', '-4'); t.setAttribute('y', y + 3);
      t.setAttribute('text-anchor', 'end');
      t.setAttribute('font-size', '9'); t.setAttribute('fill', '#999');
      t.textContent = y; epGrid.appendChild(t);
    }
  }

  /* ── Tool switching ── */
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTool = btn.dataset.tool;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedId = null;
      updateSelectedSection();
      updateDimSection();
      epPreview.innerHTML = '';
      epSnap.innerHTML    = '';
    });
  });

  function updateDimSection() {
    const sec     = document.getElementById('dim-section');
    const doorSec = document.getElementById('door-section');
    const wRow    = document.getElementById('dim-w-row');
    const hRow    = document.getElementById('dim-h-row');
    const lRow    = document.getElementById('dim-len-row');
    if (activeTool === 'select')  { sec.style.display = 'none'; doorSec.style.display = 'none'; return; }
    if (activeTool === 'door')    { sec.style.display = 'none'; doorSec.style.display = ''; return; }
    doorSec.style.display = 'none';
    sec.style.display = '';
    const isRect = activeTool === 'room' || activeTool === 'reserved';
    wRow.style.display = isRect ? '' : 'none';
    hRow.style.display = isRect ? '' : 'none';
    lRow.style.display = isRect ? 'none' : '';
  }

  let _lastSelId = null; // track when selection actually changes vs drag-update

  function updateSelectedSection() {
    const sec = document.getElementById('selected-section');
    if (!selectedId) { sec.style.display = 'none'; _lastSelId = null; return; }
    const el = editElems.find(e => e.id === selectedId);
    if (!el)         { sec.style.display = 'none'; _lastSelId = null; return; }
    sec.style.display = '';
    if (selectedId !== _lastSelId) {
      _lastSelId = selectedId;
      buildSelectedUI(el);
    } else {
      // Drag in progress — only refresh position text, don't rebuild inputs
      const posEl = document.getElementById('sel-pos');
      if (posEl) posEl.textContent = `(${el.x}, ${el.y})`;
    }
  }

  function buildSelectedUI(el) {
    const info    = document.getElementById('selected-info');
    const dimArea = document.getElementById('sel-dim-area');
    const LABEL   = { room:'房', vwall:'垂直牆', hwall:'橫向牆', reserved:'保留', door:'門' };
    const doorExtra = el.type === 'door'
      ? `<br>${el.dir==='h'?'橫':'直'}・${el.hinge==='L'?'左':'右'}鉸・${el.swing==='in'?'內':'外'}開`
      : '';
    info.innerHTML =
      `${LABEL[el.type]}　<span id="sel-pos">(${el.x}, ${el.y})</span> cm${doorExtra}`;

    dimArea.innerHTML = '';
    const dims =
      (el.type === 'room' || el.type === 'reserved')
        ? [{ lbl:'W', key:'w', val:el.w, min:10 },
           { lbl:'H', key:'h', val:el.h, min:10 }]
      : el.type === 'vwall'
        ? [{ lbl:'L', key:'h', val:el.h, min:10 }]
      : el.type === 'hwall'
        ? [{ lbl:'L', key:'w', val:el.w, min:10 }]
      : el.type === 'door'
        ? [{ lbl:'W', key:'w', val:el.w, min:30 }]
      : [];

    const capturedId = el.id; // safe even if selectedId changes later
    for (const d of dims) {
      const row = document.createElement('div');
      row.className = 'dim-row';
      row.style.marginTop = '4px';

      const lbl = document.createElement('label');
      lbl.textContent = d.lbl;

      const inp = document.createElement('input');
      inp.type = 'number'; inp.className = 'dim-input';
      inp.value = d.val;   inp.min = d.min; inp.step = 1;

      const unit = document.createElement('span');
      unit.className = 'dim-unit'; unit.textContent = 'cm';

      const commit = () => {
        const v = Math.max(d.min, parseInt(inp.value) || d.min);
        inp.value = v;
        resizeElement(capturedId, d.key, v);
      };
      inp.addEventListener('focus',   () => { inp.dataset.orig = inp.value; });
      inp.addEventListener('change',  commit);
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter')  { commit(); inp.blur(); }
        if (e.key === 'Escape') { inp.value = inp.dataset.orig ?? d.val; inp.blur(); }
        e.stopPropagation(); // keep Delete/Backspace from deleting the element
      });

      row.append(lbl, inp, unit);
      dimArea.appendChild(row);
    }
  }

  function resizeElement(id, key, value) {
    const el = editElems.find(e => e.id === id);
    if (!el || el[key] === value) return;
    el[key] = value;
    // Clamp so element stays within canvas after resize
    if (key === 'w') {
      // vertical doors extend in Y direction; all others extend in X
      if (el.type === 'door' && el.dir === 'v') {
        if (el.y + value > 1300) el.y = Math.max(0, 1300 - value);
      } else {
        if (el.x + value > 1600) el.x = Math.max(0, 1600 - value);
      }
    } else { // key === 'h'
      if (el.y + value > 1300) el.y = Math.max(0, 1300 - value);
    }
    editDirty = true;
    saveEditElems(editElems);
    renderEditElements();
    const posEl = document.getElementById('sel-pos');
    if (posEl) posEl.textContent = `(${el.x}, ${el.y})`;
  }

  /* ── Delete (with one-shot undo) ── */
  let lastDeleted = null;
  const undoSection = document.getElementById('undo-section');

  function deleteElement(id) {
    const el = editElems.find(e => e.id === id);
    if (!el) return;
    lastDeleted = { ...el };
    editElems = editElems.filter(e => e.id !== id);
    editDirty = true;
    saveEditElems(editElems);
    selectedId = null;
    renderEditElements();
    updateSelectedSection();
    undoSection.style.display = '';
  }

  document.getElementById('btn-delete-selected').addEventListener('click', () => {
    if (!selectedId) return;
    deleteElement(selectedId);
  });

  document.getElementById('btn-undo-delete').addEventListener('click', () => {
    if (!lastDeleted) return;
    editElems.push(lastDeleted);
    editDirty = true;
    saveEditElems(editElems);
    lastDeleted = null;
    renderEditElements();
    undoSection.style.display = 'none';
  });

  /* ── Clear canvas ── */
  document.getElementById('btn-clear-canvas').addEventListener('click', () => {
    if (!editElems.length) return;
    if (!confirm('確定清空畫布？此操作無法復原。')) return;
    editElems = []; selectedId = null; lastDeleted = null;
    editDirty = true;
    saveEditElems(editElems);
    renderEditElements(); updateSelectedSection();
    undoSection.style.display = 'none';
  });

  /* ── Render elements ── */
  const Z = { room: 0, vwall: 1, hwall: 1, door: 2, reserved: 3 };
  function renderEditElements() {
    const ns = 'http://www.w3.org/2000/svg';
    epElements.innerHTML = '';
    const sorted = [...editElems].sort((a, b) => (Z[a.type] ?? 0) - (Z[b.type] ?? 0));
    for (const el of sorted) {
      const g = document.createElementNS(ns, 'g');
      g.dataset.id = el.id;

      if (el.type === 'room' || el.type === 'reserved') {
        if (el.type === 'reserved') {
          const bg = document.createElementNS(ns, 'rect');
          bg.setAttribute('x', el.x);   bg.setAttribute('y', el.y);
          bg.setAttribute('width', el.w); bg.setAttribute('height', el.h);
          bg.setAttribute('fill', '#b8c8d4'); bg.setAttribute('pointer-events', 'none');
          g.appendChild(bg);
        }
        const r = document.createElementNS(ns, 'rect');
        r.setAttribute('x', el.x);   r.setAttribute('y', el.y);
        r.setAttribute('width', el.w); r.setAttribute('height', el.h);
        r.setAttribute('fill', el.type === 'room' ? 'white' : 'url(#ep-hatch)');
        r.setAttribute('stroke', '#222'); r.setAttribute('stroke-width', '10');
        g.appendChild(r);
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('x', el.x + el.w / 2); t.setAttribute('y', el.y + el.h / 2 + 5);
        t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '14');
        t.setAttribute('fill', el.type === 'room' ? '#666' : '#444');
        t.setAttribute('pointer-events', 'none');
        t.textContent = `${el.w}×${el.h}`;
        g.appendChild(t);

      } else if (el.type === 'door') {
        // Transparent hit area covering the full w×w quarter-circle square
        const { bx, by, bw, bh } = doorBounds(el);
        const hit = document.createElementNS(ns, 'rect');
        hit.setAttribute('x', bx); hit.setAttribute('y', by);
        hit.setAttribute('width', bw); hit.setAttribute('height', bh);
        hit.setAttribute('fill', 'rgba(0,0,0,0)');
        g.appendChild(hit);
        // Panel (3 cm thick)
        const panelW = el.dir === 'h' ? el.w : el.h;
        const panelH = el.dir === 'h' ? el.h : el.w;
        const panel = document.createElementNS(ns, 'rect');
        panel.setAttribute('x', el.x); panel.setAttribute('y', el.y);
        panel.setAttribute('width', panelW); panel.setAttribute('height', panelH);
        panel.setAttribute('fill', 'white');
        panel.setAttribute('stroke', 'none');
        g.appendChild(panel);
        // Jambs: two 2x12 cm rectangles at both ends
        for (const jb of doorJambRects(el)) {
          const jr = document.createElementNS(ns, 'rect');
          jr.setAttribute('x', jb.x); jr.setAttribute('y', jb.y);
          jr.setAttribute('width', jb.w); jr.setAttribute('height', jb.h);
          jr.setAttribute('fill', '#444');
          g.appendChild(jr);
        }
        // Arc — solid line, same weight as panel
        const arc = document.createElementNS(ns, 'path');
        arc.setAttribute('d', doorArcPath(el));
        arc.setAttribute('fill', 'none');
        arc.setAttribute('stroke', '#222'); arc.setAttribute('stroke-width', '2.2');
        arc.setAttribute('pointer-events', 'none');
        g.appendChild(arc);

      } else {
        // vwall / hwall
        const r = document.createElementNS(ns, 'rect');
        r.setAttribute('x', el.x); r.setAttribute('y', el.y);
        r.setAttribute('width', el.w); r.setAttribute('height', el.h);
        r.setAttribute('fill', '#222');
        g.appendChild(r);
      }

      // selection ring — full square for doors, panel rect for others
      if (el.id === selectedId) {
        const ring = document.createElementNS(ns, 'rect');
        const pad = 4;
        let rx = el.x, ry = el.y, rw = el.w, rh = el.h;
        if (el.type === 'door') {
          const b = doorBounds(el); rx = b.bx; ry = b.by; rw = b.bw; rh = b.bh;
        }
        ring.setAttribute('x', rx - pad);   ring.setAttribute('y', ry - pad);
        ring.setAttribute('width',  rw + pad * 2); ring.setAttribute('height', rh + pad * 2);
        ring.setAttribute('fill', 'none');
        ring.setAttribute('stroke', '#3b82f6'); ring.setAttribute('stroke-width', '2.5');
        ring.setAttribute('stroke-dasharray', '10,4'); ring.setAttribute('pointer-events', 'none');
        g.appendChild(ring);
      }

      epElements.appendChild(g);
    }
  }

  /* ════════════════════════════════════════
     PHASE 2: Placement · Snap · Drag
     ════════════════════════════════════════ */

  const editSvgEl  = document.getElementById('edit-svg');
  function updateSnapUi() {
    document.getElementById('snap-10').classList.toggle('active', snapUnit === 10);
    document.getElementById('snap-1').classList.toggle('active', snapUnit === 1);
  }
  document.getElementById('snap-10').addEventListener('click', () => {
    snapUnit = 10; saveSnapUnit(snapUnit); updateSnapUi();
  });
  document.getElementById('snap-1').addEventListener('click', () => {
    snapUnit = 1; saveSnapUnit(snapUnit); updateSnapUi();
  });
  updateSnapUi();

  let isDragging   = false;
  let dragId       = null;
  let dragOffX     = 0, dragOffY = 0;
  let dragGroup    = null; // [{id,dx,dy}] doors dragged along with a room
  let mouseDownPos = null;
  let pointerMoved = false;

  function clampPos(x, y, w, h) {
    return {
      x: Math.max(0, Math.min(1600 - w, x)),
      y: Math.max(0, Math.min(1300 - h, y))
    };
  }

  function linkedDoorsForRoom(roomEl) {
    const tol = 2;
    return editElems.filter(el => {
      if (el.type !== 'door') return false;
      if (el.dir === 'h') {
        const overlapX = (el.x + el.w) > roomEl.x && el.x < (roomEl.x + roomEl.w);
        const onTopOrBottom = Math.abs(el.y - roomEl.y) <= tol ||
                              Math.abs(el.y - (roomEl.y + roomEl.h)) <= tol;
        return overlapX && onTopOrBottom;
      }
      const overlapY = (el.y + el.w) > roomEl.y && el.y < (roomEl.y + roomEl.h);
      const onLeftOrRight = Math.abs(el.x - roomEl.x) <= tol ||
                            Math.abs(el.x - (roomEl.x + roomEl.w)) <= tol;
      return overlapY && onLeftOrRight;
    }).map(d => ({ id: d.id, dx: d.x - roomEl.x, dy: d.y - roomEl.y }));
  }

  /* ── Mouse → SVG coordinate ── */
  function svgCoord(e) {
    const r = editSvgEl.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (1600 / r.width),
      y: (e.clientY - r.top)  * (1300 / r.height)
    };
  }

  /* ── Read dimension inputs ── */
  function getDims() {
    const w = Math.max(10, parseInt(document.getElementById('dim-w').value)   || 300);
    const h = Math.max(10, parseInt(document.getElementById('dim-h').value)   || 300);
    const l = Math.max(10, parseInt(document.getElementById('dim-len').value) || 200);
    if (activeTool === 'vwall') return { w: 10, h: l };
    if (activeTool === 'hwall') return { w: l,  h: 10 };
    return { w, h };
  }

  /* ── Snap: grid (0.5 cm) then edge ── */
  function snapElement(x, y, w, h, excludeId) {
    let sx = Math.round(x / snapUnit) * snapUnit;
    let sy = Math.round(y / snapUnit) * snapUnit;

    let bestDX = snapUnit, bestDY = snapUnit;
    let snapX  = null,      snapY  = null;

    for (const el of editElems) {
      if (el.id === excludeId) continue;
      const er = el.x + el.w,  eb = el.y + el.h;
      const nr = sx  + w,      nb = sy  + h;

      // x candidates: align left/right edges of new vs existing
      for (const c of [
        { d: Math.abs(sx - er),   v: er       },   // new.left  = ex.right
        { d: Math.abs(nr - el.x), v: el.x - w },   // new.right = ex.left
        { d: Math.abs(sx - el.x), v: el.x     },   // new.left  = ex.left
        { d: Math.abs(nr - er),   v: er - w   },   // new.right = ex.right
      ]) { if (c.d < bestDX) { bestDX = c.d; snapX = c.v; } }

      // y candidates
      for (const c of [
        { d: Math.abs(sy - eb),   v: eb       },
        { d: Math.abs(nb - el.y), v: el.y - h },
        { d: Math.abs(sy - el.y), v: el.y     },
        { d: Math.abs(nb - eb),   v: eb - h   },
      ]) { if (c.d < bestDY) { bestDY = c.d; snapY = c.v; } }
    }

    if (snapX !== null) sx = snapX;
    if (snapY !== null) sy = snapY;

    // clamp to canvas
    return clampPos(sx, sy, w, h);
  }

  /* ── Ghost preview element ── */
  function drawPreview(x, y, w, h, type) {
    const ns = 'http://www.w3.org/2000/svg';
    epPreview.innerHTML = '';
    if (type === 'door') {
      const dw = doorDir === 'h' ? w : 3;
      const dh = doorDir === 'h' ? 3 : w;
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y);
      r.setAttribute('width', dw); r.setAttribute('height', dh);
      r.setAttribute('fill', 'rgba(255,255,255,0.6)');
      r.setAttribute('stroke', '#e94560'); r.setAttribute('stroke-width', '2.5');
      r.setAttribute('pointer-events', 'none');
      epPreview.appendChild(r);
      const arc = document.createElementNS(ns, 'path');
      arc.setAttribute('d', doorArcPath({ x, y, w, dir: doorDir, hinge: doorHinge, swing: doorSwing }));
      arc.setAttribute('fill', 'none');
      arc.setAttribute('stroke', '#e94560'); arc.setAttribute('stroke-width', '3');
      arc.setAttribute('pointer-events', 'none');
      epPreview.appendChild(arc);
      return;
    }
    const r = document.createElementNS(ns, 'rect');
    r.setAttribute('x', x); r.setAttribute('y', y);
    r.setAttribute('width', w); r.setAttribute('height', h);
    r.setAttribute('pointer-events', 'none');
    if (type === 'vwall' || type === 'hwall') {
      r.setAttribute('fill', 'rgba(30,30,30,0.45)');
    } else if (type === 'room') {
      r.setAttribute('fill', 'rgba(255,255,255,0.55)');
      r.setAttribute('stroke', '#e94560');
      r.setAttribute('stroke-width', '10');
      r.setAttribute('stroke-dasharray', '20,8');
    } else {   // reserved
      r.setAttribute('fill', 'rgba(90,90,90,0.3)');
      r.setAttribute('stroke', '#e94560');
      r.setAttribute('stroke-width', '10');
      r.setAttribute('stroke-dasharray', '20,8');
    }
    epPreview.appendChild(r);
  }

  /* ── Snap door to nearest wall/room edge ── */
  function snapDoor(x, y, w, dir) {
    let sx = Math.round(x / snapUnit) * snapUnit;
    let sy = Math.round(y / snapUnit) * snapUnit;
    const DSNAP = Math.max(2, snapUnit * 2); // cm
    if (dir === 'h') {
      let best = DSNAP;
      for (const el of editElems) {
        if (el.type === 'door') continue;
        for (const edge of [el.y, el.y + (el.h ?? 0)]) {
          const d = Math.abs(sy + 1.5 - edge);
          if (d < best) { best = d; sy = edge - 1.5; }
        }
      }
      const p = clampPos(sx, sy, w, 3);
      sx = p.x; sy = p.y;
    } else {
      let best = DSNAP;
      for (const el of editElems) {
        if (el.type === 'door') continue;
        for (const edge of [el.x, el.x + (el.w ?? 0)]) {
          const d = Math.abs(sx + 1.5 - edge);
          if (d < best) { best = d; sx = edge - 1.5; }
        }
      }
      const p = clampPos(sx, sy, 3, w);
      sx = p.x; sy = p.y;
    }
    return { x: sx, y: sy };
  }

  /* ── Commit a new element ── */
  function placeElement(x, y, w, h, type, extra = {}) {
    editElems.push({ id: Date.now().toString(), type, x, y, w, h, ...extra });
    editDirty = true;
    saveEditElems(editElems);
    renderEditElements();
    epPreview.innerHTML = '';
    // auto-switch back to select tool
    activeTool = 'select';
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    const selBtn = document.querySelector('.tool-btn[data-tool="select"]');
    if (selBtn) selBtn.classList.add('active');
    editSvgEl.style.cursor = 'default';
    updateDimSection();
  }

  /* ── SVG: mousedown — select / start drag ── */
  editSvgEl.addEventListener('mousedown', e => {
    if (e.button !== 0 || e.ctrlKey || !isEditMode) return;
    mouseDownPos = { x: e.clientX, y: e.clientY };
    pointerMoved = false;

    if (activeTool === 'select') {
      const g = e.target.closest('[data-id]');
      if (g) {
        selectedId = g.dataset.id;
        renderEditElements();
        updateSelectedSection();
        // prepare drag
        const sp = svgCoord(e);
        const el = editElems.find(ee => ee.id === selectedId);
        if (el) {
          isDragging = true; dragId = selectedId;
          dragOffX = sp.x - el.x; dragOffY = sp.y - el.y;
          dragGroup = el.type === 'room' ? linkedDoorsForRoom(el) : null;
        }
      } else {
        // click on empty → deselect
        selectedId = null;
        renderEditElements();
        updateSelectedSection();
      }
    }
  });

  /* ── SVG: click — place element ── */
  editSvgEl.addEventListener('click', e => {
    if (pointerMoved || activeTool === 'select' || !isEditMode) return;
    const sp = svgCoord(e);
    if (activeTool === 'door') {
      const dw = Math.max(30, parseInt(document.getElementById('door-w').value) || 90);
      const s  = snapDoor(sp.x - (doorDir === 'h' ? dw / 2 : 1.5),
                          sp.y - (doorDir === 'h' ? 1.5 : dw / 2), dw, doorDir);
      placeElement(s.x, s.y, dw, 3, 'door', { dir: doorDir, hinge: doorHinge, swing: doorSwing });
    } else {
      const { w, h } = getDims();
      const s = snapElement(sp.x, sp.y, w, h);
      placeElement(s.x, s.y, w, h, activeTool);
    }
  });

  /* ── SVG: mouse leaves — clear preview ── */
  editSvgEl.addEventListener('mouseleave', () => {
    if (!isDragging) epPreview.innerHTML = '';
  });

  function dragSelectedTo(sp) {
    const el = editElems.find(ee => ee.id === dragId);
    if (!el) return;
    const oldX = el.x, oldY = el.y;
    if (el.type === 'door') {
      const s = snapDoor(sp.x - dragOffX, sp.y - dragOffY, el.w, el.dir);
      el.x = s.x; el.y = s.y;
    } else {
      const s = snapElement(sp.x - dragOffX, sp.y - dragOffY, el.w, el.h, dragId);
      el.x = s.x; el.y = s.y;
      if (el.type === 'room' && dragGroup?.length) {
        const dx = el.x - oldX, dy = el.y - oldY;
        for (const g of dragGroup) {
          const d = editElems.find(ee => ee.id === g.id);
          if (!d) continue;
          const c = clampPos(d.x + dx, d.y + dy, d.w, d.h);
          d.x = c.x; d.y = c.y;
        }
      }
    }
    renderEditElements();
    updateSelectedSection();
  }

  /* ── window mousemove — preview & drag ── */
  window.addEventListener('mousemove', e => {
    if (!isEditMode) return;

    // track movement
    if (mouseDownPos &&
        (Math.abs(e.clientX - mouseDownPos.x) > 4 ||
         Math.abs(e.clientY - mouseDownPos.y) > 4)) {
      pointerMoved = true;
    }

    // drag selected element
    if (isDragging && pointerMoved && dragId) {
      dragSelectedTo(svgCoord(e));
      return;
    }

    // placement preview
    if (!isDragging && !ePanning && activeTool !== 'select') {
      const svgRect = editSvgEl.getBoundingClientRect();
      if (e.clientX >= svgRect.left && e.clientX <= svgRect.right &&
          e.clientY >= svgRect.top  && e.clientY <= svgRect.bottom) {
        const sp = svgCoord(e);
        if (activeTool === 'door') {
          const dw = Math.max(30, parseInt(document.getElementById('door-w').value) || 90);
          const s  = snapDoor(sp.x - (doorDir === 'h' ? dw / 2 : 1.5),
                              sp.y - (doorDir === 'h' ? 1.5 : dw / 2), dw, doorDir);
          drawPreview(s.x, s.y, dw, 3, 'door');
        } else {
          const { w, h } = getDims();
          const s = snapElement(sp.x, sp.y, w, h);
          drawPreview(s.x, s.y, w, h, activeTool);
        }
      } else {
        epPreview.innerHTML = '';
      }
    }
  });

  /* ── window mouseup — end drag ── */
  window.addEventListener('mouseup', () => {
    if (isDragging) { isDragging = false; dragId = null; editDirty = true; saveEditElems(editElems); }
    dragGroup = null;
    mouseDownPos = null;
  });

  /* ── Touch / Pen drag via Pointer Events ──
     setPointerCapture ensures pointermove keeps firing even when the
     finger leaves the SVG element bounds — the key advantage over
     window.touchmove which can be suppressed by iOS.               */
  editSvgEl.addEventListener('pointerdown', e => {
    if (!isEditMode || e.pointerType === 'mouse') return;
    e.preventDefault();
    mouseDownPos = { x: e.clientX, y: e.clientY };
    pointerMoved  = false;

    if (activeTool === 'select') {
      const g = e.target.closest('[data-id]');
      if (g) {
        selectedId = g.dataset.id;
        renderEditElements();
        updateSelectedSection();
        const sp = svgCoord(e);
        const el = editElems.find(ee => ee.id === selectedId);
        if (el) {
          isDragging = true; dragId = selectedId;
          dragOffX = sp.x - el.x; dragOffY = sp.y - el.y;
          dragGroup = el.type === 'room' ? linkedDoorsForRoom(el) : null;
          editSvgEl.setPointerCapture(e.pointerId); // lock events to this element
        }
      } else {
        selectedId = null;
        renderEditElements();
        updateSelectedSection();
        ePanning = true;
        ePanSX = e.clientX; ePanSY = e.clientY;
        editSvgEl.setPointerCapture(e.pointerId);
      }
    } else {
      editSvgEl.setPointerCapture(e.pointerId); // capture for tap-to-place
    }
  }, { passive: false });

  editSvgEl.addEventListener('pointermove', e => {
    if (!isEditMode || e.pointerType === 'mouse') return;
    e.preventDefault();

    if (mouseDownPos &&
        (Math.abs(e.clientX - mouseDownPos.x) > 3 ||
         Math.abs(e.clientY - mouseDownPos.y) > 3)) {
      pointerMoved = true;
    }

    if (ePanning && pointerMoved) {
      ePanX += e.clientX - ePanSX;
      ePanY += e.clientY - ePanSY;
      ePanSX = e.clientX; ePanSY = e.clientY;
      applyEditTransform();
      return;
    }

    if (isDragging && pointerMoved && dragId) {
      dragSelectedTo(svgCoord(e));
    }
  });

  editSvgEl.addEventListener('pointerup', e => {
    if (!isEditMode || e.pointerType === 'mouse') return;
    if (isDragging) { isDragging = false; dragId = null; editDirty = true; saveEditElems(editElems); }
    dragGroup = null;
    if (ePanning)   { ePanning = false; }

    // Tap to place (non-select tool, no movement)
    if (!pointerMoved && activeTool !== 'select') {
      const sp = svgCoord(e);
      if (activeTool === 'door') {
        const dw = Math.max(30, parseInt(document.getElementById('door-w').value) || 90);
        const s  = snapDoor(sp.x - (doorDir === 'h' ? dw / 2 : 1.5),
                            sp.y - (doorDir === 'h' ? 1.5 : dw / 2), dw, doorDir);
        placeElement(s.x, s.y, dw, 3, 'door', { dir: doorDir, hinge: doorHinge, swing: doorSwing });
      } else {
        const { w, h } = getDims();
        const s = snapElement(sp.x - w / 2, sp.y - h / 2, w, h);
        placeElement(s.x, s.y, w, h, activeTool);
      }
    }
    mouseDownPos = null;
  });

  editSvgEl.addEventListener('pointercancel', e => {
    if (e.pointerType === 'mouse') return;
    isDragging = false; dragId = null; dragGroup = null; ePanning = false; mouseDownPos = null;
  });

  /* ── SVG cursor by tool ── */
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editSvgEl.style.cursor = btn.dataset.tool === 'select' ? 'default' : 'crosshair';
    });
  });
  editSvgEl.style.cursor = 'default';

  /* ── Door preset buttons ── */
  document.querySelectorAll('[data-door]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-door]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const [dir, hinge, swing] = btn.dataset.door.split('|');
      doorDir = dir; doorHinge = hinge; doorSwing = swing;
    });
  });

  /* ── Delete key removes selected element ── */
  document.addEventListener('keydown', e => {
    if (!isEditMode || !selectedId) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') &&
        !e.target.matches('input, textarea, select')) {
      deleteElement(selectedId);
    }
  });

  /* ════════════════════════════════════════
     PHASE 3: Save as new · View SVG
     ════════════════════════════════════════ */

  /* ── Generate clean SVG XML (tight bounding box) ── */
  function generateSvgXml() {
    if (!editElems.length) { showToast('畫布上沒有元素'); return null; }

    const hasReserved = editElems.some(e => e.type === 'reserved');
    const defs = hasReserved
      ? `\n  <defs>\n    <pattern id="hatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45 0 0)">\n      <line x1="0" y1="0" x2="0" y2="12" stroke="#888" stroke-width="4"/>\n    </pattern>\n  </defs>` : '';

    // tight bounding box with 20 cm padding
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const el of editElems) {
      if (el.type === 'door') {
        const { bx, by, bw, bh } = doorBounds(el);
        minX = Math.min(minX, bx);      minY = Math.min(minY, by);
        maxX = Math.max(maxX, bx + bw); maxY = Math.max(maxY, by + bh);
      } else {
        minX = Math.min(minX, el.x);     minY = Math.min(minY, el.y);
        maxX = Math.max(maxX, el.x + el.w); maxY = Math.max(maxY, el.y + el.h);
      }
    }
    const pad = 20;
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    const vw = maxX - minX, vh = maxY - minY;

    // Sort: room → walls → door → reserved
    const sorted = [...editElems].sort((a, b) => (Z[a.type] ?? 0) - (Z[b.type] ?? 0));
    const shapes = sorted.map(el => {
      if (el.type === 'room')
        return `  <rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="white" stroke="#222" stroke-width="10"/>`;
      if (el.type === 'vwall' || el.type === 'hwall')
        return `  <rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="#222"/>`;
      if (el.type === 'door') {
        const dw = el.dir === 'h' ? el.w : el.h;
        const dh = el.dir === 'h' ? el.h : el.w;
        const jambs = doorJambRects(el)
          .map(j => `  <rect x="${j.x}" y="${j.y}" width="${j.w}" height="${j.h}" fill="#444"/>`)
          .join('\n');
        return `  <rect x="${el.x}" y="${el.y}" width="${dw}" height="${dh}" fill="white" stroke="none"/>\n${jambs}\n  <path d="${doorArcPath(el)}" fill="none" stroke="#222" stroke-width="2.2"/>`;
      }
      // reserved — opaque background + hatch overlay
      return `  <rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="#b8c8d4" stroke="#222" stroke-width="10"/>\n  <rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="url(#hatch)" stroke="none"/>`;
    }).join('\n');

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${vw} ${vh}" width="${vw}" height="${vh}">${defs}\n${shapes}\n</svg>`;
  }

  /* ── 另存新圖 ── */
  document.getElementById('btn-save-new').addEventListener('click', () => {
    const xml = generateSvgXml();
    if (!xml) return;
    const input = prompt('儲存名稱（留空自動命名）:', '');
    if (input === null) return; // cancelled
    const id   = Date.now().toString();
    const name = input.trim() || `平面圖 #${records.length + 1}`;
    records.push({ id, name, svg: xml, createdAt: Date.now() });
    saveRecords(records);
    saveEditElemsForId(id, editElems); // carry current elements to new record
    editDirty = false;
    activeId = id;
    renderTabs();
    renderSvg();
    showToast(`已儲存為「${name}」`);
  });

  /* ── 檢視 SVG ── */
  const vsvgOverlay = document.getElementById('vsvg-overlay');
  const vsvgCode    = document.getElementById('vsvg-code');

  document.getElementById('btn-view-svg').addEventListener('click', () => {
    const xml = generateSvgXml();
    if (!xml) return;
    vsvgCode.value = xml;
    vsvgOverlay.style.display = 'flex';
  });

  document.getElementById('btn-close-vsvg').addEventListener('click', () => {
    vsvgOverlay.style.display = 'none';
  });
  vsvgOverlay.addEventListener('click', e => {
    if (e.target === vsvgOverlay) vsvgOverlay.style.display = 'none';
  });

  /* ── 複製 SVG ── */
  document.getElementById('btn-copy-svg').addEventListener('click', () => {
    navigator.clipboard.writeText(vsvgCode.value)
      .then(() => showToast('已複製到剪貼簿'))
      .catch(() => {
        vsvgCode.select();
        document.execCommand('copy');
        showToast('已複製到剪貼簿');
      });
  });

  /* Escape closes view-svg modal */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && vsvgOverlay.style.display !== 'none')
      vsvgOverlay.style.display = 'none';
  });

  /* ── Viewer background toggle ── */
  document.querySelectorAll('.bg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      canvasEl.classList.remove('bg-dark', 'bg-medium', 'bg-light');
      if (btn.dataset.bg) canvasEl.classList.add(btn.dataset.bg);
      saveBg(btn.dataset.bg ?? '');
    });
  });

  /* ── Init ── */

  // Restore background selection
  (function() {
    const savedBg = loadBg();
    document.querySelectorAll('.bg-btn').forEach(b => {
      b.classList.toggle('active', (b.dataset.bg ?? '') === savedBg);
    });
    canvasEl.classList.remove('bg-dark', 'bg-medium', 'bg-light');
    if (savedBg) canvasEl.classList.add(savedBg);
  })();

  /* ── Restore edit mode state from previous session ── */
  (function restoreEditingState() {
    const savedIds = loadEditingSetIds().filter(id => records.find(r => r.id === id));
    savedIds.forEach(id => {
      const rec = records.find(r => r.id === id);
      const { elems, bgMarkup } = parseSvgRecord(rec.svg);
      editingSet.add(id);
      editStateMap.set(id, { elems: [...elems], bgMarkup });
      if (id === activeId) {
        editElems       = elems;
        currentBgMarkup = bgMarkup;
      }
    });
    updateEditModeUI();
  })();

  renderTabs();
  renderSvg();
  if (isEditMode) {
    renderEditGrid();
    renderBgLayer();
    renderEditElements();
    requestAnimationFrame(fitEditCanvas);
    updateDimSection();
  }
</script>
</body>
</html>
