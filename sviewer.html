<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SVG Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    #topbar h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #e94560;
      margin-right: 8px;
      white-space: nowrap;
    }

    .btn {
      padding: 5px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: filter 0.15s;
    }
    .btn:hover { filter: brightness(1.2); }

    .btn-primary { background: #e94560; color: #fff; }
    .btn-secondary { background: #0f3460; color: #c8d6e5; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; }

    #file-input { display: none; }

    /* ── Record tabs ── */
    #tabs-wrap {
      position: fixed;
      top: 41px; /* height of topbar */
      left: 0;
      right: 0;
      z-index: 50;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: thin;
      scrollbar-color: #0f3460 transparent;
    }

    #tabs {
      display: flex;
      gap: 2px;
      padding: 4px 8px;
      min-width: max-content;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: #0f3460;
      border-radius: 5px 5px 0 0;
      cursor: pointer;
      font-size: 0.8rem;
      color: #94a3b8;
      border: 1px solid transparent;
      border-bottom: none;
      max-width: 180px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .tab:hover { background: #1e4080; color: #e0e0e0; }
    .tab.active {
      background: #1a1a2e;
      color: #e94560;
      border-color: #0f3460;
    }

    .tab-name {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 130px;
    }

    .tab-close {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .tab-close:hover { background: #e94560; color: #fff; }

    /* ── Main area ── */
    #main {
      position: fixed;
      top: 82px; /* topbar ~41px + tabs-wrap ~41px */
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      overflow: hidden;
    }

    /* ── SVG canvas ── */
    #canvas {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      position: relative;
      background:
        linear-gradient(45deg, #1e293b 25%, transparent 25%),
        linear-gradient(-45deg, #1e293b 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1e293b 75%),
        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #0f172a;
    }

    #svg-container {
      position: relative;
      transform-origin: center center;
      cursor: grab;
      user-select: none;
    }
    #svg-container.grabbing { cursor: grabbing; }
    #svg-container svg {
      display: block;
      max-width: none;
    }

    #empty-hint {
      text-align: center;
      color: #475569;
      pointer-events: none;
    }
    #empty-hint .icon { font-size: 4rem; margin-bottom: 12px; }
    #empty-hint p { font-size: 0.9rem; line-height: 1.8; }

    /* ── Zoom controls ── */
    #zoom-controls {
      position: absolute;
      bottom: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .zoom-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #16213e;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .zoom-btn:hover { background: #0f3460; }

    #zoom-label {
      font-size: 0.7rem;
      color: #64748b;
      text-align: center;
    }

    /* ── Modal overlay ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }

    #modal {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 24px;
      width: min(600px, 95vw);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #modal h2 { font-size: 1rem; color: #e94560; }

    #modal-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #0f3460;
      padding-bottom: 8px;
    }
    .modal-tab-btn {
      padding: 4px 14px;
      border-radius: 4px;
      border: none;
      background: #0f3460;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .modal-tab-btn.active { background: #e94560; color: #fff; }

    .modal-panel { display: none; flex-direction: column; gap: 10px; }
    .modal-panel.active { display: flex; }

    #name-input {
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #0f3460;
      background: #0f172a;
      color: #e0e0e0;
      font-size: 0.85rem;
    }

    #svg-textarea {
      flex: 1;
      min-height: 200px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #0f3460;
      background: #0f172a;
      color: #a0c4ff;
      font-family: monospace;
      font-size: 0.78rem;
      resize: vertical;
    }

    #drop-zone {
      border: 2px dashed #0f3460;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      color: #475569;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      font-size: 0.85rem;
    }
    #drop-zone:hover, #drop-zone.dragover {
      border-color: #e94560;
      color: #e0e0e0;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ── Confirm dialog ── */
    #confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #confirm-overlay.open { display: flex; }
    #confirm-box {
      background: #16213e;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 24px;
      width: min(360px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #confirm-box p { font-size: 0.9rem; color: #e0e0e0; line-height: 1.5; }
    #confirm-box .modal-footer { margin-top: 4px; }

    /* ── Error toast ── */
    #toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #7f1d1d;
      color: #fca5a5;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 0.82rem;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 300;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ════════════════════════════════
       EDIT MODE
       ════════════════════════════════ */

    #btn-edit-mode.active { background: #f59e0b; color: #1a1a2e; }

    /* viewer background toggle */
    .bg-btn {
      padding: 3px 9px;
      border-radius: 4px;
      border: 1px solid #1e3a5f;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.12s;
    }
    .bg-btn:hover { color: #e0e0e0; border-color: #3b82f6; }
    .bg-btn.active { background: #0f3460; color: #e0e0e0; border-color: #3b82f6; }
    #canvas.bg-dark  { background: #0f172a !important; }
    #canvas.bg-light { background: #e8ecf0 !important; }

    /* sidebar */
    #edit-sidebar {
      display: none;
      width: 210px;
      min-width: 210px;
      flex-direction: column;
      background: #16213e;
      border-right: 1px solid #0f3460;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #0f3460 transparent;
    }
    body.edit-mode #canvas          { display: none; }
    body.edit-mode #edit-sidebar    { display: flex; }
    body.edit-mode #edit-canvas-wrap{ display: flex; }

    /* edit canvas wrap */
    #edit-canvas-wrap {
      display: none;
      flex: 1;
      overflow: hidden;
      position: relative;
      background: #b8c4cc;
      align-items: center;
      justify-content: center;
    }
    #edit-svg-container {
      transform-origin: center center;
      user-select: none;
      line-height: 0;
    }

    /* sidebar sections */
    .esec {
      padding: 10px 12px;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }
    .esec h3 {
      font-size: 0.68rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
    }

    /* tool buttons */
    .tool-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 6px 9px;
      margin-bottom: 3px;
      border: 1px solid #1e3a5f;
      border-radius: 5px;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: left;
      transition: background 0.12s, color 0.12s;
    }
    .tool-btn:last-child { margin-bottom: 0; }
    .tool-btn:hover  { background: #1e3a5f; color: #e0e0e0; }
    .tool-btn.active { background: #e94560; color: #fff; border-color: #e94560; }
    .tool-icon {
      display: inline-block;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
      font-size: 0.95rem;
      font-style: normal;
    }

    /* dimension inputs */
    .dim-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
    }
    .dim-row:last-child { margin-bottom: 0; }
    .dim-row label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      width: 14px;
      flex-shrink: 0;
    }
    .dim-input {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #0f3460;
      background: #0f172a;
      color: #e0e0e0;
      font-size: 0.8rem;
    }
    .dim-unit { font-size: 0.7rem; color: #475569; }

    /* selected info */
    #selected-info { font-size: 0.77rem; color: #94a3b8; line-height: 1.9; }

    /* edit zoom */
    #edit-zoom-controls {
      position: absolute;
      bottom: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #edit-zoom-label { font-size: 0.7rem; color: #64748b; text-align: center; }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <h1>SVG Viewer</h1>
  <button class="btn btn-primary" id="btn-add">+ 新增</button>
  <button class="btn btn-secondary" id="btn-edit-mode">✎ 編修模式</button>
  <span style="color:#334155;font-size:0.72rem;margin-left:6px;white-space:nowrap">背景</span>
  <button class="bg-btn active" data-bg="">無</button>
  <button class="bg-btn" data-bg="bg-dark">深色</button>
  <button class="bg-btn" data-bg="bg-light">淺色</button>
  <input type="file" id="file-input" accept=".svg,image/svg+xml">
</div>

<!-- Tabs -->
<div id="tabs-wrap">
  <div id="tabs"></div>
</div>

<!-- Main -->
<div id="main">
  <div id="canvas">
    <div id="empty-hint">
      <div class="icon">🖼️</div>
      <p>尚無 SVG 紀錄<br>點擊「新增」貼入 XML 或開啟 SVG 檔案</p>
    </div>
    <div id="svg-container"></div>
    <div id="zoom-controls">
      <button class="zoom-btn" id="btn-zoom-in" title="放大">+</button>
      <div id="zoom-label">100%</div>
      <button class="zoom-btn" id="btn-zoom-out" title="縮小">−</button>
      <button class="zoom-btn" id="btn-zoom-fit" title="適合視窗" style="font-size:0.65rem">FIT</button>
      <button class="zoom-btn" id="btn-zoom-reset" title="重置" style="font-size:0.65rem">1:1</button>
    </div>
  </div>

  <!-- ── Edit Sidebar ── -->
  <div id="edit-sidebar">

    <div class="esec">
      <h3>工具</h3>
      <button class="tool-btn active" data-tool="select"><i class="tool-icon">▶</i>選取</button>
      <button class="tool-btn" data-tool="room"><i class="tool-icon">□</i>房</button>
      <button class="tool-btn" data-tool="vwall"><i class="tool-icon">│</i>垂直牆</button>
      <button class="tool-btn" data-tool="hwall"><i class="tool-icon">─</i>橫向牆</button>
      <button class="tool-btn" data-tool="reserved"><i class="tool-icon">▨</i>保留</button>
    </div>

    <div class="esec" id="dim-section">
      <h3>尺寸 <span style="color:#475569;font-size:0.66rem;text-transform:none;letter-spacing:0">（公分）</span></h3>
      <div class="dim-row" id="dim-w-row">
        <label>W</label>
        <input type="number" class="dim-input" id="dim-w" value="300" min="10" step="10">
        <span class="dim-unit">cm</span>
      </div>
      <div class="dim-row" id="dim-h-row">
        <label>H</label>
        <input type="number" class="dim-input" id="dim-h" value="300" min="10" step="10">
        <span class="dim-unit">cm</span>
      </div>
      <div class="dim-row" id="dim-len-row">
        <label>L</label>
        <input type="number" class="dim-input" id="dim-len" value="200" min="10" step="10">
        <span class="dim-unit">cm</span>
      </div>
    </div>

    <div class="esec" id="selected-section" style="display:none">
      <h3>選取元素</h3>
      <div id="selected-info"></div>
      <button class="btn btn-danger" id="btn-delete-selected"
              style="width:100%;margin-top:8px;font-size:0.8rem;padding:5px">刪除</button>
    </div>

    <div class="esec" style="margin-top:auto">
      <h3>輸出</h3>
      <button class="btn btn-primary" id="btn-save-new"
              style="width:100%;margin-bottom:5px;font-size:0.8rem;padding:5px">另存新圖</button>
      <button class="btn btn-secondary" id="btn-view-svg"
              style="width:100%;font-size:0.8rem;padding:5px">檢視 SVG</button>
    </div>

    <div class="esec">
      <button class="btn btn-secondary" id="btn-clear-canvas"
              style="width:100%;font-size:0.8rem;padding:5px">清空畫布</button>
    </div>

  </div><!-- /edit-sidebar -->

  <!-- ── Edit Canvas ── -->
  <div id="edit-canvas-wrap">
    <div id="edit-svg-container">
      <svg id="edit-svg" viewBox="0 0 1600 1300" width="1600" height="1300"
           xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="ep-hatch" patternUnits="userSpaceOnUse" width="12" height="12"
                   patternTransform="rotate(45 0 0)">
            <line x1="0" y1="0" x2="0" y2="12" stroke="#888" stroke-width="4"/>
          </pattern>
        </defs>
        <rect width="1600" height="1300" fill="white"/>
        <g id="ep-grid"></g>
        <g id="ep-elements"></g>
        <g id="ep-preview"></g>
        <g id="ep-snap"></g>
      </svg>
    </div>
    <div id="edit-zoom-controls">
      <button class="zoom-btn" id="btn-edit-zoom-in">+</button>
      <div id="edit-zoom-label">100%</div>
      <button class="zoom-btn" id="btn-edit-zoom-out">−</button>
      <button class="zoom-btn" id="btn-edit-zoom-fit" style="font-size:0.65rem">FIT</button>
    </div>
  </div><!-- /edit-canvas-wrap -->

</div>

<!-- Add modal -->
<div id="modal-overlay">
  <div id="modal">
    <h2>新增 SVG</h2>
    <input id="name-input" type="text" placeholder="名稱（選填，留空自動命名）">
    <div id="modal-tabs">
      <button class="modal-tab-btn active" data-panel="paste">貼入 XML</button>
      <button class="modal-tab-btn" data-panel="file">開啟檔案</button>
    </div>

    <!-- Paste panel -->
    <div class="modal-panel active" id="panel-paste">
      <textarea id="svg-textarea" placeholder="在此貼入 SVG XML…&#10;&#10;例如：&#10;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;100&quot; height=&quot;100&quot;&gt;…&lt;/svg&gt;"></textarea>
    </div>

    <!-- File panel -->
    <div class="modal-panel" id="panel-file">
      <div id="drop-zone">
        <div>拖曳 SVG 檔案到此，或點擊選擇</div>
        <div style="margin-top:8px;font-size:0.75rem;color:#334155">支援 .svg 格式</div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" id="btn-modal-cancel">取消</button>
      <button class="btn btn-primary" id="btn-modal-save">儲存</button>
    </div>
  </div>
</div>

<!-- Confirm dialog -->
<div id="confirm-overlay">
  <div id="confirm-box">
    <p id="confirm-msg"></p>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="btn-confirm-no">取消</button>
      <button class="btn btn-danger" id="btn-confirm-yes">刪除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- ── View SVG Modal ── -->
<div id="vsvg-overlay"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:200;align-items:center;justify-content:center;">
  <div style="background:#16213e;border:1px solid #0f3460;border-radius:10px;padding:20px;
              width:min(700px,95vw);max-height:88vh;display:flex;flex-direction:column;gap:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="font-size:1rem;color:#e94560;">SVG 原始碼</h2>
      <button class="btn btn-secondary" id="btn-copy-svg"
              style="font-size:0.8rem;padding:4px 14px;">複製</button>
    </div>
    <textarea id="vsvg-code" readonly
              style="flex:1;min-height:340px;padding:10px;border-radius:5px;
                     border:1px solid #0f3460;background:#0f172a;color:#a0c4ff;
                     font-family:monospace;font-size:0.75rem;resize:vertical;"></textarea>
    <div style="display:flex;justify-content:flex-end;">
      <button class="btn btn-secondary" id="btn-close-vsvg"
              style="font-size:0.8rem;">關閉</button>
    </div>
  </div>
</div>

<script>
  /* ── Storage helpers ── */
  const STORAGE_KEY = 'svg_viewer_records';

  function loadRecords() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveRecords(records) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  /* ── State ── */
  let records = loadRecords();       // [{id, name, svg, createdAt}]
  let activeId = records.length ? records[records.length - 1].id : null;
  let scale = 1;
  let panX = 0, panY = 0;
  let isPanning = false, startX = 0, startY = 0;
  let pendingFileContent = null;     // svg string from file drop/select
  let activeModalPanel = 'paste';
  let confirmCallback = null;

  /* ── DOM refs ── */
  const tabsEl        = document.getElementById('tabs');
  const canvasEl      = document.getElementById('canvas');
  const svgContainer  = document.getElementById('svg-container');
  const emptyHint     = document.getElementById('empty-hint');
  const zoomLabel     = document.getElementById('zoom-label');
  const modalOverlay  = document.getElementById('modal-overlay');
  const confirmOverlay= document.getElementById('confirm-overlay');
  const nameInput     = document.getElementById('name-input');
  const svgTextarea   = document.getElementById('svg-textarea');
  const dropZone      = document.getElementById('drop-zone');
  const confirmMsg    = document.getElementById('confirm-msg');
  const fileInput     = document.getElementById('file-input');

  /* ── Render tabs ── */
  function renderTabs() {
    tabsEl.innerHTML = '';
    records.forEach(rec => {
      const tab = document.createElement('div');
      tab.className = 'tab' + (rec.id === activeId ? ' active' : '');
      tab.dataset.id = rec.id;

      const nameSpan = document.createElement('span');
      nameSpan.className = 'tab-name';
      nameSpan.textContent = rec.name;
      nameSpan.title = rec.name;

      const closeBtn = document.createElement('button');
      closeBtn.className = 'tab-close';
      closeBtn.innerHTML = '✕';
      closeBtn.title = '刪除';
      closeBtn.addEventListener('click', e => {
        e.stopPropagation();
        askDelete(rec.id, rec.name);
      });

      tab.appendChild(nameSpan);
      tab.appendChild(closeBtn);
      tab.addEventListener('click', () => switchTo(rec.id));
      tabsEl.appendChild(tab);
    });

    // scroll active tab into view
    const activeTab = tabsEl.querySelector('.tab.active');
    if (activeTab) activeTab.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  }

  /* ── Render SVG ── */
  function renderSvg() {
    const rec = records.find(r => r.id === activeId);
    if (!rec) {
      svgContainer.innerHTML = '';
      emptyHint.style.display = 'block';
      return;
    }
    emptyHint.style.display = 'none';
    svgContainer.innerHTML = rec.svg;
    // ensure svg fills container naturally
    const svgEl = svgContainer.querySelector('svg');
    if (svgEl) {
      svgEl.removeAttribute('style');
    }
    resetTransform();
  }

  function switchTo(id) {
    activeId = id;
    renderTabs();
    renderSvg();
  }

  /* ── Transform (zoom/pan) ── */
  function applyTransform() {
    svgContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    zoomLabel.textContent = Math.round(scale * 100) + '%';
  }

  function resetTransform() {
    scale = 1; panX = 0; panY = 0;
    applyTransform();
  }

  function fitTransform() {
    const svgEl = svgContainer.querySelector('svg');
    if (!svgEl) return;
    const cw = canvasEl.clientWidth - 40;
    const ch = canvasEl.clientHeight - 40;
    const sw = svgEl.getBoundingClientRect().width / scale;
    const sh = svgEl.getBoundingClientRect().height / scale;
    if (sw === 0 || sh === 0) return;
    const s = Math.min(cw / sw, ch / sh, 3);
    scale = s; panX = 0; panY = 0;
    applyTransform();
  }

  document.getElementById('btn-zoom-in').addEventListener('click', () => {
    scale = Math.min(scale * 1.25, 20); applyTransform();
  });
  document.getElementById('btn-zoom-out').addEventListener('click', () => {
    scale = Math.max(scale / 1.25, 0.05); applyTransform();
  });
  document.getElementById('btn-zoom-fit').addEventListener('click', fitTransform);
  document.getElementById('btn-zoom-reset').addEventListener('click', resetTransform);

  // Wheel zoom
  canvasEl.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    const rect = canvasEl.getBoundingClientRect();
    const ox = e.clientX - rect.left - canvasEl.clientWidth / 2;
    const oy = e.clientY - rect.top - canvasEl.clientHeight / 2;
    panX = ox + (panX - ox) * factor;
    panY = oy + (panY - oy) * factor;
    scale = Math.min(Math.max(scale * factor, 0.05), 20);
    applyTransform();
  }, { passive: false });

  // Pan
  svgContainer.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    isPanning = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    svgContainer.classList.add('grabbing');
  });
  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    applyTransform();
  });
  window.addEventListener('mouseup', () => {
    isPanning = false;
    svgContainer.classList.remove('grabbing');
  });

  /* ── Add modal ── */
  document.getElementById('btn-add').addEventListener('click', openModal);

  function openModal() {
    nameInput.value = '';
    svgTextarea.value = '';
    pendingFileContent = null;
    switchModalPanel('paste');
    modalOverlay.classList.add('open');
    svgTextarea.focus();
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
    pendingFileContent = null;
  }

  document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

  // Modal panel switching
  document.querySelectorAll('.modal-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchModalPanel(btn.dataset.panel));
  });

  function switchModalPanel(panel) {
    activeModalPanel = panel;
    document.querySelectorAll('.modal-tab-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.panel === panel));
    document.querySelectorAll('.modal-panel').forEach(p =>
      p.classList.toggle('active', p.id === 'panel-' + panel));
  }

  // Save
  document.getElementById('btn-modal-save').addEventListener('click', saveNew);

  function saveNew() {
    let svgStr = '';
    if (activeModalPanel === 'paste') {
      svgStr = svgTextarea.value.trim();
    } else {
      svgStr = pendingFileContent ? pendingFileContent.trim() : '';
    }

    if (!svgStr) { showToast('請貼入 SVG XML 或選擇檔案'); return; }
    if (!svgStr.includes('<svg') && !svgStr.includes('<SVG')) {
      showToast('內容似乎不是有效的 SVG'); return;
    }

    const id = Date.now().toString();
    const name = nameInput.value.trim() || autoName();
    records.push({ id, name, svg: svgStr, createdAt: Date.now() });
    saveRecords(records);
    activeId = id;
    renderTabs();
    renderSvg();
    closeModal();
  }

  let autoCounter = 0;
  function autoName() {
    autoCounter++;
    return `SVG #${records.length + 1}`;
  }

  /* ── File open (drop zone) ── */
  dropZone.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (file) readFile(file);
    fileInput.value = '';
  });

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) readFile(file);
  });

  function readFile(file) {
    if (!file.name.toLowerCase().endsWith('.svg') && file.type !== 'image/svg+xml') {
      showToast('請選擇 .svg 格式的檔案'); return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      pendingFileContent = ev.target.result;
      if (!nameInput.value.trim()) {
        nameInput.value = file.name.replace(/\.svg$/i, '');
      }
      dropZone.innerHTML = `<div style="color:#4ade80">✔ 已載入：${file.name}</div>`;
    };
    reader.readAsText(file);
  }

  /* ── Delete ── */
  function askDelete(id, name) {
    confirmMsg.textContent = `確定要刪除「${name}」嗎？此操作無法復原。`;
    confirmCallback = () => deleteRecord(id);
    confirmOverlay.classList.add('open');
  }

  document.getElementById('btn-confirm-yes').addEventListener('click', () => {
    confirmOverlay.classList.remove('open');
    if (confirmCallback) { confirmCallback(); confirmCallback = null; }
  });
  document.getElementById('btn-confirm-no').addEventListener('click', () => {
    confirmOverlay.classList.remove('open');
    confirmCallback = null;
  });
  confirmOverlay.addEventListener('click', e => {
    if (e.target === confirmOverlay) {
      confirmOverlay.classList.remove('open');
      confirmCallback = null;
    }
  });

  function deleteRecord(id) {
    const idx = records.findIndex(r => r.id === id);
    if (idx === -1) return;
    records.splice(idx, 1);
    saveRecords(records);
    if (activeId === id) {
      activeId = records.length ? records[Math.max(0, idx - 1)].id : null;
    }
    renderTabs();
    renderSvg();
  }

  /* ── Toast ── */
  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  /* ── Keyboard shortcuts ── */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (confirmOverlay.classList.contains('open')) {
        confirmOverlay.classList.remove('open'); confirmCallback = null;
      } else {
        closeModal();
      }
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); openModal(); }
  });

  /* ── Block browser-level zoom so UI never disappears ── */
  // Ctrl+Wheel anywhere outside the canvas
  document.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
  }, { passive: false });

  // Ctrl++ / Ctrl+- / Ctrl+0
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
      e.preventDefault();
    }
  }, true);

  // Pinch-to-zoom (touch devices)
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
  document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });

  /* ════════════════════════════════════════
     EDIT MODE  —  Phase 1: skeleton
     ════════════════════════════════════════ */

  const btnEditMode      = document.getElementById('btn-edit-mode');
  const editCanvasWrap   = document.getElementById('edit-canvas-wrap');
  const editSvgContainer = document.getElementById('edit-svg-container');
  const epGrid           = document.getElementById('ep-grid');
  const epElements       = document.getElementById('ep-elements');
  const epPreview        = document.getElementById('ep-preview');
  const epSnap           = document.getElementById('ep-snap');

  let isEditMode  = false;
  let activeTool  = 'select';   // 'select'|'room'|'vwall'|'hwall'|'reserved'
  let editElems   = [];          // placed elements data
  let selectedId  = null;
  let eScale      = 1, ePanX = 0, ePanY = 0;
  let ePanning    = false, ePanSX = 0, ePanSY = 0;

  /* ── Toggle edit mode ── */
  btnEditMode.addEventListener('click', () => {
    isEditMode = !isEditMode;
    document.body.classList.toggle('edit-mode', isEditMode);
    btnEditMode.classList.toggle('active', isEditMode);
    btnEditMode.textContent = isEditMode ? '✕ 離開編修' : '✎ 編修模式';
    if (isEditMode) {
      renderEditGrid();
      requestAnimationFrame(fitEditCanvas);
      updateDimSection();
    } else {
      epPreview.innerHTML = '';
      epSnap.innerHTML    = '';
      renderSvg();        // restore viewer on exit
    }
  });

  /* ── Fit / transform ── */
  function fitEditCanvas() {
    const ww = editCanvasWrap.clientWidth  - 40;
    const wh = editCanvasWrap.clientHeight - 40;
    eScale = Math.min(ww / 1600, wh / 1300, 1);
    ePanX = 0; ePanY = 0;
    applyEditTransform();
  }

  function applyEditTransform() {
    editSvgContainer.style.transform =
      `translate(${ePanX}px,${ePanY}px) scale(${eScale})`;
    document.getElementById('edit-zoom-label').textContent =
      Math.round(eScale * 100) + '%';
  }

  /* ── Zoom buttons ── */
  document.getElementById('btn-edit-zoom-in').addEventListener('click', () => {
    eScale = Math.min(eScale * 1.25, 10); applyEditTransform();
  });
  document.getElementById('btn-edit-zoom-out').addEventListener('click', () => {
    eScale = Math.max(eScale / 1.25, 0.1); applyEditTransform();
  });
  document.getElementById('btn-edit-zoom-fit').addEventListener('click', fitEditCanvas);

  /* ── Wheel zoom on edit canvas ── */
  editCanvasWrap.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.1 : 0.9;
    const r = editCanvasWrap.getBoundingClientRect();
    const ox = e.clientX - r.left  - editCanvasWrap.clientWidth  / 2;
    const oy = e.clientY - r.top   - editCanvasWrap.clientHeight / 2;
    ePanX  = ox + (ePanX - ox) * f;
    ePanY  = oy + (ePanY - oy) * f;
    eScale = Math.min(Math.max(eScale * f, 0.1), 10);
    applyEditTransform();
  }, { passive: false });

  /* ── Pan: Ctrl+drag or middle-mouse ── */
  editCanvasWrap.addEventListener('mousedown', e => {
    if (e.button === 1 || (e.button === 0 && e.ctrlKey)) {
      e.preventDefault();
      ePanning = true;
      ePanSX   = e.clientX - ePanX;
      ePanSY   = e.clientY - ePanY;
      editCanvasWrap.style.cursor = 'grabbing';
    }
  });
  window.addEventListener('mousemove', e => {
    if (!ePanning) return;
    ePanX = e.clientX - ePanSX;
    ePanY = e.clientY - ePanSY;
    applyEditTransform();
  });
  window.addEventListener('mouseup', () => {
    if (ePanning) { ePanning = false; editCanvasWrap.style.cursor = ''; }
  });

  /* ── Grid ── */
  function renderEditGrid() {
    const ns = 'http://www.w3.org/2000/svg';
    epGrid.innerHTML = '';
    for (let x = 0; x <= 1600; x += 50) {
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', x); l.setAttribute('y1', 0);
      l.setAttribute('x2', x); l.setAttribute('y2', 1300);
      l.setAttribute('stroke', x % 100 === 0 ? '#aab4be' : '#d4dae0');
      l.setAttribute('stroke-width', '0.5');
      epGrid.appendChild(l);
    }
    for (let y = 0; y <= 1300; y += 50) {
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', 0); l.setAttribute('y1', y);
      l.setAttribute('x2', 1600); l.setAttribute('y2', y);
      l.setAttribute('stroke', y % 100 === 0 ? '#aab4be' : '#d4dae0');
      l.setAttribute('stroke-width', '0.5');
      epGrid.appendChild(l);
    }
    // border
    const bdr = document.createElementNS(ns, 'rect');
    ['x','y','width','height','fill','stroke','stroke-width'].forEach((a,i) =>
      bdr.setAttribute(a, ['0','0','1600','1300','none','#666','1'][i]));
    epGrid.appendChild(bdr);
    // axis labels every 100cm
    for (let x = 100; x <= 1600; x += 100) {
      const t = document.createElementNS(ns, 'text');
      t.setAttribute('x', x); t.setAttribute('y', '-3');
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', '9'); t.setAttribute('fill', '#999');
      t.textContent = x; epGrid.appendChild(t);
    }
    for (let y = 100; y <= 1300; y += 100) {
      const t = document.createElementNS(ns, 'text');
      t.setAttribute('x', '-4'); t.setAttribute('y', y + 3);
      t.setAttribute('text-anchor', 'end');
      t.setAttribute('font-size', '9'); t.setAttribute('fill', '#999');
      t.textContent = y; epGrid.appendChild(t);
    }
  }

  /* ── Tool switching ── */
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTool = btn.dataset.tool;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedId = null;
      updateSelectedSection();
      updateDimSection();
      epPreview.innerHTML = '';
      epSnap.innerHTML    = '';
    });
  });

  function updateDimSection() {
    const sec  = document.getElementById('dim-section');
    const wRow = document.getElementById('dim-w-row');
    const hRow = document.getElementById('dim-h-row');
    const lRow = document.getElementById('dim-len-row');
    if (activeTool === 'select') { sec.style.display = 'none'; return; }
    sec.style.display = '';
    const isRect = activeTool === 'room' || activeTool === 'reserved';
    wRow.style.display = isRect ? '' : 'none';
    hRow.style.display = isRect ? '' : 'none';
    lRow.style.display = isRect ? 'none' : '';
  }

  function updateSelectedSection() {
    const sec  = document.getElementById('selected-section');
    const info = document.getElementById('selected-info');
    if (!selectedId) { sec.style.display = 'none'; return; }
    const el = editElems.find(e => e.id === selectedId);
    if (!el) { sec.style.display = 'none'; return; }
    sec.style.display = '';
    const label = { room:'房', vwall:'垂直牆', hwall:'橫向牆', reserved:'保留' }[el.type];
    info.innerHTML = (el.type === 'vwall' || el.type === 'hwall')
      ? `類型：${label}<br>位置：(${el.x}, ${el.y}) cm<br>長度：${el.type==='vwall'?el.h:el.w} cm`
      : `類型：${label}<br>位置：(${el.x}, ${el.y}) cm<br>尺寸：${el.w} × ${el.h} cm`;
  }

  /* ── Delete selected ── */
  document.getElementById('btn-delete-selected').addEventListener('click', () => {
    if (!selectedId) return;
    editElems = editElems.filter(e => e.id !== selectedId);
    selectedId = null;
    renderEditElements();
    updateSelectedSection();
  });

  /* ── Clear canvas ── */
  document.getElementById('btn-clear-canvas').addEventListener('click', () => {
    if (!editElems.length) return;
    if (!confirm('確定清空畫布？此操作無法復原。')) return;
    editElems = []; selectedId = null;
    renderEditElements(); updateSelectedSection();
  });

  /* ── Render elements ── */
  function renderEditElements() {
    const ns = 'http://www.w3.org/2000/svg';
    epElements.innerHTML = '';
    for (const el of editElems) {
      const g = document.createElementNS(ns, 'g');
      g.dataset.id = el.id;

      if (el.type === 'room' || el.type === 'reserved') {
        const r = document.createElementNS(ns, 'rect');
        r.setAttribute('x', el.x);   r.setAttribute('y', el.y);
        r.setAttribute('width', el.w); r.setAttribute('height', el.h);
        r.setAttribute('fill', el.type === 'room' ? 'white' : 'url(#ep-hatch)');
        r.setAttribute('stroke', '#222');
        r.setAttribute('stroke-width', '10');
        g.appendChild(r);
        // dimension label
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('x', el.x + el.w / 2);
        t.setAttribute('y', el.y + el.h / 2 + 5);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-size', '14');
        t.setAttribute('fill', el.type === 'room' ? '#666' : '#444');
        t.setAttribute('pointer-events', 'none');
        t.textContent = `${el.w}×${el.h}`;
        g.appendChild(t);
      } else {
        // vwall / hwall — solid filled rectangle
        const r = document.createElementNS(ns, 'rect');
        r.setAttribute('x', el.x);   r.setAttribute('y', el.y);
        r.setAttribute('width', el.w); r.setAttribute('height', el.h);
        r.setAttribute('fill', '#222');
        g.appendChild(r);
      }

      // selection ring
      if (el.id === selectedId) {
        const ring = document.createElementNS(ns, 'rect');
        const pad = 4;
        ring.setAttribute('x', el.x - pad);   ring.setAttribute('y', el.y - pad);
        ring.setAttribute('width',  el.w + pad * 2);
        ring.setAttribute('height', el.h + pad * 2);
        ring.setAttribute('fill', 'none');
        ring.setAttribute('stroke', '#3b82f6');
        ring.setAttribute('stroke-width', '2.5');
        ring.setAttribute('stroke-dasharray', '10,4');
        ring.setAttribute('pointer-events', 'none');
        g.appendChild(ring);
      }

      epElements.appendChild(g);
    }
  }

  /* ════════════════════════════════════════
     PHASE 2: Placement · Snap · Drag
     ════════════════════════════════════════ */

  const editSvgEl  = document.getElementById('edit-svg');
  const SNAP_DIST  = 15;   // cm — edge-snap threshold

  let isDragging   = false;
  let dragId       = null;
  let dragOffX     = 0, dragOffY = 0;
  let mouseDownPos = null;
  let pointerMoved = false;

  /* ── Mouse → SVG coordinate ── */
  function svgCoord(e) {
    const r = editSvgEl.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (1600 / r.width),
      y: (e.clientY - r.top)  * (1300 / r.height)
    };
  }

  /* ── Read dimension inputs ── */
  function getDims() {
    const w = Math.max(10, parseInt(document.getElementById('dim-w').value)   || 300);
    const h = Math.max(10, parseInt(document.getElementById('dim-h').value)   || 300);
    const l = Math.max(10, parseInt(document.getElementById('dim-len').value) || 200);
    if (activeTool === 'vwall') return { w: 10, h: l };
    if (activeTool === 'hwall') return { w: l,  h: 10 };
    return { w, h };
  }

  /* ── Snap: grid (10 cm) then edge ── */
  function snapElement(x, y, w, h, excludeId) {
    let sx = Math.round(x / 10) * 10;
    let sy = Math.round(y / 10) * 10;

    let bestDX = SNAP_DIST, bestDY = SNAP_DIST;
    let snapX  = null,      snapY  = null;

    for (const el of editElems) {
      if (el.id === excludeId) continue;
      const er = el.x + el.w,  eb = el.y + el.h;
      const nr = sx  + w,      nb = sy  + h;

      // x candidates: align left/right edges of new vs existing
      for (const c of [
        { d: Math.abs(sx - er),   v: er       },   // new.left  = ex.right
        { d: Math.abs(nr - el.x), v: el.x - w },   // new.right = ex.left
        { d: Math.abs(sx - el.x), v: el.x     },   // new.left  = ex.left
        { d: Math.abs(nr - er),   v: er - w   },   // new.right = ex.right
      ]) { if (c.d < bestDX) { bestDX = c.d; snapX = c.v; } }

      // y candidates
      for (const c of [
        { d: Math.abs(sy - eb),   v: eb       },
        { d: Math.abs(nb - el.y), v: el.y - h },
        { d: Math.abs(sy - el.y), v: el.y     },
        { d: Math.abs(nb - eb),   v: eb - h   },
      ]) { if (c.d < bestDY) { bestDY = c.d; snapY = c.v; } }
    }

    if (snapX !== null) sx = snapX;
    if (snapY !== null) sy = snapY;

    // clamp to canvas
    return {
      x: Math.max(0, Math.min(1600 - w, sx)),
      y: Math.max(0, Math.min(1300 - h, sy))
    };
  }

  /* ── Ghost preview element ── */
  function drawPreview(x, y, w, h, type) {
    const ns = 'http://www.w3.org/2000/svg';
    epPreview.innerHTML = '';
    const r = document.createElementNS(ns, 'rect');
    r.setAttribute('x', x); r.setAttribute('y', y);
    r.setAttribute('width', w); r.setAttribute('height', h);
    r.setAttribute('pointer-events', 'none');
    if (type === 'vwall' || type === 'hwall') {
      r.setAttribute('fill', 'rgba(30,30,30,0.45)');
    } else if (type === 'room') {
      r.setAttribute('fill', 'rgba(255,255,255,0.55)');
      r.setAttribute('stroke', '#e94560');
      r.setAttribute('stroke-width', '10');
      r.setAttribute('stroke-dasharray', '20,8');
    } else {   // reserved
      r.setAttribute('fill', 'rgba(90,90,90,0.3)');
      r.setAttribute('stroke', '#e94560');
      r.setAttribute('stroke-width', '10');
      r.setAttribute('stroke-dasharray', '20,8');
    }
    epPreview.appendChild(r);
  }

  /* ── Commit a new element ── */
  function placeElement(x, y, w, h, type) {
    editElems.push({ id: Date.now().toString(), type, x, y, w, h });
    renderEditElements();
    epPreview.innerHTML = '';
    // auto-switch back to select tool
    activeTool = 'select';
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    const selBtn = document.querySelector('.tool-btn[data-tool="select"]');
    if (selBtn) selBtn.classList.add('active');
    editSvgEl.style.cursor = 'default';
    updateDimSection();
  }

  /* ── SVG: mousedown — select / start drag ── */
  editSvgEl.addEventListener('mousedown', e => {
    if (e.button !== 0 || e.ctrlKey || !isEditMode) return;
    mouseDownPos = { x: e.clientX, y: e.clientY };
    pointerMoved = false;

    if (activeTool === 'select') {
      const g = e.target.closest('[data-id]');
      if (g) {
        selectedId = g.dataset.id;
        renderEditElements();
        updateSelectedSection();
        // prepare drag
        const sp = svgCoord(e);
        const el = editElems.find(ee => ee.id === selectedId);
        if (el) {
          isDragging = true; dragId = selectedId;
          dragOffX = sp.x - el.x; dragOffY = sp.y - el.y;
        }
      } else {
        // click on empty → deselect
        selectedId = null;
        renderEditElements();
        updateSelectedSection();
      }
    }
  });

  /* ── SVG: click — place element ── */
  editSvgEl.addEventListener('click', e => {
    if (pointerMoved || activeTool === 'select' || !isEditMode) return;
    const sp = svgCoord(e);
    const { w, h } = getDims();
    const s = snapElement(sp.x, sp.y, w, h);
    placeElement(s.x, s.y, w, h, activeTool);
  });

  /* ── SVG: mouse leaves — clear preview ── */
  editSvgEl.addEventListener('mouseleave', () => {
    if (!isDragging) epPreview.innerHTML = '';
  });

  /* ── window mousemove — preview & drag ── */
  window.addEventListener('mousemove', e => {
    if (!isEditMode) return;

    // track movement
    if (mouseDownPos &&
        (Math.abs(e.clientX - mouseDownPos.x) > 4 ||
         Math.abs(e.clientY - mouseDownPos.y) > 4)) {
      pointerMoved = true;
    }

    // drag selected element
    if (isDragging && pointerMoved && dragId) {
      const sp = svgCoord(e);
      const el = editElems.find(ee => ee.id === dragId);
      if (el) {
        const s = snapElement(sp.x - dragOffX, sp.y - dragOffY, el.w, el.h, dragId);
        el.x = s.x; el.y = s.y;
        renderEditElements();
        updateSelectedSection();
      }
      return;
    }

    // placement preview
    if (!isDragging && !ePanning && activeTool !== 'select') {
      const svgRect = editSvgEl.getBoundingClientRect();
      if (e.clientX >= svgRect.left && e.clientX <= svgRect.right &&
          e.clientY >= svgRect.top  && e.clientY <= svgRect.bottom) {
        const sp = svgCoord(e);
        const { w, h } = getDims();
        const s = snapElement(sp.x, sp.y, w, h);
        drawPreview(s.x, s.y, w, h, activeTool);
      } else {
        epPreview.innerHTML = '';
      }
    }
  });

  /* ── window mouseup — end drag ── */
  window.addEventListener('mouseup', () => {
    if (isDragging) { isDragging = false; dragId = null; }
    mouseDownPos = null;
  });

  /* ── SVG cursor by tool ── */
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editSvgEl.style.cursor = btn.dataset.tool === 'select' ? 'default' : 'crosshair';
    });
  });
  editSvgEl.style.cursor = 'default';

  /* ── Delete key removes selected element ── */
  document.addEventListener('keydown', e => {
    if (!isEditMode || !selectedId) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') &&
        !e.target.matches('input, textarea, select')) {
      editElems = editElems.filter(el => el.id !== selectedId);
      selectedId = null;
      renderEditElements();
      updateSelectedSection();
    }
  });

  /* ════════════════════════════════════════
     PHASE 3: Save as new · View SVG
     ════════════════════════════════════════ */

  /* ── Generate clean SVG XML (tight bounding box) ── */
  function generateSvgXml() {
    if (!editElems.length) { showToast('畫布上沒有元素'); return null; }

    const hasReserved = editElems.some(e => e.type === 'reserved');
    const defs = hasReserved
      ? `\n  <defs>\n    <pattern id="hatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45 0 0)">\n      <line x1="0" y1="0" x2="0" y2="12" stroke="#888" stroke-width="4"/>\n    </pattern>\n  </defs>` : '';

    // tight bounding box with 20 cm padding
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const el of editElems) {
      minX = Math.min(minX, el.x);     minY = Math.min(minY, el.y);
      maxX = Math.max(maxX, el.x + el.w); maxY = Math.max(maxY, el.y + el.h);
    }
    const pad = 20;
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    const vw = maxX - minX, vh = maxY - minY;

    const shapes = editElems.map(el => {
      if (el.type === 'room')
        return `  <rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="white" stroke="#222" stroke-width="10"/>`;
      if (el.type === 'vwall' || el.type === 'hwall')
        return `  <rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="#222"/>`;
      // reserved
      return `  <rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="url(#hatch)" stroke="#222" stroke-width="10"/>`;
    }).join('\n');

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${vw} ${vh}" width="${vw}" height="${vh}">${defs}\n${shapes}\n</svg>`;
  }

  /* ── 另存新圖 ── */
  document.getElementById('btn-save-new').addEventListener('click', () => {
    const xml = generateSvgXml();
    if (!xml) return;
    const input = prompt('儲存名稱（留空自動命名）:', '');
    if (input === null) return; // cancelled
    const id   = Date.now().toString();
    const name = input.trim() || `平面圖 #${records.length + 1}`;
    records.push({ id, name, svg: xml, createdAt: Date.now() });
    saveRecords(records);
    activeId = id;
    renderTabs();
    renderSvg();
    showToast(`已儲存為「${name}」`);
  });

  /* ── 檢視 SVG ── */
  const vsvgOverlay = document.getElementById('vsvg-overlay');
  const vsvgCode    = document.getElementById('vsvg-code');

  document.getElementById('btn-view-svg').addEventListener('click', () => {
    const xml = generateSvgXml();
    if (!xml) return;
    vsvgCode.value = xml;
    vsvgOverlay.style.display = 'flex';
  });

  document.getElementById('btn-close-vsvg').addEventListener('click', () => {
    vsvgOverlay.style.display = 'none';
  });
  vsvgOverlay.addEventListener('click', e => {
    if (e.target === vsvgOverlay) vsvgOverlay.style.display = 'none';
  });

  /* ── 複製 SVG ── */
  document.getElementById('btn-copy-svg').addEventListener('click', () => {
    navigator.clipboard.writeText(vsvgCode.value)
      .then(() => showToast('已複製到剪貼簿'))
      .catch(() => {
        vsvgCode.select();
        document.execCommand('copy');
        showToast('已複製到剪貼簿');
      });
  });

  /* Escape closes view-svg modal */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && vsvgOverlay.style.display !== 'none')
      vsvgOverlay.style.display = 'none';
  });

  /* ── Viewer background toggle ── */
  document.querySelectorAll('.bg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      canvasEl.classList.remove('bg-dark', 'bg-light');
      if (btn.dataset.bg) canvasEl.classList.add(btn.dataset.bg);
    });
  });

  /* ── Init ── */
  renderTabs();
  renderSvg();
</script>
</body>
</html>
