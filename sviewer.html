<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SVG Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Prevent double-tap zoom & pinch-zoom on entire UI */
    html { touch-action: manipulation; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    #topbar h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #e94560;
      margin-right: 8px;
      white-space: nowrap;
    }

    .btn {
      padding: 5px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: filter 0.15s;
    }
    .btn:hover { filter: brightness(1.2); }

    .btn-primary { background: #e94560; color: #fff; }
    .btn-secondary { background: #0f3460; color: #c8d6e5; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; }

    #file-input { display: none; }

    /* ── Record tabs ── */
    #tabs-wrap {
      position: fixed;
      top: 41px; /* height of topbar */
      left: 0;
      right: 0;
      z-index: 50;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: thin;
      scrollbar-color: #0f3460 transparent;
    }

    #tabs {
      display: flex;
      gap: 2px;
      padding: 4px 8px;
      min-width: max-content;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: #0f3460;
      border-radius: 5px 5px 0 0;
      cursor: pointer;
      font-size: 0.8rem;
      color: #94a3b8;
      border: 1px solid transparent;
      border-bottom: none;
      max-width: 180px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .tab:hover { background: #1e4080; color: #e0e0e0; }
    .tab.active {
      background: #1a1a2e;
      color: #e94560;
      border-color: #0f3460;
    }

    .tab-name {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 130px;
    }

    .tab-close {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .tab-close:hover { background: #e94560; color: #fff; }

    /* ── Main area ── */
    #main {
      position: fixed;
      top: 82px; /* topbar ~41px + tabs-wrap ~41px */
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      overflow: hidden;
    }

    /* ── SVG canvas ── */
    #canvas {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      position: relative;
      background:
        linear-gradient(45deg, #1e293b 25%, transparent 25%),
        linear-gradient(-45deg, #1e293b 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1e293b 75%),
        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #0f172a;
    }

    #svg-container {
      position: relative;
      transform-origin: center center;
      cursor: grab;
      user-select: none;
    }
    #svg-container.grabbing { cursor: grabbing; }
    #svg-container svg {
      display: block;
      max-width: none;
    }

    #empty-hint {
      text-align: center;
      color: #475569;
      pointer-events: none;
    }
    #empty-hint .icon { font-size: 4rem; margin-bottom: 12px; }
    #empty-hint p { font-size: 0.9rem; line-height: 1.8; }

    /* ── Zoom controls ── */
    #zoom-controls {
      position: absolute;
      bottom: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .zoom-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #16213e;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .zoom-btn:hover { background: #0f3460; }

    #zoom-label {
      font-size: 0.7rem;
      color: #64748b;
      text-align: center;
    }

    /* ── Modal overlay ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }

    #modal {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 24px;
      width: min(600px, 95vw);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #modal h2 { font-size: 1rem; color: #e94560; }

    #modal-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #0f3460;
      padding-bottom: 8px;
    }
    .modal-tab-btn {
      padding: 4px 14px;
      border-radius: 4px;
      border: none;
      background: #0f3460;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .modal-tab-btn.active { background: #e94560; color: #fff; }

    .modal-panel { display: none; flex-direction: column; gap: 10px; }
    .modal-panel.active { display: flex; }

    #name-input {
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #0f3460;
      background: #0f172a;
      color: #e0e0e0;
      font-size: 0.85rem;
    }

    #svg-textarea {
      flex: 1;
      min-height: 200px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #0f3460;
      background: #0f172a;
      color: #a0c4ff;
      font-family: monospace;
      font-size: 0.78rem;
      resize: vertical;
    }

    #drop-zone {
      border: 2px dashed #0f3460;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      color: #475569;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      font-size: 0.85rem;
    }
    #drop-zone:hover, #drop-zone.dragover {
      border-color: #e94560;
      color: #e0e0e0;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ── Confirm dialog ── */
    #confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #confirm-overlay.open { display: flex; }
    #confirm-box {
      background: #16213e;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 24px;
      width: min(360px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #confirm-box p { font-size: 0.9rem; color: #e0e0e0; line-height: 1.5; }
    #confirm-box .modal-footer { margin-top: 4px; }

    #exit-edit-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #exit-edit-overlay.open { display: flex; }
    #exit-edit-box {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 24px;
      width: min(400px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #exit-edit-box p { font-size: 0.9rem; color: #e0e0e0; line-height: 1.6; text-align: center; }
    #exit-edit-name { color: #e94560; font-weight: 600; }

    /* ── Error toast ── */
    #toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #7f1d1d;
      color: #fca5a5;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 0.82rem;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 300;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ════════════════════════════════
       EDIT MODE
       ════════════════════════════════ */

    #btn-edit-mode.active { background: #f59e0b; color: #1a1a2e; }

    /* viewer background toggle */
    .bg-btn {
      padding: 3px 9px;
      border-radius: 4px;
      border: 1px solid #1e3a5f;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.12s;
    }
    .bg-btn:hover { color: #e0e0e0; border-color: #3b82f6; }
    .bg-btn.active { background: #0f3460; color: #e0e0e0; border-color: #3b82f6; }
    #canvas.bg-dark   { background: #0f172a !important; }
    #canvas.bg-medium {
      background-color: #7b96aa !important;
      background-image: repeating-linear-gradient(
        45deg,
        rgba(0,0,0,0.07) 0,
        rgba(0,0,0,0.07) 1px,
        transparent 0,
        transparent 14px
      ) !important;
    }
    #canvas.bg-light  { background: #e8ecf0 !important; }

    /* sidebar */
    /* Canvas handles its own touch — disable browser pan/zoom there */
    #edit-canvas-wrap { touch-action: none; }

    #edit-sidebar {
      display: none;
      width: 170px;
      min-width: 170px;
      flex-direction: column;
      background: #16213e;
      border-right: 1px solid #0f3460;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #0f3460 transparent;
    }
    body.edit-mode #canvas          { display: none; }
    body.edit-mode #edit-sidebar    { display: flex; }
    body.edit-mode #edit-canvas-wrap{ display: flex; }

    /* edit canvas wrap */
    #edit-canvas-wrap {
      display: none;
      flex: 1;
      overflow: hidden;
      position: relative;
      background: #b8c4cc;
      align-items: center;
      justify-content: center;
    }
    #edit-svg-container {
      transform-origin: center center;
      user-select: none;
      line-height: 0;
    }

    /* sidebar sections */
    .esec {
      padding: 10px 12px;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }
    .esec h3 {
      font-size: 0.68rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
    }

    /* tool buttons */
    .tool-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 6px 9px;
      margin-bottom: 3px;
      border: 1px solid #1e3a5f;
      border-radius: 5px;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: left;
      transition: background 0.12s, color 0.12s;
    }
    .tool-btn:last-child { margin-bottom: 0; }
    .tool-btn:hover  { background: #1e3a5f; color: #e0e0e0; }
    .tool-btn.active { background: #e94560; color: #fff; border-color: #e94560; }
    .tool-icon {
      display: inline-block;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
      font-size: 0.95rem;
      font-style: normal;
    }

    /* dimension inputs */
    .dim-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
    }
    .dim-row:last-child { margin-bottom: 0; }
    .dim-row label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      width: 14px;
      flex-shrink: 0;
    }
    .dim-input {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #0f3460;
      background: #0f172a;
      color: #e0e0e0;
      font-size: 0.8rem;
    }
    .dim-unit { font-size: 0.7rem; color: #475569; }
    .snap-opts { display: flex; gap: 4px; }
    .snap-opt {
      flex: 1;
      padding: 4px 0;
      border: 1px solid #1e3a5f;
      border-radius: 4px;
      background: transparent;
      color: #94a3b8;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .snap-opt.active { background: #0f3460; color: #fff; border-color: #3b82f6; }

    /* selected info */
    #selected-info { font-size: 0.77rem; color: #94a3b8; line-height: 1.9; }

    /* edit zoom */
    #edit-zoom-controls {
      position: absolute;
      bottom: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #edit-zoom-label { font-size: 0.7rem; color: #64748b; text-align: center; }

    /* ── Ruler ── */
    #ruler-corner, #ruler-h, #ruler-v {
      display: none;
      position: absolute;
      background: #16213e;
      pointer-events: none;
      user-select: none;
      z-index: 3;
    }
    body.edit-mode #ruler-corner {
      display: block; top:0; left:0; width:28px; height:28px;
      border-right:1px solid #0f3460; border-bottom:1px solid #0f3460; z-index:4;
    }
    body.edit-mode #ruler-h {
      display: block; top:0; left:28px; right:0; height:28px;
      border-bottom:1px solid #0f3460; overflow:hidden;
    }
    body.edit-mode #ruler-v {
      display: block; top:28px; left:0; bottom:0; width:28px;
      border-right:1px solid #0f3460; overflow:hidden;
    }

    /* ── Door option toggles ── */
    .door-presets {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px;
    }
    .door-opt {
      flex: 1; padding: 3px 4px;
      border: 1px solid #1e3a5f; border-radius: 4px;
      background: transparent; color: #94a3b8;
      cursor: pointer; font-size: 0.72rem; text-align: center;
      transition: background 0.12s, color 0.12s;
      line-height: 0;
    }
    .door-opt:hover  { background: #1e3a5f; color: #e0e0e0; }
    .door-opt.active { background: #e94560; color: #fff; border-color: #e94560; }
    .door-opt svg {
      width: 100%;
      max-width: 32px;
      height: 26px;
      display: block;
      margin: 0 auto;
    }
    .door-opt .ico-wall,
    .door-opt .ico-jamb {
      stroke: currentColor;
      fill: none;
      stroke-linecap: square;
    }
    .door-opt .ico-wall { stroke-width: 4.4; opacity: 0.95; }
    .door-opt .ico-jamb { stroke-width: 2.1; opacity: 0.95; }
    .door-opt .ico-panel,
    .door-opt .ico-arc,
    .door-opt .ico-guide {
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .door-opt .ico-panel { stroke-width: 2.2; }
    .door-opt .ico-arc   { stroke-width: 1.7; opacity: 0.9; }
    .door-opt .ico-guide { stroke-width: 1.4; opacity: 0.6; stroke-dasharray: 3 2; }
    .door-opt .ico-hinge { fill: currentColor; stroke: none; }
    .sr-only {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Mobile layout ── */
    @media (max-width: 600px) {
      /* Topbar: tighten to stay single row */
      #topbar { padding: 6px 8px; gap: 5px; }
      #topbar h1 { font-size: 0.88rem; margin-right: 4px; }
      .btn { padding: 4px 8px; font-size: 0.76rem; }
      .bg-btn { padding: 2px 6px; font-size: 0.72rem; }
      #bg-label { display: none; } /* "背景" text hidden to save space */

      /* Edit mode: hide tabs, canvas fills from just below topbar */
      body.edit-mode #tabs-wrap { display: none; }
      body.edit-mode #main      { top: 41px; flex-direction: column; }

      /* Sidebar at TOP on mobile — keyboard appears at bottom, sidebar stays visible */
      body.edit-mode #edit-canvas-wrap {
        order: 2;
        flex: 1;
        min-height: 0;
      }

      /* Sidebar strip at top (avoids virtual keyboard coverage) */
      body.edit-mode #edit-sidebar {
        order: 1;
        width: 100%;
        min-width: unset;
        height: 130px;
        min-height: 130px;
        flex-shrink: 0;
        flex-direction: row;
        border-right: none;
        border-top: 1px solid #0f3460;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
      body.edit-mode #edit-sidebar::-webkit-scrollbar { display: none; }

      /* Each sidebar section becomes a vertical column in the strip */
      body.edit-mode .esec {
        flex-shrink: 0;
        border-bottom: none;
        border-right: 1px solid #0f3460;
        padding: 8px 10px;
        min-width: 110px;
      }

      /* Output section: cancel margin-top:auto (no effect in row layout) */
      body.edit-mode #output-section { margin-top: 0; margin-left: auto; }

      /* Tool buttons: slightly compact */
      body.edit-mode .tool-btn {
        padding: 5px 7px;
        font-size: 0.78rem;
        margin-bottom: 2px;
      }

      /* 工具 section: 2-column grid so all 5 buttons fit in 130px sidebar height */
      body.edit-mode #tool-section {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 3px;
        min-width: 132px;
      }
      body.edit-mode #tool-section > h3 {
        flex-basis: 100%;
        margin-bottom: 0;
      }
      body.edit-mode #tool-section > .tool-btn {
        flex: 0 0 calc(50% - 2px);
        min-width: 0;
        margin-bottom: 0;
        padding: 4px 3px;
        font-size: 0.72rem;
        gap: 3px;
      }

      /* Dim inputs */
      body.edit-mode .dim-input { padding: 3px 5px; font-size: 0.78rem; }

      /* iOS safe area: keep zoom controls above home indicator / browser chrome */
      #edit-zoom-controls {
        bottom: max(14px, calc(env(safe-area-inset-bottom) + 8px));
        right: max(14px, calc(env(safe-area-inset-right) + 8px));
      }

      /* Hide rulers on mobile (no space) */
      #ruler-corner, #ruler-h, #ruler-v { display: none !important; }
    }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <h1>SVG Viewer</h1>
  <button class="btn btn-primary" id="btn-add">+ 新增</button>
  <span id="bg-label" style="color:#334155;font-size:0.72rem;margin-left:6px;white-space:nowrap">背景</span>
  <button class="bg-btn" data-bg="">無</button>
  <button class="bg-btn" data-bg="bg-medium">中</button>
  <button class="bg-btn" data-bg="bg-dark">深色</button>
  <button class="bg-btn" data-bg="bg-light">淺色</button>
  <button class="btn btn-secondary" id="btn-edit-mode">✎ 進行編輯</button>
  <input type="file" id="file-input" accept=".svg,image/svg+xml">
  <button class="btn btn-danger" id="btn-delete-active"
          title="刪除目前 SVG" style="display:none;margin-left:auto">🗑 刪除</button>
</div>

<!-- Tabs -->
<div id="tabs-wrap">
  <div id="tabs"></div>
</div>

<!-- Main -->
<div id="main">
  <div id="canvas">
    <div id="empty-hint">
      <div class="icon">🖼️</div>
      <p>尚無 SVG 紀錄<br>點擊「新增」貼入 XML 或開啟 SVG 檔案</p>
    </div>
    <div id="svg-container"></div>
    <div id="zoom-controls">
      <button class="zoom-btn" id="btn-zoom-in" title="放大">+</button>
      <div id="zoom-label">100%</div>
      <button class="zoom-btn" id="btn-zoom-out" title="縮小">−</button>
      <button class="zoom-btn" id="btn-zoom-fit" title="適合視窗" style="font-size:0.65rem">FIT</button>
      <button class="zoom-btn" id="btn-zoom-reset" title="重置" style="font-size:0.65rem">1:1</button>
    </div>
  </div>

  <!-- ── Edit Sidebar ── -->
  <div id="edit-sidebar">

    <div class="esec" id="edit-action-section">
      <div style="display:flex;gap:5px;">
        <button class="btn btn-primary" id="btn-edit-save"
                style="flex:1;font-size:0.8rem;padding:5px">儲存</button>
        <button class="btn btn-secondary" id="btn-edit-leave"
                style="flex:1;font-size:0.8rem;padding:5px">離開</button>
      </div>
    </div>

    <div class="esec" id="tool-section">
      <h3>工具</h3>
      <button class="tool-btn active" data-tool="select"><i class="tool-icon">▶</i>選取</button>
      <button class="tool-btn" data-tool="room"><i class="tool-icon">□</i>房</button>
      <button class="tool-btn" data-tool="vwall"><i class="tool-icon">│</i>垂直牆</button>
      <button class="tool-btn" data-tool="hwall"><i class="tool-icon">─</i>橫向牆</button>

<script>
  /* ── Storage helpers ── */
  const STORAGE_KEY      = 'svg_viewer_records';
  const BG_KEY           = 'svg_viewer_bg';
  const MODE_KEY         = 'svg_viewer_mode';
  const EDIT_ELEMS_KEY     = 'svg_viewer_edit_elems';     // kept for one-time migration
  const EDIT_ELEMS_MAP_KEY = 'svg_viewer_edit_elems_map'; // per-SVG map
  const SNAP_UNIT_KEY      = 'svg_viewer_snap_unit';
  const ACTIVE_ID_KEY      = 'svg_viewer_active_id';
  const EDITING_SET_KEY    = 'svg_viewer_editing_set';

  function loadRecords() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function saveRecords(r) { localStorage.setItem(STORAGE_KEY, JSON.stringify(r)); }

  function saveBg(bg)    { localStorage.setItem(BG_KEY, bg); }
  function loadBg()      { return localStorage.getItem(BG_KEY) ?? 'bg-medium'; }

  function saveMode(on)  { localStorage.setItem(MODE_KEY, on ? '1' : '0'); }
  function loadMode()    { return localStorage.getItem(MODE_KEY) === '1'; }

  function _loadElemsMap() {
    try { return JSON.parse(localStorage.getItem(EDIT_ELEMS_MAP_KEY)) || {}; }
    catch { return {}; }
  }
  function saveEditElemsForId(id, arr) {
    if (!id) return;
    const map = _loadElemsMap();
    if (arr.length) map[id] = arr; else delete map[id];
    localStorage.setItem(EDIT_ELEMS_MAP_KEY, JSON.stringify(map));
  }
  function loadEditElemsForId(id) {
    if (!id) return [];
    return _loadElemsMap()[id] || [];
  }
  function removeEditElemsForId(id) { saveEditElemsForId(id, []); }
  function saveEditElems(arr) { saveEditElemsForId(activeId, arr); }
  function saveSnapUnit(v) { localStorage.setItem(SNAP_UNIT_KEY, String(v)); }
  function loadSnapUnit() {
    const v = parseInt(localStorage.getItem(SNAP_UNIT_KEY) || '10', 10);
    return v === 1 ? 1 : 10;
  }
  function saveActiveId(id) { localStorage.setItem(ACTIVE_ID_KEY, id || ''); }
  function loadActiveId()   { return localStorage.getItem(ACTIVE_ID_KEY) || null; }
  function saveEditingSet() { localStorage.setItem(EDITING_SET_KEY, JSON.stringify([...editingSet])); }
  function loadEditingSetIds() {
    try { return JSON.parse(localStorage.getItem(EDITING_SET_KEY)) || []; }
    catch { return []; }
  }

  /* ── State ── */
  let records = loadRecords();       // [{id, name, svg, createdAt}]
  const _savedActiveId = loadActiveId();
  let activeId = (_savedActiveId && records.find(r => r.id === _savedActiveId))
    ? _savedActiveId
    : (records.length ? records[records.length - 1].id : null);
  let scale = 1;
  let panX = 0, panY = 0;
  let isPanning = false, startX = 0, startY = 0;
  let pendingFileContent = null;     // svg string from file drop/select
  let activeModalPanel = 'paste';
  let confirmCallback = null;

  /* ── DOM refs ── */
  const tabsEl        = document.getElementById('tabs');
  const canvasEl      = document.getElementById('canvas');
  const svgContainer  = document.getElementById('svg-container');
  const emptyHint     = document.getElementById('empty-hint');
  const zoomLabel     = document.getElementById('zoom-label');
  const modalOverlay  = document.getElementById('modal-overlay');
  const confirmOverlay= document.getElementById('confirm-overlay');
  const nameInput     = document.getElementById('name-input');
  const svgTextarea   = document.getElementById('svg-textarea');
  const dropZone      = document.getElementById('drop-zone');
  const confirmMsg    = document.getElementById('confirm-msg');
  const fileInput     = document.getElementById('file-input');

  /* ── Render tabs ── */
  function renderTabs() {
    tabsEl.innerHTML = '';
    records.forEach(rec => {
      const tab = document.createElement('div');
      tab.className = 'tab' + (rec.id === activeId ? ' active' : '');
      tab.dataset.id = rec.id;

      const nameSpan = document.createElement('span');
      nameSpan.className = 'tab-name';
      const isEditing = editingSet.has(rec.id);
      nameSpan.textContent = rec.name + (isEditing ? ' (編修中)' : '');
      nameSpan.title = rec.name;

      tab.appendChild(nameSpan);
      tab.title = rec.name + (isEditing ? '（編修中）' : '（雙擊進入編修模式）');
      tab.addEventListener('click', () => switchTo(rec.id));
      tab.addEventListener('dblclick', () => {
        switchTo(rec.id);
        enterEditMode();
      });
      tabsEl.appendChild(tab);
    });

    // scroll active tab into view
    const activeTab = tabsEl.querySelector('.tab.active');
    if (activeTab) activeTab.scrollIntoView({ inline: 'nearest', block: 'nearest' });

    // show/hide the topbar delete button
    const btnDelActive = document.getElementById('btn-delete-active');
    if (btnDelActive) {
      btnDelActive.style.display =
        (activeId && records.some(r => r.id === activeId)) ? '' : 'none';
    }
  }

  /* ── Render SVG ── */
  function renderSvg() {
    const rec = records.find(r => r.id === activeId);
    if (!rec) {
      svgContainer.innerHTML = '';
      emptyHint.style.display = 'block';
      return;
    }
    emptyHint.style.display = 'none';
    svgContainer.innerHTML = rec.svg;
    // ensure svg fills container naturally
    const svgEl = svgContainer.querySelector('svg');
    if (svgEl) {
      svgEl.removeAttribute('style');
    }
    resetTransform();
    requestAnimationFrame(fitTransform);
  }

  function switchTo(id) {
    // Snapshot current SVG's edit state before leaving
    if (editingSet.has(activeId)) {
      editStateMap.set(activeId, { elems: [...editElems], bgMarkup: currentBgMarkup });
    }

    activeId = id;
    selectedId = null; lastDeleted = null;
    isDragging = false; dragId = null;

    updateEditModeUI(); // isEditMode now reflects new activeId

    if (editingSet.has(id)) {
      // Restore this SVG's edit state
      const state = editStateMap.get(id) || {};
      editElems       = [...(state.elems  || [])];
      currentBgMarkup = state.bgMarkup || null;
      renderBgLayer();
      renderEditElements();
      updateSelectedSection();
      undoSection.style.display = 'none';
    } else {
      editElems       = [];
      currentBgMarkup = null;
      epBg.innerHTML  = '';
    }

    saveActiveId(id);
    renderTabs();
    renderSvg();
  }

  /* ── Transform (zoom/pan) ── */
  function applyTransform() {
    svgContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    zoomLabel.textContent = Math.round(scale * 100) + '%';
  }

  function resetTransform() {
    scale = 1; panX = 0; panY = 0;
    applyTransform();
  }

  function fitTransform() {
    const svgEl = svgContainer.querySelector('svg');
    if (!svgEl) return;
    const cw = canvasEl.clientWidth - 40;
    const ch = canvasEl.clientHeight - 40;
    const sw = svgEl.getBoundingClientRect().width / scale;
    const sh = svgEl.getBoundingClientRect().height / scale;
    if (sw === 0 || sh === 0) return;
    const s = Math.min(cw / sw, ch / sh, 3);
    scale = s; panX = 0; panY = 0;
    applyTransform();
  }

  document.getElementById('btn-zoom-in').addEventListener('click', () => {
    scale = Math.min(scale * 1.25, 20); applyTransform();
  });
  document.getElementById('btn-zoom-out').addEventListener('click', () => {
    scale = Math.max(scale / 1.25, 0.05); applyTransform();
  });
  document.getElementById('btn-zoom-fit').addEventListener('click', fitTransform);
  document.getElementById('btn-zoom-reset').addEventListener('click', resetTransform);

  // Wheel zoom
  canvasEl.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    const rect = canvasEl.getBoundingClientRect();
    const ox = e.clientX - rect.left - canvasEl.clientWidth / 2;
    const oy = e.clientY - rect.top - canvasEl.clientHeight / 2;
    panX = ox + (panX - ox) * factor;
    panY = oy + (panY - oy) * factor;
    scale = Math.min(Math.max(scale * factor, 0.05), 20);
    applyTransform();
  }, { passive: false });

  // Pan
  svgContainer.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    isPanning = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    svgContainer.classList.add('grabbing');
  });
  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    applyTransform();
  });
  window.addEventListener('mouseup', () => {
    isPanning = false;
    svgContainer.classList.remove('grabbing');
  });

  /* ── Add modal ── */
  document.getElementById('btn-add').addEventListener('click', openModal);

  function openModal() {
    nameInput.value = autoName();
    svgTextarea.value = '';
    pendingFileContent = null;
    switchModalPanel('paste');
    modalOverlay.classList.add('open');
    svgTextarea.focus();
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
    pendingFileContent = null;
  }

  document.getElementById('btn-delete-active').addEventListener('click', () => {
    const rec = records.find(r => r.id === activeId);
    if (rec) askDelete(rec.id, rec.name);
  });

  document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

  // Modal panel switching
  document.querySelectorAll('.modal-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchModalPanel(btn.dataset.panel));
  });

  function switchModalPanel(panel) {
    activeModalPanel = panel;
    document.querySelectorAll('.modal-tab-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.panel === panel));
    document.querySelectorAll('.modal-panel').forEach(p =>
      p.classList.toggle('active', p.id === 'panel-' + panel));

  // Save
  document.getElementById('btn-modal-save').addEventListener('click', saveNew);

  function saveNew() {
    let svgStr = '';
    if (activeModalPanel === 'paste') {
      svgStr = svgTextarea.value.trim();
    } else {
      svgStr = pendingFileContent ? pendingFileContent.trim() : '';
    }

    if (!svgStr) { showToast('請貼入 SVG XML 或選擇檔案'); return; }
    if (!svgStr.includes('<svg') && !svgStr.includes('<SVG')) {
      showToast('內容似乎不是有效的 SVG'); return;
    }

    const id = Date.now().toString();
    const name = nameInput.value.trim() || autoName();
    records.push({ id, name, svg: svgStr, createdAt: Date.now() });
    saveRecords(records);
    activeId = id;
    renderTabs();
    renderSvg();
    closeModal();
    enterEditMode();
  }

  function autoName() {
    const now = new Date();
    const Y = now.getFullYear();
    const M = String(now.getMonth() + 1).padStart(2, '0');
    const D = String(now.getDate()).padStart(2, '0');
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    return `${Y}${M}${D}_${h}${m}`;
  }

  /* ── File open (drop zone) ── */
  dropZone.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (file) readFile(file);
    fileInput.value = '';
  });

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');

    if (file) readFile(file);
  });

  function readFile(file) {
    if (!file.name.toLowerCase().endsWith('.svg') && file.type !== 'image/svg+xml') {
      showToast('請選擇 .svg 格式的檔案'); return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      pendingFileContent = ev.target.result;
      if (!nameInput.value.trim()) {
        nameInput.value = file.name.replace(/\.svg$/i, '');
      }
      dropZone.innerHTML = `<div style="color:#4ade80">✔ 已載入：${file.name}</div>`;
    };
    reader.readAsText(file);
  }

  /* ── Toast ── */
  let toastTimer;

  /* ── Keyboard shortcuts ── */
