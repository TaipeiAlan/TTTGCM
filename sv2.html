<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floor Plan Editor</title>

<style>
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
}

#canvas {
  flex: 1;
  background: #fff;
  position: relative;
}

.element {
  position: absolute;
  box-sizing: border-box;
}

.room { border: 10px solid black; }
.wall { background: black; }
.reserve { border: 10px dashed gray; }

.selected { outline: 3px solid red; }

footer {
  padding: 6px;
  background: #f5f5f5;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

button {
  padding: 10px;
}

button:disabled {
  opacity: 0.3;
}

.active {
  background: black;
  color: white;
}

input {
  width: 80px;
}
</style>
</head>

<body>

<div id="canvas"></div>

<footer>
  寬 <input id="w">
  高 <input id="h">

  <button id="btnRoom" disabled onclick="setMode('room', this)">房</button>
  <button id="btnReserve" disabled onclick="setMode('reserve', this)">保留</button>
  <button id="btnWallH" disabled onclick="setMode('wallH', this)">橫牆</button>
  <button id="btnWallV" disabled onclick="setMode('wallV', this)">直牆</button>

  <button onclick="deleteSelected()">刪除</button>
  <button onclick="clearAll()">清空</button>
</footer>

<script>
const canvas = document.getElementById('canvas');

let mode = null;
let elements = [];
let selected = null;

const SNAP_DIST = 10;

/* ===== 輸入控制 ===== */
wInput.oninput = hInput.oninput = updateButtons;

function updateButtons() {
  const w = wInput.value;
  const h = hInput.value;

  btnRoom.disabled = !(w && h);
  btnReserve.disabled = !(w && h);

  btnWallH.disabled = !(w && !h);
  btnWallV.disabled = !(h && !w);
}

/* ===== 模式 ===== */
function setMode(m, btn) {
  if (btn.disabled) return;

  mode = m;
  document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

/* ===== 新增 ===== */
canvas.addEventListener('click', e => {
  if (!mode) return;

  const rect = canvas.getBoundingClientRect();
  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  let w = parseInt(wInput.value || 0);
  let h = parseInt(hInput.value || 0);

  let el = document.createElement('div');

  if (mode === 'room' || mode === 'reserve') {
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.classList.add('element', mode);
  }

  if (mode === 'wallH') {
    el.style.width = w + 'px';
    el.style.height = '10px';
    el.classList.add('element', 'wall');
  }

  if (mode === 'wallV') {
    el.style.width = '10px';
    el.style.height = h + 'px';
    el.classList.add('element', 'wall');
  }

  el.style.left = x + 'px';
  el.style.top = y + 'px';

  canvas.appendChild(el);
  elements.push(el);

  snapToOthers(el);

  makeDraggable(el);
  select(el);

  /* 清空輸入 */
  wInput.value = '';
  hInput.value = '';
  updateButtons();

  mode = null;
});

/* ===== 吸附 ===== */
function snapToOthers(el) {
  let x = parseInt(el.style.left);
  let y = parseInt(el.style.top);
  let w = parseInt(el.style.width);
  let h = parseInt(el.style.height);

  elements.forEach(o => {
    if (o === el) return;

    let ox = parseInt(o.style.left);
    let oy = parseInt(o.style.top);
    let ow = parseInt(o.style.width);
    let oh = parseInt(o.style.height);

    /* 左貼右 */
    if (Math.abs(x - (ox + ow)) < SNAP_DIST) x = ox + ow;

    /* 右貼左 */
    if (Math.abs(x + w - ox) < SNAP_DIST) x = ox - w;

    /* 上貼下 */
    if (Math.abs(y - (oy + oh)) < SNAP_DIST) y = oy + oh;

    /* 下貼上 */
    if (Math.abs(y + h - oy) < SNAP_DIST) y = oy - h;
  });

  el.style.left = x + 'px';
  el.style.top = y + 'px';
}

/* ===== 拖曳 ===== */
function makeDraggable(el) {
  let offsetX, offsetY;

  el.addEventListener('mousedown', e => {
    select(el);

    offsetX = e.offsetX;
    offsetY = e.offsetY;

    function move(ev) {
      let x = ev.clientX - canvas.getBoundingClientRect().left - offsetX;
      let y = ev.clientY - canvas.getBoundingClientRect().top - offsetY;

      el.style.left = x + 'px';
      el.style.top = y + 'px';

      snapToOthers(el);
    }

    function up() {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    }

    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

/* ===== 選取 ===== */
function select(el) {
  selected = el;
  document.querySelectorAll('.element').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}

/* ===== 刪除 ===== */
function deleteSelected() {
  if (!selected) return;
  selected.remove();
  elements = elements.filter(e => e !== selected);
  selected = null;
}

/* ===== 清空 ===== */
function clearAll() {
  if (!confirm('確定清空？')) return;
  location.reload();
}
</script>

</body>
</html>
