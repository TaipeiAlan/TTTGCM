<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floor Plan Editor</title>

<style>
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
}

#canvas {
  flex: 1;
  width: 100%;
  background: #fff;
  position: relative;
  touch-action: none;
}

.element {
  position: absolute;
  box-sizing: border-box;
}

.room {
  border: 10px solid #000;
  background: rgba(0,0,0,0.05);
}

.wall {
  background: #000;
  height: 10px;
}

.reserve {
  border: 10px dashed #666;
  position: relative;
}

/* 保留區叉叉 */
.reserve::before,
.reserve::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  border-top: 2px solid #666;
  transform-origin: center;
}

.reserve::before { transform: rotate(45deg); }
.reserve::after { transform: rotate(-45deg); }

.selected {
  outline: 3px solid red;
}

footer {
  border-top: 1px solid #ccc;
  padding: 6px;
  background: #f5f5f5;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

button {
  padding: 10px;
  font-size: 16px;
}

/* 高亮 */
.active {
  background: #333;
  color: #fff;
}

input {
  width: 70px;
  font-size: 16px;
}

textarea {
  width: 100%;
  height: 80px;
}
</style>
</head>

<body>

<div id="canvas"></div>

<footer>

  <div>
    <button id="btnRoom" onclick="setMode('room', this)">房</button>
    <button id="btnWall" onclick="setMode('wall', this)">牆</button>
    <button id="btnReserve" onclick="setMode('reserve', this)">保留</button>
  </div>

  <div>
    寬 <input id="w" type="number" value="100">
    高 <input id="h" type="number" value="100">
    <button id="applySizeBtn" onclick="applySize()" disabled>套用尺寸</button>
  </div>

  <div id="info">未選取</div>

  <div>
    <button onclick="deleteSelected()">刪除</button>
    <button onclick="exportSVG()">SVG</button>
    <button onclick="showSVG()">檢視</button>
    <button onclick="clearAll()">清空</button>
  </div>

  <textarea id="svgOutput"></textarea>

</footer>

<script>
const canvas = document.getElementById('canvas');
const grid = 20;

let mode = null;
let elements = [];
let selected = null;

function snap(v) {
  return Math.round(v / grid) * grid;
}

/* ===== 工具選取 ===== */
function setMode(m, btn) {
  mode = m;

  document.querySelectorAll('footer button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

/* ===== 新增 ===== */
canvas.addEventListener('click', (e) => {
  if (!mode) {
    clearSelection();
    return;
  }

  if (e.target !== canvas) return;

  const rect = canvas.getBoundingClientRect();
  const x = snap(e.clientX - rect.left);
  const y = snap(e.clientY - rect.top);

  const w = snap(parseInt(document.getElementById('w').value));
  const h = snap(parseInt(document.getElementById('h').value));

  let el = document.createElement('div');
  el.classList.add('element', mode);

  if (mode === 'wall') {
    el.style.width = w + 'px';
    el.style.height = '10px';
  } else {
    el.style.width = w + 'px';
    el.style.height = h + 'px';
  }

  el.style.left = x + 'px';
  el.style.top = y + 'px';

  canvas.appendChild(el);
  makeDraggable(el);

  elements.push(el);
  select(el);

  mode = null;
  document.querySelectorAll('footer button').forEach(b => b.classList.remove('active'));

  save();
});

/* ===== 拖曳 + 手機 ===== */
function makeDraggable(el) {
  let offsetX, offsetY;
  let pressTimer;

  el.addEventListener('click', (e) => {
    e.stopPropagation();
    select(el);
  });

  el.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    startDrag(e.clientX, e.clientY);
  });

  el.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    select(el);

    const t = e.touches[0];

    pressTimer = setTimeout(() => {
      if (confirm('刪除這個元素？')) deleteElement(el);
    }, 600);

    startDrag(t.clientX, t.clientY);

    function move(ev) {
      clearTimeout(pressTimer);
      const t = ev.touches[0];
      drag(t.clientX, t.clientY);
    }

    function up() {
      clearTimeout(pressTimer);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', up);
      save();
    }

    document.addEventListener('touchmove', move);
    document.addEventListener('touchend', up);
  });

  function startDrag(x, y) {
    const rect = canvas.getBoundingClientRect();
    offsetX = x - rect.left - parseInt(el.style.left);
    offsetY = y - rect.top - parseInt(el.style.top);

    function move(ev) {
      drag(ev.clientX, ev.clientY);
    }

    function up() {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      save();
    }

    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }

  function drag(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    el.style.left = snap(clientX - rect.left - offsetX) + 'px';
    el.style.top = snap(clientY - rect.top - offsetY) + 'px';
  }
}

/* ===== 選取 ===== */
function select(el) {
  selected = el;
  document.querySelectorAll('.element').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');

  document.getElementById('applySizeBtn').disabled = false;

  const w = parseInt(el.style.width);
  const h = parseInt(el.style.height);
  document.getElementById('info').innerText = `尺寸: ${w} x ${h}`;
}

function clearSelection() {
  selected = null;
  document.querySelectorAll('.element').forEach(e=>e.classList.remove('selected'));
  document.getElementById('applySizeBtn').disabled = true;
  document.getElementById('info').innerText = '未選取';
}

/* ===== 尺寸修改 ===== */
function applySize() {
  if (!selected) return;

  const w = snap(parseInt(document.getElementById('w').value));
  const h = snap(parseInt(document.getElementById('h').value));

  selected.style.width = w + 'px';
  if (!selected.classList.contains('wall')) {
    selected.style.height = h + 'px';
  }

  select(selected);
  save();
}

/* ===== 刪除 ===== */
function deleteSelected() {
  if (!selected) return;
  deleteElement(selected);
}

function deleteElement(el) {
  el.remove();
  elements = elements.filter(e => e !== el);
  clearSelection();
  save();
}

/* ===== 清空 ===== */
function clearAll() {
  if (!confirm('確定清空？')) return;
  localStorage.removeItem('floorplan');
  location.reload();
}

/* ===== SVG ===== */
function exportSVG() {
  let svg = `<svg xmlns="http://www.w3.org/2000/svg">\n`;

  elements.forEach(el => {
    const x = parseInt(el.style.left);
    const y = parseInt(el.style.top);
    const w = parseInt(el.style.width);
    const h = parseInt(el.style.height);

    if (el.classList.contains('wall')) {
      svg += `<rect x="${x}" y="${y}" width="${w}" height="10" fill="black"/>\n`;
    } else if (el.classList.contains('reserve')) {
      svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="gray" stroke-width="10"/>\n`;
      svg += `<line x1="${x}" y1="${y}" x2="${x+w}" y2="${y+h}" stroke="gray"/>\n`;
      svg += `<line x1="${x+w}" y1="${y}" x2="${x}" y2="${y+h}" stroke="gray"/>\n`;
    } else {
      svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="black" stroke-width="10"/>\n`;
    }
  });

  svg += `</svg>`;
  download(svg);
}

function showSVG() {
  exportSVG();
}

/* ===== 儲存 ===== */
function save() {
  const data = elements.map(el => ({
    type: [...el.classList].find(c => c !== 'element'),
    x: el.style.left,
    y: el.style.top,
    w: el.style.width,
    h: el.style.height
  }));
  localStorage.setItem('floorplan', JSON.stringify(data));
}

function load() {
  const data = JSON.parse(localStorage.getItem('floorplan') || '[]');
  data.forEach(d => {
    let el = document.createElement('div');
    el.classList.add('element', d.type);
    el.style.left = d.x;
    el.style.top = d.y;
    el.style.width = d.w;
    el.style.height = d.h;
    canvas.appendChild(el);
    makeDraggable(el);
    elements.push(el);
  });
}

function download(text) {
  const blob = new Blob([text], {type: 'image/svg+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'plan.svg';
  a.click();
}

load();
</script>

</body>
</html>
