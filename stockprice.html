<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>股票買賣成本試算</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --border: #e2e6ea;
      --primary: #1a56db;
      --primary-bg: #eef3fd;
      --green: #0b7a50;
      --green-bg: #e6f4ef;
      --red: #c0392b;
      --red-bg: #fdecea;
      --orange: #b45309;
      --orange-bg: #fef3c7;
      --text: #1a1d23;
      --muted: #6b7280;
      --yellow-bg: #fefce8;
      --yellow-border: #fbbf24;
      --bar-h: 50px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
    }

    /* ── Scrollable page area ── */
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: .6rem .5rem;
      padding-top: calc(.6rem + env(safe-area-inset-top, 0px));
      padding-bottom: 1rem;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: .5rem;
      overflow: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .7rem 1.1rem;
      font-weight: 700;
      font-size: .93rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      gap: .6rem;
    }
    .card-head-actions { display: flex; gap: .5rem; }

    .btn-sm {
      padding: .28rem .7rem;
      border-radius: 6px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-sm.ghost {
      border-color: var(--border);
      background: var(--card);
      color: var(--muted);
    }
    .btn-sm.ghost:hover { border-color: var(--primary); color: var(--primary); }
    .btn-add {
      padding: .28rem .62rem;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      border: 1.5px solid var(--primary);
      background: var(--primary-bg);
      color: var(--primary);
      transition: all .15s;
    }
    .btn-add:hover { background: var(--primary); color: #fff; }

    /* ── ⋯ Menu ── */
    .menu-wrap { position: relative; }
    .menu-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,.14);
      z-index: 100;
      min-width: 150px;
      overflow: hidden;
    }
    .menu-dropdown.hidden { display: none; }
    .menu-item {
      display: block;
      width: 100%;
      padding: .6rem 1rem;
      text-align: left;
      background: none;
      border: none;
      font-size: .82rem;
      cursor: pointer;
      color: var(--text);
      transition: background .12s;
      white-space: nowrap;
    }
    .menu-item:hover { background: var(--primary-bg); color: var(--primary); }
    .menu-item + .menu-item { border-top: 1px solid var(--border); }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; overflow-y: auto; flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    thead th {
      padding: .45rem .55rem;
      text-align: right;
      font-size: .7rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      line-height: 1.4;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    thead th:first-child { text-align: left; }
    thead th.th-del { width: 32px; padding: 0; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--primary-bg); }

    .dyn-row { background: var(--primary-bg); }
    .dyn-row td { font-weight: 700; }
    .dyn-row:hover { background: #dce9fb; }
    .dyn-row.hidden { display: none; }
    .dyn-label {
      display: inline-block;
      font-size: .66rem;
      font-weight: 700;
      background: var(--primary);
      color: #fff;
      border-radius: 3px;
      padding: 0 .32rem;
      margin-right: .3rem;
      vertical-align: middle;
    }

    tbody td { padding: .5rem .55rem; text-align: right; white-space: nowrap; }
    tbody td:first-child { text-align: left; font-weight: 700; }
    tbody td.td-del { padding: .3rem .3rem; text-align: center; }

    .del-btn {
      background: none;
      border: none;
      color: var(--border);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: .2rem .4rem;
      border-radius: 4px;
      transition: all .15s;
    }
    .del-btn:hover { background: var(--red-bg); color: var(--red); }

    .add-here-btn {
      background: none;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      border-radius: 5px;
      padding: .15rem .5rem;
      font-size: .72rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }
    .add-here-btn:hover { background: var(--primary); color: #fff; }
    .add-here-btn.in-table { border-color: var(--border); color: var(--muted); cursor: default; }

    /* 兩欄：先賣後買 / 先買後賣 —— 句子靠左、可換行 */
    #refTable thead th { text-align: left; }
    .cell-2  { text-align: left; white-space: normal; line-height: 1.5; font-weight: 500; color: var(--text); }
    .hl-bb   { color: var(--orange); font-weight: 700; }
    .hl-sell { color: var(--green);  font-weight: 700; }

    /* ── Note ── */
    .note {
      background: var(--yellow-bg);
      border: 1px solid var(--yellow-border);
      border-radius: 8px 8px 0 0;
      padding: .4rem .8rem;
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.7;
      max-height: 1.55rem;
      overflow: hidden;
      flex-shrink: 0;
    }
    .note strong { color: var(--text); }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      padding: .8rem;
    }

    /* ═══════════════════════════════════════════════════
       SLIDE PANEL  ── bottom-anchored sheet, auto-height
       Panel grows upward from bottom; numpad stays at bottom.
    ═══════════════════════════════════════════════════ */
    .tb-panel {
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      max-height: 96dvh;
      max-height: 96vh;
      background: var(--card);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 30px rgba(0,0,0,.12);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tb-panel.open {
      transform: translateY(0);
    }

    /* Panel header */
    .tb-panel-head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .5rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .tb-panel-title {
      flex: 1;
      font-size: .85rem;
      font-weight: 700;
      color: var(--text);
    }
    .tb-close {
      flex-shrink: 0;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: .22rem .65rem;
      font-size: .78rem;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .tb-close:hover { border-color: var(--red); color: var(--red); }

    /* Results area — shrinks to content; panel auto-sizes */
    .results-scroll {
      flex: 0 0 auto;
      overflow-y: auto;
      max-height: 38dvh;
      max-height: 38vh;
      padding: .55rem 1rem .4rem;
    }
    .results-placeholder {
      padding: .5rem 0;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }
    .results-placeholder.hidden { display: none; }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: .55rem;
      margin-bottom: .5rem;
    }
    .result-grid:empty { display: none; }
    .r-box { border-radius: 8px; padding: .65rem .8rem; text-align: center; }
    .r-box .r-label { font-size: .68rem; color: var(--muted); margin-bottom: .25rem; line-height: 1.4; }
    .r-box .r-val   { font-size: 1.6rem; font-weight: 800; line-height: 1; }
    .r-box .r-sub   { font-size: .63rem; color: var(--muted); margin-top: .2rem; }
    .r-box.neutral  { background: var(--bg); }
    .r-box.sell     { background: var(--green-bg); }
    .r-box.sell .r-val   { color: var(--green); }
    .r-box.buyback  { background: var(--orange-bg); }
    .r-box.buyback .r-val { color: var(--orange); }
    .r-box.save     { background: var(--red-bg); }
    .r-box.save .r-val   { color: var(--red); }

    .add-row { margin-bottom: .3rem; }
    .add-row.hidden { display: none; }
    .add-to-table-btn {
      width: 100%;
      padding: .5rem;
      border-radius: 7px;
      border: 2px solid var(--primary);
      background: var(--primary-bg);
      color: var(--primary);
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      letter-spacing: .04em;
    }
    .add-to-table-btn:hover { background: var(--primary); color: #fff; }
    .add-to-table-btn.in-table {
      border-color: var(--border);
      background: var(--bg);
      color: var(--muted);
      cursor: default;
    }

    /* Display — fixed above numpad, does NOT move */
    .calc-display {
      flex-shrink: 0;
      background: #1a1d23;
      color: #fff;
      margin: 0 1rem .5rem;
      border-radius: 10px;
      padding: .6rem .9rem;
      display: flex;
      align-items: baseline;
      gap: .5rem;
      min-height: 58px;
    }
    .display-label { font-size: .72rem; opacity: .4; white-space: nowrap; flex-shrink: 0; }
    .display-val {
      font-size: 2.1rem; font-weight: 800; flex: 1;
      text-align: right; font-variant-numeric: tabular-nums;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .display-val.empty { opacity: .2; }
    .display-unit { font-size: .8rem; opacity: .4; white-space: nowrap; flex-shrink: 0; }

    /* Numpad — anchored at bottom, never moves */
    .numpad-wrap {
      flex-shrink: 0;
      padding: 0 1rem .6rem;
      padding-bottom: calc(.6rem + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: center;
    }
    .numpad-layout {
      display: flex;
      align-items: stretch;
      gap: 6px;
      width: 100%;
      max-width: 380px;
    }
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      flex: 1;
      min-width: 0;
    }
    .num-btn {
      /* adaptive height: scales with screen but clamped */
      height: clamp(44px, 9dvh, 62px);
      height: clamp(44px, 9vh, 62px);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      font-size: 1.35rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background .1s, transform .08s;
      touch-action: manipulation;
    }
    .num-btn:active { transform: scale(.91); background: var(--primary-bg); border-color: var(--primary); }
    .num-btn.action { background: #f1f3f5; font-size: 1.1rem; color: var(--muted); }
    .num-btn.action:active { background: var(--border); }
    .num-btn.clear {
      height: clamp(36px, 7dvh, 46px);
      height: clamp(36px, 7vh, 46px);
      font-size: .82rem;
      font-weight: 700;
      background: var(--red-bg);
      color: var(--red);
      border-color: transparent;
      letter-spacing: .04em;
    }
    .num-btn.clear:active { background: #f5c6c2; transform: scale(.98); }
    .num-btn.save {
      grid-column: span 2;
      height: clamp(36px, 7dvh, 46px);
      height: clamp(36px, 7vh, 46px);
      font-size: .82rem;
      font-weight: 700;
      background: var(--primary-bg);
      color: var(--primary);
      border-color: var(--primary);
      letter-spacing: .03em;
    }
    .num-btn.save:active { background: var(--primary); color: #fff; transform: scale(.98); }
    .num-btn.save.in-table {
      background: var(--bg);
      color: var(--muted);
      border-color: var(--border);
      pointer-events: none;
    }
    .num-btn.save.save-off {
      opacity: 0.3;
      pointer-events: none;
    }
    .r-box .r-val2  { font-size: 1.2rem; font-weight: 800; line-height: 1.5; }
    /* Result grid column presets */
    .result-grid-buy  { grid-template-columns: repeat(2, 1fr); }
    .result-grid-sell { grid-template-columns: repeat(3, 1fr); }

    /* ── Discount control (menu + popup) ── */
    .menu-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      padding: .55rem 1rem;
      font-size: .82rem;
      color: var(--text);
      white-space: nowrap;
    }
    .menu-item-row + .menu-item,
    .menu-item + .menu-item-row,
    .menu-item-row + .menu-item-row { border-top: 1px solid var(--border); }
    .menu-item-row.hidden { display: none; }
    .discount-select {
      font-size: .8rem;
      font-weight: 600;
      padding: .25rem .4rem;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      color: var(--primary);
      cursor: pointer;
    }

    /* Rows are clickable to inspect detail */
    tbody tr[data-price] { cursor: pointer; }

    /* ── Detail popup ── */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.42);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      padding-top: calc(1rem + env(safe-area-inset-top, 0px));
      padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    }
    .detail-overlay.hidden { display: none; }
    .detail-modal {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,.28);
      width: 100%;
      max-width: 420px;
      max-height: 90dvh;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .detail-head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .7rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .detail-title { flex: 1; font-size: .92rem; font-weight: 700; }
    .detail-close {
      flex-shrink: 0;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: .2rem .55rem;
      font-size: .85rem;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
    }
    .detail-close:hover { border-color: var(--red); color: var(--red); }
    .detail-body { overflow-y: auto; padding: .6rem 1rem .9rem; }

    .detail-section { margin-top: .85rem; }
    .detail-section:first-child { margin-top: .2rem; }
    .detail-section-title {
      font-size: .7rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: .35rem;
    }
    .detail-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: .3rem 0;
      border-bottom: 1px dashed var(--border);
      font-size: .85rem;
    }
    .detail-line:last-child { border-bottom: none; }
    .detail-line .d-key { color: var(--muted); }
    .detail-line .d-val {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .detail-line.highlight .d-val { color: var(--green); font-size: 1.05rem; }
    .detail-line.save .d-val { color: var(--red); }
    .detail-foot {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
      padding: .65rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--bg);
      font-size: .85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="wrap">

  <!-- Quick reference table -->
  <div class="card">
    <div class="card-head">
      <span>股票買賣成本快查</span>
      <div class="card-head-actions">
        <button class="btn-add" id="addPanelBtn" title="開啟試算">＋</button>
        <div class="menu-wrap" id="menuWrap">
          <button class="btn-sm ghost" id="menuTrigger">⋯</button>
          <div class="menu-dropdown hidden" id="menuDropdown">
            <div class="menu-item-row">
              <span>手續費折扣</span>
              <select class="discount-select" id="menuDiscount"></select>
            </div>
            <div class="menu-item-row">
              <span>交易單位</span>
              <select class="discount-select" id="menuTradeMode">
                <option value="lot">一張(1000股)</option>
                <option value="odd">零股</option>
              </select>
            </div>
            <div class="menu-item-row hidden" id="oddSharesRow">
              <span>零股股數</span>
              <input type="number" class="discount-select" id="menuOddShares"
                     min="1" max="999" step="1" inputmode="numeric"
                     style="width:5.5em;text-align:right">
            </div>
            <button class="menu-item" id="menuReset">還原預設</button>
          </div>
        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table id="refTable">
        <thead>
          <tr>
            <th>先賣後買</th>
            <th>先買後賣</th>
            <th class="th-del"></th>
          </tr>
        </thead>
        <tbody id="refBody">
          <tr id="dynRow" class="dyn-row hidden">
            <td colspan="3"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="note">
    <span id="noteFee">手續費 0.1425% × 2 ＋ 證交稅 0.3%（賣出）＝ 合計 <strong>0.585%</strong>（速記 <strong>0.6%</strong>）</span><br><br>
    • <strong>先買後賣</strong>：買進此價後，打平所需的最低賣出價（以上↓可賣）。<br>
    • <strong>先賣後買</strong>：賣出此價後，仍划算的最高回補價（以下↑可買）。<br>
    • 手續費最低收費：一張 20 元、零股 1 元，已套入試算。
  </div>

</div>

<footer>本試算僅供參考，不構成投資建議。</footer>

<!-- ══════════════════════════════════════
     SLIDE PANEL — full screen, opened via +
     Order (top→bottom):
       header · results-scroll · display · numpad
══════════════════════════════════════ -->
<div class="tb-panel" id="tbPanel">

  <!-- 1. Header: title + close -->
  <div class="tb-panel-head">
    <span class="tb-panel-title">股票買賣成本試算</span>
    <button class="tb-close" id="tbClose">✕ 收合</button>
  </div>

  <!-- 2. Results area — grows/shrinks, scrolls; display & numpad never move -->
  <div class="results-scroll" id="resultsScroll">
    <div class="results-placeholder" id="resultsPlaceholder">輸入金額，即時試算買回與賣出價</div>
    <div class="result-grid" id="calcResult"></div>
  </div>

  <!-- 3. Display — fixed, directly above numpad -->
  <div class="calc-display">
    <span class="display-label" id="displayLabel">輸入金額</span>
    <span class="display-val empty" id="displayVal">0</span>
    <span class="display-unit">元</span>
  </div>

  <!-- 4. Numpad — always at bottom, never moves -->
  <div class="numpad-wrap">
    <div class="numpad-layout">
      <!-- Numpad grid -->
      <div class="numpad" id="numpad">
        <button class="num-btn" data-d="7">7</button>
        <button class="num-btn" data-d="8">8</button>
        <button class="num-btn" data-d="9">9</button>
        <button class="num-btn" data-d="4">4</button>
        <button class="num-btn" data-d="5">5</button>
        <button class="num-btn" data-d="6">6</button>
        <button class="num-btn" data-d="1">1</button>
        <button class="num-btn" data-d="2">2</button>
        <button class="num-btn" data-d="3">3</button>
        <button class="num-btn" data-d=".">．</button>
        <button class="num-btn" data-d="0">0</button>
        <button class="num-btn action" data-action="back">⌫</button>
        <button class="num-btn clear" data-action="clear">清除</button>
        <button class="num-btn save save-off" id="saveBtn" data-action="save">存入快查</button>
      </div>
    </div>
  </div>

</div>

<!-- ══════════════════════════════════════
     DETAIL POPUP — calculation breakdown
══════════════════════════════════════ -->
<div class="detail-overlay hidden" id="detailOverlay">
  <div class="detail-modal">
    <div class="detail-head">
      <span class="detail-title" id="detailTitle">計算細節</span>
      <button class="detail-close" id="detailClose">✕</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
    <div class="detail-foot">
      <span>手續費折扣</span>
      <select class="discount-select" id="detailDiscount"></select>
    </div>
  </div>
</div>

<script>
(function () {
  /* ── Constants ── */
  const BASE_FEE = 0.001425;          // 券商手續費標準費率
  const SELL_TAX = 0.003;             // 證交稅（賣出）

  /* ── Fee discount (折扣) ── default 無折扣 ── */
  const DISCOUNT_KEY = 'stockprice_v2_discount';
  const DISCOUNT_OPTIONS = [
    { val: 1,    label: '無折扣' },
    { val: 0.5,  label: '5折' },
    { val: 0.35, label: '3.5折' },
    { val: 0.26, label: '2.6折' },
    { val: 0.2,  label: '2折' },
  ];

  let feeDiscount = loadDiscount();

  function loadDiscount() {
    try {
      const s = localStorage.getItem(DISCOUNT_KEY);
      if (s !== null) {
        const v = parseFloat(s);
        if (DISCOUNT_OPTIONS.some(o => o.val === v)) return v;
      }
    } catch {}
    return 1;
  }
  function saveDiscount() {
    try { localStorage.setItem(DISCOUNT_KEY, String(feeDiscount)); } catch {}
  }

  /* Live fee rates — recomputed from the current discount */
  function buyFee()  { return BASE_FEE * feeDiscount; }
  function sellFee() { return BASE_FEE * feeDiscount; }
  function total()   { return buyFee() + sellFee() + SELL_TAX; }

  function discountLabel() {
    const o = DISCOUNT_OPTIONS.find(o => o.val === feeDiscount);
    return o ? o.label : '無折扣';
  }
  /* Format a fraction as a trimmed percentage string */
  function pctStr(frac) {
    return (frac * 100).toFixed(5).replace(/0+$/, '').replace(/\.$/, '');
  }

  /* ── Trade unit (交易單位) ── 一張 = 1000 股，最低手續費 20 元；
                                 零股 = 自訂股數，最低手續費 1 元 ── */
  const LOT_SIZE     = 1000;   // 一張股數
  const MIN_FEE_LOT  = 20;     // 一張最低手續費（元）
  const MIN_FEE_ODD  = 1;      // 零股最低手續費（元）
  const TRADE_MODE_KEY  = 'stockprice_v2_trademode';
  const ODD_SHARES_KEY  = 'stockprice_v2_oddshares';

  let tradeMode = loadTradeMode();   // 'lot' | 'odd'
  let oddShares = loadOddShares();   // 1..999

  function loadTradeMode() {
    try {
      const s = localStorage.getItem(TRADE_MODE_KEY);
      if (s === 'lot' || s === 'odd') return s;
    } catch {}
    return 'lot';
  }
  function loadOddShares() {
    try {
      const v = parseInt(localStorage.getItem(ODD_SHARES_KEY), 10);
      if (Number.isFinite(v)) return clampOdd(v);
    } catch {}
    return 100;
  }
  function clampOdd(v) { return Math.min(999, Math.max(1, Math.round(v))); }
  function saveTradeMode() { try { localStorage.setItem(TRADE_MODE_KEY, tradeMode); } catch {} }
  function saveOddShares() { try { localStorage.setItem(ODD_SHARES_KEY, String(oddShares)); } catch {} }

  /* Live quantity & minimum brokerage fee for the current trade unit */
  function qty()    { return tradeMode === 'lot' ? LOT_SIZE : oddShares; }
  function minFee() { return tradeMode === 'lot' ? MIN_FEE_LOT : MIN_FEE_ODD; }
  function tradeLabel() {
    return tradeMode === 'lot' ? '一張（1000 股）' : `零股（${oddShares} 股）`;
  }

  const DEFAULT_PRICES = [
    25, 30, 40,
    50, 60, 75, 80,
    100, 120, 150, 200, 250, 300, 400,
    500, 600, 700, 800,
    1000, 1200, 1500, 2000, 2290, 3000, 5000
  ];

  const STORAGE_KEY = 'stockprice_v2_items';

  /* ── Tick helpers ── */
  function tickOf(p) {
    if (p <   10) return 0.01;
    if (p <   50) return 0.1;
    if (p <  100) return 0.5;
    if (p <  500) return 1;
    if (p < 1000) return 5;
    return 10;
  }
  function decimals(t) { return t >= 1 ? 0 : t.toString().split('.')[1].length; }
  function fmt(v, t)   { return v.toFixed(decimals(t)); }
  function ceilTick(v, t)  { return Math.ceil(Math.round(v / t * 1e8) / 1e8) * t; }
  function floorTick(v, t) { return Math.floor(Math.round(v / t * 1e8) / 1e8) * t; }

  /* ── Core calculations ──
     All amounts account for the trade quantity q and the minimum
     brokerage fee mf (券商手續費最低收費). Brokerage on each side is
     max(value × rate, mf); 證交稅 has no floor. */
  function calcBuy(buy) {
    const tick = tickOf(buy);
    const q    = qty();
    const mf   = minFee();

    // 買入總成本（含最低手續費下限）
    const buyBrokerage = Math.max(buy * q * buyFee(), mf);
    const buyCostTotal = buy * q + buyBrokerage;

    // 最低賣出：淨收 = min(賣出費未觸底線, 賣出費觸底線)，兩線皆需 ≥ 買入成本，
    // 故打平價 = max(兩線解)。
    const sA = buyCostTotal / (q * (1 - SELL_TAX - sellFee())); // 賣出手續費未觸底
    const sB = (buyCostTotal + mf) / (q * (1 - SELL_TAX));      // 賣出手續費觸底
    const exactMinSell = Math.max(sA, sB);
    // 進位到「該賣出價」所屬級距的合法升降單位（非買入價級距），避免跨價格帶失準。
    const minSell     = ceilTick(exactMinSell, tickOf(exactMinSell));
    const spread      = minSell - buy;
    const theoretical = exactMinSell - buy;   // 打平所需價差（未進位）

    // 省錢回補上限：以現價 buy 賣出後，最高可回補價（回補成本 ≤ 賣出淨收）。
    const sellNetAtBuy = buy * q * (1 - SELL_TAX) - Math.max(buy * q * sellFee(), mf);
    const pA = sellNetAtBuy / (q * (1 + buyFee())); // 回補手續費未觸底
    const pB = (sellNetAtBuy - mf) / q;             // 回補手續費觸底
    const exactSave = Math.max(0, Math.min(pA, pB));
    const maxSave   = floorTick(exactSave, tickOf(exactSave));

    return { buy, tick, q, minFee: mf, theoretical, spread,
             minSell, tickSell: tickOf(minSell),
             buyBrokerage, buyCostTotal,
             maxSave, tickSave: tickOf(exactSave) };
  }

  function calcSell(sell) {
    const tick = tickOf(sell);
    const q    = qty();
    const mf   = minFee();

    const sellBrokerage = Math.max(sell * q * sellFee(), mf);
    const tax           = sell * q * SELL_TAX;
    const fees          = sellBrokerage + tax;          // 費用合計（總額）
    const netProceeds   = sell * q - fees;              // 到手金額（總額）

    // 省錢回補：賣出後最高可回補價（回補成本 ≤ 到手金額）。
    const pA = netProceeds / (q * (1 + buyFee()));      // 回補手續費未觸底
    const pB = (netProceeds - mf) / q;                  // 回補手續費觸底
    const exactThresh = Math.max(0, Math.min(pA, pB));
    const threshold   = floorTick(exactThresh, tickOf(exactThresh));
    const drop        = sell - threshold;
    const dropTicks   = Math.round(drop / tick);
    return { sell, tick, q, sellBrokerage, tax, fees, netProceeds,
             threshold, tickThresh: tickOf(exactThresh), drop, dropTicks };
  }

  /* ── Table state ── */
  let tableItems = loadItems();

  function loadItems() {
    try {
      const s = localStorage.getItem(STORAGE_KEY);
      if (s) return JSON.parse(s);
    } catch {}
    return [...DEFAULT_PRICES];
  }

  function saveItems() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tableItems)); } catch {}
  }

  function isInTable(p) { return tableItems.includes(p); }

  function addItem(price) {
    if (isInTable(price)) return;
    tableItems = [...tableItems, price].sort((a, b) => a - b);
    saveItems();
    rebuildTableRows();
    refreshSaveBtn();
    refreshDynRow();
  }

  function deleteItem(price) {
    if (!confirm(`確定移除 ${price} 元？`)) return;
    tableItems = tableItems.filter(p => p !== price);
    saveItems();
    const row = document.querySelector(`tr[data-price="${price}"]`);
    if (row) row.remove();
    refreshSaveBtn();
    refreshDynRow();
  }

  function resetDefaults() {
    tableItems = [...DEFAULT_PRICES];
    saveItems();
    rebuildTableRows();
    refreshSaveBtn();
    refreshDynRow();
  }

  /* ── Table rendering ── */
  /* Build the two sentence cells for a given price.
       先賣後買：賣 P 元，{回補價} 以下↑可買
       先買後賣：買 P 元，{賣出價} 以上↓可賣 */
  function rowCells(price) {
    const rb = calcBuy(price);    // 賣出方向（買進後打平）
    const rs = calcSell(price);   // 買回方向（賣出後回補）
    return {
      bb:   `賣${price}元，<strong class="hl-bb">${fmt(rs.threshold, rs.tickThresh)} 以下↑</strong>可買`,
      sell: `買${price}元，<strong class="hl-sell">${fmt(rb.minSell, rb.tickSell)} 以上↓</strong>可賣`,
    };
  }

  function makeStaticRow(price) {
    const c  = rowCells(price);
    const tr = document.createElement('tr');
    tr.dataset.price = price;
    tr.innerHTML = `
      <td class="cell-2">${c.bb}</td>
      <td class="cell-2">${c.sell}</td>
      <td class="td-del">
        <button class="del-btn" data-price="${price}" title="移除">✕</button>
      </td>
    `;
    return tr;
  }

  function rebuildTableRows() {
    const tbody = document.getElementById('refBody');
    [...tbody.querySelectorAll('tr[data-price]')].forEach(r => r.remove());
    tableItems.forEach(price => tbody.appendChild(makeStaticRow(price)));
  }

  /* ── Input state ── */
  let input = '';

  function getPrice() {
    const v = parseFloat(input);
    return isFinite(v) && v > 0 ? v : null;
  }

  function pressDigit(d) {
    if (d === '.') {
      if (input.includes('.')) return;
      input = (input || '0') + '.';
    } else {
      const [intPart, decPart] = input.split('.');
      if (decPart !== undefined) {
        if (decPart.length >= 2) return;
      } else {
        if ((intPart || '').length >= 5) return;
        if (intPart === '0') { input = d; refresh(); return; }
      }
      input += d;
    }
    refresh();
  }

  function pressBack()  { input = input.slice(0, -1); refresh(); }
  function pressClear() { input = ''; refresh(); }

  /* ── Refresh UI ── */
  function refresh() {
    refreshDisplay();
    refreshResults();
    refreshDynRow();
    refreshSaveBtn();
  }

  function refreshSaveBtn() {
    const btn   = document.getElementById('saveBtn');
    const price = getPrice();
    btn.classList.remove('in-table', 'save-off');
    if (!price) {
      btn.textContent = '存入快查';
      btn.classList.add('save-off');
      return;
    }
    const inTable = isInTable(price);
    btn.textContent = inTable ? '✓ 已存入' : '存入快查';
    if (inTable) btn.classList.add('in-table');
  }

  function refreshDisplay() {
    const valEl = document.getElementById('displayVal');
    valEl.textContent = input || '0';
    valEl.classList.toggle('empty', !input);
  }

  function refreshResults() {
    const box         = document.getElementById('calcResult');
    const placeholder = document.getElementById('resultsPlaceholder');
    const price       = getPrice();

    if (!price) {
      box.innerHTML = '';
      placeholder.classList.remove('hidden');
      return;
    }
    placeholder.classList.add('hidden');

    const rb = calcBuy(price);    // 賣出方向（買進後打平）
    const rs = calcSell(price);   // 買回方向（賣出後回補）
    box.className = 'result-grid result-grid-buy';
    box.innerHTML = `
      <div class="r-box buyback">
        <div class="r-label">先賣後買 ｜ 賣${price}元</div>
        <div class="r-val">${fmt(rs.threshold, rs.tickThresh)}</div>
        <div class="r-sub">以下↑可買</div>
      </div>
      <div class="r-box sell">
        <div class="r-label">先買後賣 ｜ 買${price}元</div>
        <div class="r-val">${fmt(rb.minSell, rb.tickSell)}</div>
        <div class="r-sub">以上↓可賣</div>
      </div>
    `;
  }

  function refreshDynRow() {
    const dynRow = document.getElementById('dynRow');
    const price  = getPrice();
    if (!price) { dynRow.classList.add('hidden'); return; }
    const c       = rowCells(price);
    const inTable = isInTable(price);
    dynRow.dataset.price = price;
    dynRow.classList.remove('hidden');
    dynRow.innerHTML = `
      <td class="cell-2"><span class="dyn-label">試算</span>${c.bb}</td>
      <td class="cell-2">${c.sell}</td>
      <td class="td-del">
        <button class="add-here-btn${inTable ? ' in-table' : ''}" id="addHereBtn">
          ${inTable ? '✓' : '存入快查'}
        </button>
      </td>
    `;
    if (!inTable) {
      document.getElementById('addHereBtn').addEventListener('click', () => addItem(price));
    }
  }

  /* ── Panel open / close ── */
  let isOpen = false;

  function openPanel() {
    isOpen = true;
    document.getElementById('tbPanel').classList.add('open');
  }

  function closePanel() {
    isOpen = false;
    document.getElementById('tbPanel').classList.remove('open');
  }

  /* ── Event listeners ── */
  document.getElementById('addPanelBtn').addEventListener('click', e => {
    e.stopPropagation();
    openPanel();
  });
  document.getElementById('tbClose').addEventListener('click', e => {
    e.stopPropagation();
    closePanel();
  });

  document.getElementById('numpad').addEventListener('click', e => {
    const btn = e.target.closest('.num-btn');
    if (!btn) return;
    if (btn.dataset.d !== undefined) pressDigit(btn.dataset.d === '．' ? '.' : btn.dataset.d);
    else if (btn.dataset.action === 'back')  pressBack();
    else if (btn.dataset.action === 'clear') pressClear();
    else if (btn.dataset.action === 'save') {
      const price = getPrice();
      if (price) addItem(price);
    }
  });

  document.getElementById('refBody').addEventListener('click', e => {
    const delBtn = e.target.closest('.del-btn');
    if (delBtn) { deleteItem(parseFloat(delBtn.dataset.price)); return; }
    if (e.target.closest('.add-here-btn')) return;   // handled by its own listener
    const row = e.target.closest('tr[data-price]');
    if (row) openDetail(parseFloat(row.dataset.price));
  });

  /* ── Fee discount control ── */
  function populateDiscountSelect(sel) {
    sel.innerHTML = DISCOUNT_OPTIONS
      .map(o => `<option value="${o.val}">${o.label}</option>`)
      .join('');
    sel.value = String(feeDiscount);
  }

  function syncDiscountControls() {
    ['menuDiscount', 'detailDiscount'].forEach(id => {
      const sel = document.getElementById(id);
      if (sel) sel.value = String(feeDiscount);
    });
  }

  function setDiscount(v) {
    if (!DISCOUNT_OPTIONS.some(o => o.val === v)) return;
    feeDiscount = v;
    saveDiscount();
    rebuildTableRows();   // every cached row recalculated with new fees
    refresh();            // panel display / results / dyn row
    updateNote();
    syncDiscountControls();
    if (!document.getElementById('detailOverlay').classList.contains('hidden')) {
      renderDetail();     // keep open popup in sync
    }
  }

  /* Recompute table + panel + note + open popup after a global setting change */
  function recomputeAll() {
    rebuildTableRows();
    refresh();
    updateNote();
    if (!document.getElementById('detailOverlay').classList.contains('hidden')) {
      renderDetail();
    }
  }

  function setTradeMode(m) {
    if (m !== 'lot' && m !== 'odd') return;
    tradeMode = m;
    saveTradeMode();
    syncTradeControls();
    recomputeAll();
  }

  function setOddShares(v) {
    oddShares = clampOdd(v);
    saveOddShares();
    syncTradeControls();
    if (tradeMode === 'odd') recomputeAll();
  }

  function syncTradeControls() {
    const sel = document.getElementById('menuTradeMode');
    if (sel) sel.value = tradeMode;
    const inp = document.getElementById('menuOddShares');
    if (inp && document.activeElement !== inp) inp.value = String(oddShares);
    const row = document.getElementById('oddSharesRow');
    if (row) row.classList.toggle('hidden', tradeMode !== 'odd');
  }

  function updateNote() {
    const fee = pctStr(BASE_FEE * feeDiscount);
    const tot = pctStr(BASE_FEE * feeDiscount * 2 + SELL_TAX);
    const disc = feeDiscount === 1 ? '' : `（${discountLabel()}）`;
    document.getElementById('noteFee').innerHTML =
      `<strong>${tradeLabel()}</strong>・最低手續費 ${minFee()} 元 ｜ ` +
      `手續費 ${fee}%${disc} × 2 ＋ 證交稅 0.3%（賣出）＝ 合計 <strong>${tot}%</strong>`;
  }

  /* ── Detail popup ── */
  let detailPrice = null;

  function openDetail(price) {
    detailPrice = price;
    renderDetail();
    document.getElementById('detailOverlay').classList.remove('hidden');
  }
  function closeDetail() {
    detailPrice = null;
    document.getElementById('detailOverlay').classList.add('hidden');
  }

  function renderDetail() {
    if (detailPrice == null) return;
    const price         = detailPrice;
    const rb            = calcBuy(price);    // 賣出方向（買進 price 後打平）
    const rs            = calcSell(price);   // 買回方向（賣出 price 後回補）
    const q             = rb.q;
    const sellBrokerage = Math.max(rb.minSell * q * sellFee(), rb.minFee);
    const taxAmt        = rb.minSell * q * SELL_TAX;
    const buyCost       = rb.buyCostTotal;
    const sellNet       = rb.minSell * q - sellBrokerage - taxAmt;
    const profit        = sellNet - buyCost;
    const disc          = feeDiscount === 1 ? '無折扣' : discountLabel();
    const buyFloored    = price * q * buyFee() < rb.minFee;
    const sellFloored   = rb.minSell * q * sellFee() < rb.minFee;

    document.getElementById('detailTitle').textContent = `輸入 ${fmt(price, rb.tick)} 元 · 計算細節`;

    const line = (k, v, cls) =>
      `<div class="detail-line${cls ? ' ' + cls : ''}"><span class="d-key">${k}</span><span class="d-val">${v}</span></div>`;

    document.getElementById('detailBody').innerHTML = `
      <div class="detail-section">
        <div class="detail-section-title">手續費設定</div>
        ${line('交易單位', tradeLabel())}
        ${line('折扣', disc)}
        ${line('買入手續費率', `${pctStr(buyFee())}%`)}
        ${line('賣出手續費率', `${pctStr(sellFee())}%`)}
        ${line('證交稅率（賣出）', `${pctStr(SELL_TAX)}%`)}
        ${line('最低手續費', `${rb.minFee} 元／筆`)}
      </div>
      <div class="detail-section">
        <div class="detail-section-title">賣出 ｜ 買進 ${fmt(price, rb.tick)} 後打平</div>
        ${line('升降單位', rb.tick)}
        ${line('理論價差（打平所需，未進位）', rb.theoretical.toFixed(2))}
        ${line('約需價差（進位至升降單位）', fmt(rb.spread, rb.tick))}
        ${line('最低賣出', fmt(rb.minSell, rb.tickSell), 'highlight')}
        ${line(`買入成本（股款＋手續費・${q}股）`, buyCost.toFixed(2))}
        ${line(`　└ 買入手續費${buyFloored ? '（最低收費）' : ''}`, rb.buyBrokerage.toFixed(2))}
        ${line('賣出淨收（股款－手續費－稅）', sellNet.toFixed(2))}
        ${line(`　└ 賣出手續費${sellFloored ? '（最低收費）' : ''}`, sellBrokerage.toFixed(2))}
        ${line('　└ 證交稅', taxAmt.toFixed(2))}
        ${line('淨損益', profit.toFixed(2))}
      </div>
      <div class="detail-section">
        <div class="detail-section-title">買回 ｜ 賣出 ${fmt(price, rb.tick)} 後回補</div>
        ${line(`到手金額（${q}股）`, rs.netProceeds.toFixed(2))}
        ${line('費用合計（手續費＋稅）', rs.fees.toFixed(2))}
        ${line('最高買回價（低於此價才省）', fmt(rs.threshold, rs.tickThresh), 'save')}
      </div>
    `;
  }

  document.getElementById('detailClose').addEventListener('click', closeDetail);
  document.getElementById('detailOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('detailOverlay')) closeDetail();
  });
  document.getElementById('detailDiscount').addEventListener('change', e => {
    setDiscount(parseFloat(e.target.value));
  });
  document.getElementById('menuDiscount').addEventListener('change', e => {
    e.stopPropagation();
    setDiscount(parseFloat(e.target.value));
  });
  document.getElementById('menuDiscount').addEventListener('click', e => e.stopPropagation());

  /* ── Trade unit (交易單位 / 零股股數) ── */
  document.getElementById('menuTradeMode').addEventListener('change', e => {
    e.stopPropagation();
    setTradeMode(e.target.value);
  });
  document.getElementById('menuTradeMode').addEventListener('click', e => e.stopPropagation());
  document.getElementById('menuOddShares').addEventListener('input', e => {
    e.stopPropagation();
    const v = parseInt(e.target.value, 10);
    if (Number.isFinite(v)) setOddShares(v);
  });
  document.getElementById('menuOddShares').addEventListener('change', e => {
    e.stopPropagation();
    e.target.value = String(oddShares);   // normalize once editing ends
  });
  document.getElementById('menuOddShares').addEventListener('click', e => e.stopPropagation());

  /* ── ⋯ Menu ── */
  document.getElementById('menuTrigger').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('menuDropdown').classList.toggle('hidden');
  });
  document.getElementById('menuReset').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('menuDropdown').classList.add('hidden');
    if (confirm('還原為預設的快查表項目？')) resetDefaults();
  });
  document.addEventListener('click', () => {
    document.getElementById('menuDropdown').classList.add('hidden');
  });

  /* ── Init ── */
  populateDiscountSelect(document.getElementById('menuDiscount'));
  populateDiscountSelect(document.getElementById('detailDiscount'));
  syncTradeControls();
  updateNote();
  rebuildTableRows();
  refresh();
})();
</script>
</body>
</html>
