<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>股票買賣成本試算</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --border: #e2e6ea;
      --primary: #1a56db;
      --primary-bg: #eef3fd;
      --green: #0b7a50;
      --green-bg: #e6f4ef;
      --red: #c0392b;
      --red-bg: #fdecea;
      --orange: #b45309;
      --orange-bg: #fef3c7;
      --text: #1a1d23;
      --muted: #6b7280;
      --yellow-bg: #fefce8;
      --yellow-border: #fbbf24;
      --bar-h: 50px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
    }

    /* ── Scrollable page area ── */
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: .6rem .5rem;
      padding-top: calc(.6rem + env(safe-area-inset-top, 0px));
      padding-bottom: 1.5rem;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .7rem 1.1rem;
      font-weight: 700;
      font-size: .93rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      gap: .6rem;
    }
    .card-head-actions { display: flex; gap: .5rem; }

    .btn-sm {
      padding: .28rem .7rem;
      border-radius: 6px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-sm.ghost {
      border-color: var(--border);
      background: var(--card);
      color: var(--muted);
    }
    .btn-sm.ghost:hover { border-color: var(--primary); color: var(--primary); }
    .btn-add {
      padding: .28rem .62rem;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      border: 1.5px solid var(--primary);
      background: var(--primary-bg);
      color: var(--primary);
      transition: all .15s;
    }
    .btn-add:hover { background: var(--primary); color: #fff; }

    /* ── ⋯ Menu ── */
    .menu-wrap { position: relative; }
    .menu-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,.14);
      z-index: 100;
      min-width: 150px;
      overflow: hidden;
    }
    .menu-dropdown.hidden { display: none; }
    .menu-item {
      display: block;
      width: 100%;
      padding: .6rem 1rem;
      text-align: left;
      background: none;
      border: none;
      font-size: .82rem;
      cursor: pointer;
      color: var(--text);
      transition: background .12s;
      white-space: nowrap;
    }
    .menu-item:hover { background: var(--primary-bg); color: var(--primary); }
    .menu-item + .menu-item { border-top: 1px solid var(--border); }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; max-height: 58vh; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    thead th {
      padding: .45rem .55rem;
      text-align: right;
      font-size: .7rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      line-height: 1.4;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    thead th:first-child { text-align: left; }
    thead th.th-del { width: 32px; padding: 0; }
    /* Hide tick column by default */
    table.hide-tick .th-tick,
    table.hide-tick .td-tick { display: none; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--primary-bg); }

    .dyn-row { background: var(--primary-bg); }
    .dyn-row td { font-weight: 700; }
    .dyn-row:hover { background: #dce9fb; }
    .dyn-row.hidden { display: none; }
    .dyn-label {
      display: inline-block;
      font-size: .66rem;
      font-weight: 700;
      background: var(--primary);
      color: #fff;
      border-radius: 3px;
      padding: 0 .32rem;
      margin-right: .3rem;
      vertical-align: middle;
    }

    tbody td { padding: .5rem .55rem; text-align: right; white-space: nowrap; }
    tbody td:first-child { text-align: left; font-weight: 700; }
    tbody td.td-del { padding: .3rem .3rem; text-align: center; }

    .del-btn {
      background: none;
      border: none;
      color: var(--border);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: .2rem .4rem;
      border-radius: 4px;
      transition: all .15s;
    }
    .del-btn:hover { background: var(--red-bg); color: var(--red); }

    .add-here-btn {
      background: none;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      border-radius: 5px;
      padding: .15rem .5rem;
      font-size: .72rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }
    .add-here-btn:hover { background: var(--primary); color: #fff; }
    .add-here-btn.in-table { border-color: var(--border); color: var(--muted); cursor: default; }

    .td-tick   { color: var(--muted); font-size: .78rem; }
    .td-range  { line-height: 1.65; }
    .td-spread { color: var(--muted); }
    .td-spread strong { color: var(--text); }
    .td-sell   { color: var(--green);  font-weight: 700; }
    .td-bb     { color: var(--orange); font-weight: 700; }
    .td-save   { color: var(--red);    font-weight: 700; }

    /* ── Note ── */
    .note {
      background: var(--yellow-bg);
      border: 1px solid var(--yellow-border);
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.8;
    }
    .note strong { color: var(--text); }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      padding: .8rem;
    }

    /* ═══════════════════════════════════════════════════
       SLIDE PANEL  ── full viewport, opened via + button
       Layout (flex-column, top→bottom):
         [header] fixed
         [results-scroll] flex:1 scrollable
         [display] fixed
         [numpad]  fixed
    ═══════════════════════════════════════════════════ */
    .tb-panel {
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      height: 100vh;
      height: 100dvh;
      background: var(--card);
      border-top: 1px solid var(--border);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tb-panel.open {
      transform: translateY(0);
    }

    /* Panel header */
    .tb-panel-head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .5rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .tb-panel-title {
      flex: 1;
      font-size: .85rem;
      font-weight: 700;
      color: var(--text);
    }
    .tb-close {
      flex-shrink: 0;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: .22rem .65rem;
      font-size: .78rem;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .tb-close:hover { border-color: var(--red); color: var(--red); }

    /* Results area — flex:1 so it fills space between header and display */
    .results-scroll {
      flex: 1;
      min-height: 0;       /* critical: allows flex child to shrink below content height */
      overflow-y: auto;
      padding: .55rem 1rem .4rem;
      display: flex;
      flex-direction: column;
    }
    .results-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }
    .results-placeholder.hidden { display: none; }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: .55rem;
      margin-bottom: .5rem;
    }
    .result-grid:empty { display: none; }
    .r-box { border-radius: 8px; padding: .65rem .8rem; text-align: center; }
    .r-box .r-label { font-size: .68rem; color: var(--muted); margin-bottom: .25rem; line-height: 1.4; }
    .r-box .r-val   { font-size: 1.6rem; font-weight: 800; line-height: 1; }
    .r-box .r-sub   { font-size: .63rem; color: var(--muted); margin-top: .2rem; }
    .r-box.neutral  { background: var(--bg); }
    .r-box.sell     { background: var(--green-bg); }
    .r-box.sell .r-val   { color: var(--green); }
    .r-box.buyback  { background: var(--orange-bg); }
    .r-box.buyback .r-val { color: var(--orange); }
    .r-box.save     { background: var(--red-bg); }
    .r-box.save .r-val   { color: var(--red); }

    .add-row { margin-bottom: .3rem; }
    .add-row.hidden { display: none; }
    .add-to-table-btn {
      width: 100%;
      padding: .5rem;
      border-radius: 7px;
      border: 2px solid var(--primary);
      background: var(--primary-bg);
      color: var(--primary);
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      letter-spacing: .04em;
    }
    .add-to-table-btn:hover { background: var(--primary); color: #fff; }
    .add-to-table-btn.in-table {
      border-color: var(--border);
      background: var(--bg);
      color: var(--muted);
      cursor: default;
    }

    /* Display — fixed above numpad, does NOT move */
    .calc-display {
      flex-shrink: 0;
      background: #1a1d23;
      color: #fff;
      margin: 0 1rem .5rem;
      border-radius: 10px;
      padding: .6rem .9rem;
      display: flex;
      align-items: baseline;
      gap: .5rem;
      min-height: 58px;
    }
    .display-label { font-size: .72rem; opacity: .4; white-space: nowrap; flex-shrink: 0; }
    .display-val {
      font-size: 2.1rem; font-weight: 800; flex: 1;
      text-align: right; font-variant-numeric: tabular-nums;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .display-val.empty { opacity: .2; }
    .display-unit { font-size: .8rem; opacity: .4; white-space: nowrap; flex-shrink: 0; }

    /* Numpad — anchored at bottom, never moves */
    .numpad-wrap {
      flex-shrink: 0;
      padding: 0 1rem .6rem;
      padding-bottom: calc(.6rem + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: center;
    }
    .numpad-layout {
      display: flex;
      align-items: stretch;
      gap: 6px;
      width: 100%;
      max-width: 380px;
    }
    /* Buy / Sell buttons — vertical column to the left of numpad */
    .persp-col {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
      width: 52px;
    }
    .persp-btn {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      font-size: .82rem;
      font-weight: 800;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s;
      letter-spacing: .04em;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .persp-btn[data-mode="buy"].active  { border-color: var(--primary); background: var(--primary); color: #fff; }
    .persp-btn[data-mode="sell"].active { border-color: var(--green);   background: var(--green);   color: #fff; }
    .persp-btn:active { transform: scale(.93); }
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      flex: 1;
      min-width: 0;
    }
    /* Dim numpad when no mode is selected */
    .numpad.disabled .num-btn {
      opacity: 0.28;
      pointer-events: none;
    }
    .num-btn {
      /* adaptive height: scales with screen but clamped */
      height: clamp(44px, 9dvh, 62px);
      height: clamp(44px, 9vh, 62px);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      font-size: 1.35rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background .1s, transform .08s;
      touch-action: manipulation;
    }
    .num-btn:active { transform: scale(.91); background: var(--primary-bg); border-color: var(--primary); }
    .num-btn.action { background: #f1f3f5; font-size: 1.1rem; color: var(--muted); }
    .num-btn.action:active { background: var(--border); }
    .num-btn.clear {
      height: clamp(36px, 7dvh, 46px);
      height: clamp(36px, 7vh, 46px);
      font-size: .82rem;
      font-weight: 700;
      background: var(--red-bg);
      color: var(--red);
      border-color: transparent;
      letter-spacing: .04em;
    }
    .num-btn.clear:active { background: #f5c6c2; transform: scale(.98); }
    .num-btn.save {
      grid-column: span 2;
      height: clamp(36px, 7dvh, 46px);
      height: clamp(36px, 7vh, 46px);
      font-size: .82rem;
      font-weight: 700;
      background: var(--primary-bg);
      color: var(--primary);
      border-color: var(--primary);
      letter-spacing: .03em;
    }
    .num-btn.save:active { background: var(--primary); color: #fff; transform: scale(.98); }
    .num-btn.save.in-table {
      background: var(--bg);
      color: var(--muted);
      border-color: var(--border);
      pointer-events: none;
    }
    .num-btn.save.save-off {
      opacity: 0.3;
      pointer-events: none;
    }
    /* Buy result boxes always in one row */
    .result-grid-buy { grid-template-columns: repeat(3, 1fr); }
  </style>
</head>
<body>

<div class="wrap">

  <!-- Quick reference table -->
  <div class="card">
    <div class="card-head">
      <span>股票買賣成本快查</span>
      <div class="card-head-actions">
        <button class="btn-add" id="addPanelBtn" title="開啟試算">＋</button>
        <div class="menu-wrap" id="menuWrap">
          <button class="btn-sm ghost" id="menuTrigger">⋯</button>
          <div class="menu-dropdown hidden" id="menuDropdown">
            <button class="menu-item" id="menuToggleTick">☐ 顯示升降單位</button>
            <button class="menu-item" id="menuReset">還原預設</button>
          </div>
        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table id="refTable" class="hide-tick">
        <thead>
          <tr>
            <th>買入價</th>
            <th class="th-tick">升降<br>單位</th>
            <th>約需價差</th>
            <th>打平區間<br><span style="font-weight:400;color:var(--green);font-size:.65rem">▲賣出</span> / <span style="font-weight:400;color:var(--orange);font-size:.65rem">▼買回</span></th>
            <th class="th-del"></th>
          </tr>
        </thead>
        <tbody id="refBody">
          <tr id="dynRow" class="dyn-row hidden">
            <td colspan="5"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="note">
    手續費 0.1425% × 2 ＋ 證交稅 0.3%（賣出）＝ 合計 <strong>0.585%</strong>（速記 <strong>0.6%</strong>）<br><br>
    • <strong>最低賣出</strong>：打平門檻，含雙向手續費與交易稅。<br>
    • <strong>最高買回</strong>：以最低賣出後損益兩平的最高買回價。<br>
    • 手續費最低收費 20 元，低價股實際成本較高，試算僅供參考。
  </div>

</div>

<footer>本試算僅供參考，不構成投資建議。</footer>

<!-- ══════════════════════════════════════
     SLIDE PANEL — full screen, opened via +
     Order (top→bottom):
       header · results-scroll · display · numpad
══════════════════════════════════════ -->
<div class="tb-panel" id="tbPanel">

  <!-- 1. Header: title + close -->
  <div class="tb-panel-head">
    <span class="tb-panel-title">股票買賣成本試算</span>
    <button class="tb-close" id="tbClose">✕ 收合</button>
  </div>

  <!-- 2. Results area — grows/shrinks, scrolls; display & numpad never move -->
  <div class="results-scroll" id="resultsScroll">
    <div class="results-placeholder" id="resultsPlaceholder">選擇觀點後輸入價格</div>
    <div class="result-grid" id="calcResult"></div>
  </div>

  <!-- 3. Display — fixed, directly above numpad -->
  <div class="calc-display">
    <span class="display-label" id="displayLabel">請選擇觀點</span>
    <span class="display-val empty" id="displayVal">0</span>
    <span class="display-unit">元</span>
  </div>

  <!-- 4. Numpad — always at bottom, never moves -->
  <div class="numpad-wrap">
    <div class="numpad-layout">
      <!-- Buy / Sell buttons stacked vertically on the left -->
      <div class="persp-col">
        <button class="persp-btn" data-mode="buy">買入</button>
        <button class="persp-btn" data-mode="sell">賣出</button>
      </div>
      <!-- Numpad grid -->
      <div class="numpad disabled" id="numpad">
        <button class="num-btn" data-d="7">7</button>
        <button class="num-btn" data-d="8">8</button>
        <button class="num-btn" data-d="9">9</button>
        <button class="num-btn" data-d="4">4</button>
        <button class="num-btn" data-d="5">5</button>
        <button class="num-btn" data-d="6">6</button>
        <button class="num-btn" data-d="1">1</button>
        <button class="num-btn" data-d="2">2</button>
        <button class="num-btn" data-d="3">3</button>
        <button class="num-btn" data-d=".">．</button>
        <button class="num-btn" data-d="0">0</button>
        <button class="num-btn action" data-action="back">⌫</button>
        <button class="num-btn clear" data-action="clear">清除</button>
        <button class="num-btn save save-off" id="saveBtn" data-action="save">存入快查</button>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  /* ── Constants ── */
  const BUY_FEE  = 0.001425;
  const SELL_FEE = 0.001425;
  const SELL_TAX = 0.003;
  const TOTAL    = BUY_FEE + SELL_FEE + SELL_TAX;

  const DEFAULT_PRICES = [
    25, 30, 40,
    50, 60, 75, 80,
    100, 120, 150, 200, 250, 300, 400,
    500, 600, 700, 800,
    1000, 1200, 1500, 2000, 2290, 3000, 5000
  ];

  const STORAGE_KEY = 'stockprice_v2_items';

  /* ── Tick helpers ── */
  function tickOf(p) {
    if (p <   10) return 0.01;
    if (p <   50) return 0.1;
    if (p <  100) return 0.5;
    if (p <  500) return 1;
    if (p < 1000) return 5;
    return 10;
  }
  function decimals(t) { return t >= 1 ? 0 : t.toString().split('.')[1].length; }
  function fmt(v, t)   { return v.toFixed(decimals(t)); }
  function ceilTick(v, t)  { return Math.ceil(Math.round(v / t * 1e8) / 1e8) * t; }
  function floorTick(v, t) { return Math.floor(Math.round(v / t * 1e8) / 1e8) * t; }

  /* ── Core calculations ── */
  function calcBuy(buy) {
    const tick        = tickOf(buy);
    const theoretical = buy * TOTAL;
    const spread      = ceilTick(theoretical, tick);
    const minSell     = buy + spread;
    const exactBB     = minSell * (1 - SELL_FEE - SELL_TAX) / (1 + BUY_FEE);
    const maxBB       = floorTick(exactBB, tickOf(exactBB));
    const exactSave   = buy * (1 - SELL_FEE - SELL_TAX) / (1 + BUY_FEE);
    const maxSave     = floorTick(exactSave, tickOf(exactSave));
    return { buy, tick, theoretical, spread, minSell,
             maxBB, tickBB: tickOf(exactBB), maxSave, tickSave: tickOf(exactSave) };
  }

  function calcSell(sell) {
    const tick        = tickOf(sell);
    const fees        = sell * (SELL_FEE + SELL_TAX);
    const netProceeds = sell * (1 - SELL_FEE - SELL_TAX);
    const exactThresh = netProceeds / (1 + BUY_FEE);
    const threshold   = floorTick(exactThresh, tickOf(exactThresh));
    const drop        = sell - threshold;
    const dropTicks   = Math.round(drop / tick);
    return { sell, tick, fees, netProceeds, threshold, tickThresh: tickOf(exactThresh), drop, dropTicks };
  }

  /* ── Table state ── */
  let tableItems = loadItems();

  function loadItems() {
    try {
      const s = localStorage.getItem(STORAGE_KEY);
      if (s) return JSON.parse(s);
    } catch {}
    return [...DEFAULT_PRICES];
  }

  function saveItems() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tableItems)); } catch {}
  }

  function isInTable(p) { return tableItems.includes(p); }

  function addItem(price) {
    if (isInTable(price)) return;
    tableItems = [...tableItems, price].sort((a, b) => a - b);
    saveItems();
    rebuildTableRows();
    refreshSaveBtn();
    refreshDynRow();
  }

  function deleteItem(price) {
    if (!confirm(`確定移除 ${price} 元？`)) return;
    tableItems = tableItems.filter(p => p !== price);
    saveItems();
    const row = document.querySelector(`tr[data-price="${price}"]`);
    if (row) row.remove();
    refreshSaveBtn();
    refreshDynRow();
  }

  function resetDefaults() {
    tableItems = [...DEFAULT_PRICES];
    saveItems();
    rebuildTableRows();
    refreshSaveBtn();
    refreshDynRow();
  }

  /* ── Table rendering ── */
  function makeStaticRow(price) {
    const r  = calcBuy(price);
    const tr = document.createElement('tr');
    tr.dataset.price = price;
    tr.innerHTML = `
      <td>${price}</td>
      <td class="td-tick">${r.tick}</td>
      <td class="td-spread">${r.theoretical.toFixed(2)} → <strong>${fmt(r.spread, r.tick)}</strong></td>
      <td class="td-range"><span class="td-sell">${fmt(r.minSell, r.tick)}</span><br><span class="td-bb">${fmt(r.maxBB, r.tickBB)}</span></td>
      <td class="td-del">
        <button class="del-btn" data-price="${price}" title="移除">✕</button>
      </td>
    `;
    return tr;
  }

  function rebuildTableRows() {
    const tbody = document.getElementById('refBody');
    [...tbody.querySelectorAll('tr[data-price]')].forEach(r => r.remove());
    tableItems.forEach(price => tbody.appendChild(makeStaticRow(price)));
  }

  /* ── Input state ── */
  let mode  = null;
  let input = '';

  function getPrice() {
    const v = parseFloat(input);
    return isFinite(v) && v > 0 ? v : null;
  }

  function pressDigit(d) {
    if (!mode) return;
    if (d === '.') {
      if (input.includes('.')) return;
      input = (input || '0') + '.';
    } else {
      const [intPart, decPart] = input.split('.');
      if (decPart !== undefined) {
        if (decPart.length >= 2) return;
      } else {
        if ((intPart || '').length >= 5) return;
        if (intPart === '0') { input = d; refresh(); return; }
      }
      input += d;
    }
    refresh();
  }

  function pressBack()  { if (mode) { input = input.slice(0, -1); refresh(); } }
  function pressClear() { if (mode) { input = ''; refresh(); } }

  /* ── Refresh UI ── */
  function refresh() {
    refreshDisplay();
    refreshResults();
    refreshDynRow();
    refreshSaveBtn();
    refreshNumpad();
  }

  function refreshNumpad() {
    document.getElementById('numpad').classList.toggle('disabled', !mode);
  }

  function refreshSaveBtn() {
    const btn   = document.getElementById('saveBtn');
    const price = getPrice();
    btn.classList.remove('in-table', 'save-off');
    if (!mode || !price) {
      btn.textContent = '存入快查';
      btn.classList.add('save-off');
      return;
    }
    const savePrice = mode === 'buy' ? price : calcSell(price).threshold;
    const inTable   = isInTable(savePrice);
    btn.textContent = inTable ? '✓ 已存入' : '存入快查';
    if (inTable) btn.classList.add('in-table');
  }

  function refreshDisplay() {
    const labelEl = document.getElementById('displayLabel');
    const valEl   = document.getElementById('displayVal');
    if (!mode) {
      labelEl.textContent = '請選擇觀點';
      valEl.textContent   = '0';
      valEl.classList.add('empty');
    } else {
      labelEl.textContent = mode === 'buy' ? '買入價' : '賣出價';
      valEl.textContent   = input || '0';
      valEl.classList.toggle('empty', !input);
    }
  }

  function refreshResults() {
    const box         = document.getElementById('calcResult');
    const placeholder = document.getElementById('resultsPlaceholder');
    const price       = getPrice();

    if (!mode || !price) {
      box.innerHTML = '';
      placeholder.classList.remove('hidden');
      return;
    }
    placeholder.classList.add('hidden');

    if (mode === 'buy') {
      const r = calcBuy(price);
      box.className = 'result-grid result-grid-buy';
      box.innerHTML = `
        <div class="r-box sell">
          <div class="r-label">最低賣出價</div>
          <div class="r-val">${fmt(r.minSell, r.tick)}</div>
          <div class="r-sub">+${fmt(r.spread, r.tick)} 元</div>
        </div>
        <div class="r-box buyback">
          <div class="r-label">最高買回</div>
          <div class="r-val">${fmt(r.maxBB, r.tickBB)}</div>
          <div class="r-sub">損益兩平</div>
        </div>
        <div class="r-box save">
          <div class="r-label">省錢回補上限</div>
          <div class="r-val">${fmt(r.maxSave, r.tickSave)}</div>
          <div class="r-sub">低於此值才省</div>
        </div>
      `;
    } else {
      const r = calcSell(price);
      box.innerHTML = `
        <div class="r-box neutral">
          <div class="r-label">到手金額（估）</div>
          <div class="r-val">${r.netProceeds.toFixed(2)}</div>
          <div class="r-sub">${price} × ${((1-SELL_FEE-SELL_TAX)*100).toFixed(4)}%</div>
        </div>
        <div class="r-box neutral">
          <div class="r-label">手續費 + 稅（估）</div>
          <div class="r-val">${r.fees.toFixed(2)}</div>
          <div class="r-sub">${price} × ${((SELL_FEE+SELL_TAX)*100).toFixed(4)}%</div>
        </div>
        <div class="r-box save">
          <div class="r-label">省錢回補上限</div>
          <div class="r-val">${fmt(r.threshold, r.tickThresh)}</div>
          <div class="r-sub">低於此價買回才省</div>
        </div>
      `;
    }
  }

  function refreshDynRow() {
    const dynRow = document.getElementById('dynRow');
    const price  = getPrice();
    if (mode !== 'buy' || !price) { dynRow.classList.add('hidden'); return; }
    const r       = calcBuy(price);
    const inTable = isInTable(price);
    dynRow.classList.remove('hidden');
    dynRow.innerHTML = `
      <td><span class="dyn-label">試算</span>${fmt(price, r.tick)}</td>
      <td class="td-tick">${r.tick}</td>
      <td class="td-spread">${r.theoretical.toFixed(2)} → <strong>${fmt(r.spread, r.tick)}</strong></td>
      <td class="td-range"><span class="td-sell">${fmt(r.minSell, r.tick)}</span><br><span class="td-bb">${fmt(r.maxBB, r.tickBB)}</span></td>
      <td class="td-del">
        <button class="add-here-btn${inTable ? ' in-table' : ''}" id="addHereBtn">
          ${inTable ? '✓' : '存入快查'}
        </button>
      </td>
    `;
    if (!inTable) {
      document.getElementById('addHereBtn').addEventListener('click', () => addItem(price));
    }
  }

  /* ── Panel open / close ── */
  let isOpen = false;

  function openPanel() {
    isOpen = true;
    document.getElementById('tbPanel').classList.add('open');
  }

  function closePanel() {
    isOpen = false;
    document.getElementById('tbPanel').classList.remove('open');
  }

  /* ── Event listeners ── */
  document.getElementById('addPanelBtn').addEventListener('click', e => {
    e.stopPropagation();
    openPanel();
  });
  document.getElementById('tbClose').addEventListener('click', e => {
    e.stopPropagation();
    closePanel();
  });

  document.querySelectorAll('.persp-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const newMode = btn.dataset.mode;
      document.querySelectorAll('.persp-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = newMode;
      if (!isOpen) openPanel();
      refresh();
    });
  });

  document.getElementById('numpad').addEventListener('click', e => {
    const btn = e.target.closest('.num-btn');
    if (!btn) return;
    if (btn.dataset.d !== undefined) pressDigit(btn.dataset.d === '．' ? '.' : btn.dataset.d);
    else if (btn.dataset.action === 'back')  pressBack();
    else if (btn.dataset.action === 'clear') pressClear();
    else if (btn.dataset.action === 'save') {
      const price = getPrice();
      if (price && mode) {
        const savePrice = mode === 'buy' ? price : calcSell(price).threshold;
        addItem(savePrice);
      }
    }
  });

  document.getElementById('refBody').addEventListener('click', e => {
    const delBtn = e.target.closest('.del-btn');
    if (delBtn) deleteItem(parseFloat(delBtn.dataset.price));
  });

  /* ── ⋯ Menu ── */
  let showTick = false;

  function toggleTick() {
    showTick = !showTick;
    document.getElementById('refTable').classList.toggle('hide-tick', !showTick);
    document.getElementById('menuToggleTick').textContent = (showTick ? '☑' : '☐') + ' 顯示升降單位';
  }

  document.getElementById('menuTrigger').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('menuDropdown').classList.toggle('hidden');
  });
  document.getElementById('menuToggleTick').addEventListener('click', e => {
    e.stopPropagation();
    toggleTick();
    document.getElementById('menuDropdown').classList.add('hidden');
  });
  document.getElementById('menuReset').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('menuDropdown').classList.add('hidden');
    if (confirm('還原為預設的快查表項目？')) resetDefaults();
  });
  document.addEventListener('click', () => {
    document.getElementById('menuDropdown').classList.add('hidden');
  });

  /* ── Init ── */
  rebuildTableRows();
  refresh();
})();
</script>
</body>
</html>
