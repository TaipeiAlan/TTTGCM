<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票損益追蹤</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Prevent the page itself from scrolling horizontally on mobile.
       overflow-x: clip (unlike hidden) does not create a new stacking
       context, so position:sticky on child elements keeps working. */
    html { overflow-x: clip; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
      min-height: 100vh;
      overflow-x: hidden; /* belt-and-suspenders for older Safari */
      width: 100%;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e4e4e4;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .last-refresh {
      font-size: 12px;
      color: #999;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:active { opacity: 0.7; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: #2563eb; color: #fff; }
    .btn-ghost { background: #f0f2f5; color: #444; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

    /* Add form card */
    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e4e4e4;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #555;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: #666;
    }

    .form-group input {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    .form-group input:focus { border-color: #2563eb; }

    .fg-symbol { min-width: 110px; }
    .fg-price  { min-width: 120px; }
    .fg-qty    { min-width: 100px; }
    .fg-note   { min-width: 140px; flex: 1; }

    /* Holdings table */
    .holdings-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e4e4e4;
      overflow: hidden;
    }

    .holdings-header {
      padding: 14px 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .holdings-header .card-title { margin-bottom: 0; }

    /* Horizontal scroll wrapper — allows table to scroll on mobile */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      width: 100%;       /* must not exceed parent width */
      max-width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px; /* ensure horizontal scroll kicks in before layout breaks */
    }

    thead th {
      padding: 10px 14px;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      background: #fafafa;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }
    thead th:first-child { text-align: left; }

    tbody tr {
      transition: background 0.1s;
    }

    td {
      padding: 12px 14px;
      font-size: 14px;
      text-align: right;
      vertical-align: top;
    }
    td:first-child { text-align: left; }

    /* Frozen first 2 data columns */
    .col-buy { position: sticky; left: 0;   width: 80px; min-width: 80px; }
    .col-cur { position: sticky; left: 80px; width: 80px; min-width: 80px; border-right: 1px solid #e8e8e8; }

    thead .col-buy, thead .col-cur { background: #fafafa; z-index: 2; }
    tbody td.col-buy, tbody td.col-cur { background: #fff; z-index: 1; }

    /* Per-stock group: hover lights up both rows, border separates groups */
    tbody.stock-group { border-top: 1px solid #f0f0f0; }
    tbody.stock-group:first-of-type { border-top: none; }
    tbody.stock-group:hover td.col-buy,
    tbody.stock-group:hover td.col-cur { background: #fafafe !important; }
    .edit-row td { background: #eff6ff !important; }

    /* P&L column — hidden by default */
    table.hide-pnl .col-pnl { display: none; }

    /* Name row (spans full width) — sticky on horizontal scroll */
    .stock-name-row > td {
      position: sticky;
      left: 0;
      z-index: 3;
      background: #fff;
      padding: 10px 14px 3px;
      text-align: left;
    }
    tbody.stock-group:first-of-type .stock-name-row > td { border-top: none; }
    .name-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .name-info {
      display: flex;
      align-items: baseline;
      gap: 5px;
      overflow: hidden;
      min-width: 0;
    }
    .stock-symbol {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .stock-name {
      font-size: 11px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
    }
    .stock-note {
      font-size: 11px;
      color: #bbb;
      margin-top: 3px;
    }

    /* Timestamp — the important bit */
    .timestamp {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ts-fresh  { color: #10b981; }
    .ts-old    { color: #f59e0b; }
    .ts-stale  { color: #ef4444; }
    .ts-never  { color: #ccc; }
    .ts-error  { color: #ef4444; font-weight: 600; }

    /* Data row */
    .stock-data-row > td { padding: 2px 14px 10px; }

    .price-cell { font-variant-numeric: tabular-nums; }
    .price-change { font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.5; }

    .loading-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #2563eb;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .gain  { color: #16a34a; }
    .loss  { color: #dc2626; }
    .zero  { color: #888; }

    .pct-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
    }
    .pct-gain { background: #dcfce7; color: #16a34a; }
    .pct-loss { background: #fee2e2; color: #dc2626; }
    .pct-zero { background: #f3f4f6; color: #6b7280; }

    .actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }
    .actions .btn { white-space: nowrap; }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #bbb;
      font-size: 14px;
    }

    /* Edit inline form */
    .edit-row td {
      background: #eff6ff;
      padding: 10px 14px;
    }

    @media (max-width: 600px) {
      .form-row { flex-direction: column; }
      .fg-symbol, .fg-price, .fg-qty, .fg-note { min-width: unset; width: 100%; }
.header-right { gap: 6px; }
      .header-right .btn { padding: 6px 10px; font-size: 13px; }
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex;align-items:baseline;gap:8px">
    <h1>📈 股票損益追蹤</h1>
    <span id="versionBadge" style="font-size:11px;color:#bbb;font-weight:500;letter-spacing:0.3px"></span>
  </div>
  <div class="header-right">
    <span class="last-refresh" id="globalRefreshTime"></span>
    <button class="btn btn-ghost" onclick="toggleAddForm()">＋ 新增持股</button>
    <button class="btn btn-primary" id="forceRefreshBtn" onclick="forceRefreshAll()" title="不論資料新舊，全部重新抓取">更新全部</button>
  </div>
</header>

<div class="container">

  <!-- Add form -->
  <div class="card" id="addFormCard" style="display:none">
    <div class="card-title">新增持股</div>
    <div class="form-row">
      <div class="form-group fg-symbol">
        <label>股票代號</label>
        <input type="text" id="inp-symbol" placeholder="AAPL / 2330" autocomplete="off" autocapitalize="characters">
      </div>
      <div class="form-group fg-price">
        <label>買入價格</label>
        <input type="number" id="inp-buy" placeholder="150.00" step="0.01" min="0">
      </div>
      <div class="form-group fg-qty">
        <label>股數（選填）</label>
        <input type="number" id="inp-qty" placeholder="100" step="1" min="0">
      </div>
      <div class="form-group fg-note">
        <label>備註（選填）</label>
        <input type="text" id="inp-note" placeholder="例：長期持有">
      </div>
      <button class="btn btn-primary" onclick="addStock()" style="margin-bottom:1px">新增</button>
    </div>
    <div id="add-error" style="color:#dc2626;font-size:12px;margin-top:8px;display:none"></div>
    <div style="margin-top:10px;font-size:12px;color:#aaa;">
      台股輸入純數字代號（如 2330），美股輸入英文代號（如 AAPL）。資料來源：Yahoo Finance。
    </div>
  </div>

  <!-- Summary bar removed -->

  <!-- Holdings -->
  <div class="holdings-card">
    <div class="holdings-header">
      <div class="card-title" style="margin:0">持股清單</div>
      <button class="btn btn-ghost btn-sm" id="pnlToggleBtn" onclick="togglePnlCol()">顯示損益金額</button>
    </div>
    <div id="holdingsContainer">
      <div class="empty-state">尚未新增任何持股</div>
    </div>
  </div>

</div>

<script>
// ─── Version ──────────────────────────────────────────────────────────────────

const VERSION = '1.0.12';
document.getElementById('versionBadge').textContent = 'v' + VERSION;

// ─── Storage ──────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'stock_portfolio_v1';

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function save(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let portfolio = load();

// ─── Yahoo Finance ────────────────────────────────────────────────────────────

function toYahooSymbol(symbol) {
  const s = symbol.trim();
  // Pure digits → Taiwan stock
  if (/^\d+$/.test(s)) return s + '.TW';
  return s.toUpperCase();
}

async function fetchPrice(symbol) {
  const ys = toYahooSymbol(symbol);
  const direct = `https://query1.finance.yahoo.com/v8/finance/chart/${ys}?interval=1d&range=1d`;
  const urls = [
    direct,
    `https://query2.finance.yahoo.com/v8/finance/chart/${ys}?interval=1d&range=1d`,
    `https://corsproxy.io/?url=${encodeURIComponent(direct)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(direct)}`,
  ];
  let lastErr;
  for (const url of urls) {
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const result = json?.chart?.result?.[0];
      if (!result) throw new Error('無資料');
      return {
        price:    result.meta.regularMarketPrice,
        currency: result.meta.currency || '',
        name:     result.meta.longName || result.meta.shortName || symbol,
      };
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('抓取失敗');
}

// ─── ID ───────────────────────────────────────────────────────────────────────

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// ─── Time display ─────────────────────────────────────────────────────────────

function fmtTime(isoStr) {
  if (!isoStr) return null;
  const d = new Date(isoStr);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = diffMs / 60000;

  const pad = n => String(n).padStart(2, '0');
  const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

  // Different day: show date
  const isToday = d.toDateString() === now.toDateString();
  const label = isToday
    ? timeStr
    : `${d.getMonth()+1}/${d.getDate()} ${timeStr}`;

  return { label, diffMin };
}

function timestampHtml(isoStr, errMsg, inline = false) {
  const tag = inline ? 'span' : 'div';
  if (errMsg) {
    return `<${tag} class="timestamp ts-error">⚠ ${errMsg}</${tag}>`;
  }
  if (!isoStr) {
    return `<${tag} class="timestamp ts-never">—</${tag}>`;
  }
  const { label, diffMin } = fmtTime(isoStr);
  let cls = 'ts-fresh';
  let icon = '●';
  if (diffMin > 120) { cls = 'ts-stale'; icon = '●'; }
  else if (diffMin > 30) { cls = 'ts-old'; icon = '●'; }

  return `<${tag} class="timestamp ${cls}" title="更新時間：${label}">${icon} ${label}</${tag}>`;
}

// ─── Number formatting ────────────────────────────────────────────────────────

function fmtNum(n, decimals = 2) {
  if (n == null || isNaN(n)) return '—';
  return n.toLocaleString('zh-TW', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function pctHtml(pct) {
  if (pct == null || isNaN(pct)) return '<span class="pct-badge pct-zero">—</span>';
  const sign = pct > 0 ? '+' : '';
  const cls = pct > 0 ? 'pct-gain' : pct < 0 ? 'pct-loss' : 'pct-zero';
  return `<span class="pct-badge ${cls}">${sign}${fmtNum(pct)}%</span>`;
}

function pnlClass(v) {
  if (v == null || isNaN(v)) return 'zero';
  return v > 0 ? 'gain' : v < 0 ? 'loss' : 'zero';
}

// ─── Render ───────────────────────────────────────────────────────────────────

function render() {
  const container = document.getElementById('holdingsContainer');

  if (portfolio.length === 0) {
    container.innerHTML = '<div class="empty-state">尚未新增任何持股</div>';
    return;
  }

  // Table
  const pnlHidden = !(document.getElementById('pnlToggleBtn')?.dataset.show === '1');

  const groups = portfolio.map(s => {
    const diff    = s.currentPrice != null ? s.currentPrice - s.buyPrice : null;
    const diffPct = diff != null ? (diff / s.buyPrice) * 100 : null;

    // ── Name row ──────────────────────────────────────────────────────────────
    const nameSpan = s.fetchedName
      ? `<span class="stock-name">${escHtml(s.fetchedName)}</span>` : '';
    const tsSpan = s.loading
      ? '<span class="timestamp ts-never">…</span>'
      : timestampHtml(s.lastUpdated, s.fetchError, true);
    const noteDiv = s.note
      ? `<div class="stock-note">${escHtml(s.note)}</div>` : '';

    const nameRow = `<tr class="stock-name-row">
      <td colspan="99">
        <div class="name-info">
          <span class="stock-symbol">${escHtml(s.symbol.toUpperCase())}</span>
          ${nameSpan}
          ${tsSpan}
        </div>
        ${noteDiv}
      </td>
    </tr>`;

    // ── Data row ──────────────────────────────────────────────────────────────
    const sign   = diff != null ? (diff >= 0 ? '+' : '') : '';
    const chgCls = diff != null ? (diff > 0 ? 'gain' : diff < 0 ? 'loss' : 'zero') : 'zero';

    const curPriceStr = s.loading
      ? '<span class="loading-dot"></span>'
      : s.currentPrice != null ? fmtNum(s.currentPrice) : '—';
    const chgAmtStr  = diff != null ? `<span class="${chgCls}">${sign}${fmtNum(diff)}</span>` : '—';
    const chgPctStr  = diffPct != null ? `<span class="${chgCls}">(${sign}${fmtNum(diffPct)}%)</span>` : '—';

    let pnlAmtStr = '—';
    if (s.qty > 0 && diff != null) {
      const pnlAmt = diff * s.qty;
      const psign = pnlAmt >= 0 ? '+' : '';
      pnlAmtStr = `<span class="${pnlClass(pnlAmt)}">${psign}${fmtNum(pnlAmt)}</span>`;
    }

    const dataRow = `<tr class="stock-data-row">
      <td class="col-buy price-cell">${fmtNum(s.buyPrice)}</td>
      <td class="col-cur price-cell">${curPriceStr}</td>
      <td class="price-cell">${chgAmtStr}</td>
      <td class="price-cell">${chgPctStr}</td>
      <td class="col-pnl">${pnlAmtStr}</td>
      <td>
        <div class="actions">
          <button class="btn btn-ghost btn-sm" onclick="fetchAndUpdate('${s.id}')">更新</button>
          <button class="btn btn-ghost btn-sm" onclick="startEdit('${s.id}')">編輯</button>
          <button class="btn btn-danger btn-sm" onclick="deleteStock('${s.id}')">刪除</button>
        </div>
      </td>
    </tr>`;

    return `<tbody class="stock-group" data-stock-id="${s.id}">${nameRow}${dataRow}</tbody>`;
  }).join('');

  const tableClass = pnlHidden ? 'hide-pnl' : '';
  container.innerHTML = `
    <div class="table-wrapper">
      <table class="${tableClass}">
        <thead>
          <tr>
            <th class="col-buy">買入價</th>
            <th class="col-cur">現價</th>
            <th>漲跌</th>
            <th></th>
            <th class="col-pnl">損益金額</th>
            <th></th>
          </tr>
        </thead>
        ${groups}
      </table>
    </div>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─── CRUD ─────────────────────────────────────────────────────────────────────

function addStock() {
  const symbol   = document.getElementById('inp-symbol').value.trim();
  const buyPrice = parseFloat(document.getElementById('inp-buy').value);
  const qty      = parseFloat(document.getElementById('inp-qty').value) || 0;
  const note     = document.getElementById('inp-note').value.trim();

  const errEl = document.getElementById('add-error');

  if (!symbol) { showErr(errEl, '請輸入股票代號'); return; }
  if (isNaN(buyPrice) || buyPrice <= 0) { showErr(errEl, '請輸入有效的買入價格'); return; }
  errEl.style.display = 'none';

  const entry = { id: uid(), symbol, buyPrice, qty, note, currentPrice: null, fetchedName: '', currency: '', lastUpdated: null, fetchError: null };
  portfolio.push(entry);
  save(portfolio);

  document.getElementById('inp-symbol').value = '';
  document.getElementById('inp-buy').value = '';
  document.getElementById('inp-qty').value = '';
  document.getElementById('inp-note').value = '';
  toggleAddForm(false);

  render();
  fetchAndUpdate(entry.id);
}

function showErr(el, msg) {
  el.textContent = msg;
  el.style.display = 'block';
}

function deleteStock(id) {
  portfolio = portfolio.filter(s => s.id !== id);
  save(portfolio);
  render();
}

// ─── Edit inline ──────────────────────────────────────────────────────────────

function startEdit(id) {
  const s = portfolio.find(p => p.id === id);
  if (!s) return;

  const container = document.getElementById('holdingsContainer');

  closeAllEdits();

  const editRow = document.createElement('tr');
  editRow.className = 'edit-row';
  editRow.dataset.editId = id;
  editRow.innerHTML = `
    <td colspan="99">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:4px 0">
        <div class="form-group" style="min-width:100px">
          <label>代號</label>
          <input type="text" id="edit-symbol-${id}" value="${escHtml(s.symbol)}" style="width:100%">
        </div>
        <div class="form-group" style="min-width:110px">
          <label>買入價格</label>
          <input type="number" id="edit-buy-${id}" value="${s.buyPrice}" step="0.01" min="0" style="width:100%">
        </div>
        <div class="form-group" style="min-width:100px">
          <label>股數</label>
          <input type="number" id="edit-qty-${id}" value="${s.qty || ''}" step="1" min="0" style="width:100%">
        </div>
        <div class="form-group" style="flex:1;min-width:130px">
          <label>備註</label>
          <input type="text" id="edit-note-${id}" value="${escHtml(s.note || '')}" style="width:100%">
        </div>
        <button class="btn btn-primary btn-sm" onclick="saveEdit('${id}')">儲存</button>
        <button class="btn btn-ghost btn-sm" onclick="closeAllEdits()">取消</button>
      </div>
    </td>`;

  const targetRow = container.querySelector(`tbody.stock-group[data-stock-id="${id}"] tr.stock-data-row`);
  if (targetRow) targetRow.after(editRow);
}

function closeAllEdits() {
  document.querySelectorAll('.edit-row').forEach(r => r.remove());
}

function saveEdit(id) {
  const symbol   = document.getElementById(`edit-symbol-${id}`)?.value.trim();
  const buyPrice = parseFloat(document.getElementById(`edit-buy-${id}`)?.value);
  const qty      = parseFloat(document.getElementById(`edit-qty-${id}`)?.value) || 0;
  const note     = document.getElementById(`edit-note-${id}`)?.value.trim() || '';

  if (!symbol || isNaN(buyPrice) || buyPrice <= 0) return;

  const s = portfolio.find(p => p.id === id);
  if (!s) return;

  const symbolChanged = s.symbol !== symbol;
  s.symbol = symbol; s.buyPrice = buyPrice; s.qty = qty; s.note = note;
  if (symbolChanged) { s.currentPrice = null; s.fetchedName = ''; s.lastUpdated = null; s.fetchError = null; }

  save(portfolio);
  render();
  if (symbolChanged) fetchAndUpdate(id);
}

// ─── Fetch & refresh ──────────────────────────────────────────────────────────

async function fetchAndUpdate(id) {
  const s = portfolio.find(p => p.id === id);
  if (!s) return;

  s.loading = true;
  s.fetchError = null;
  render();

  try {
    const { price, currency, name } = await fetchPrice(s.symbol);
    s.currentPrice = price;
    s.currency     = currency;
    s.fetchedName  = name;
    s.lastUpdated  = new Date().toISOString();
    s.fetchError   = null;
  } catch (e) {
    s.fetchError  = e.message || '抓取失敗';
    s.lastUpdated = new Date().toISOString(); // Still record the attempt time
  } finally {
    s.loading = false;
    save(portfolio);
    render();
  }
}

const FRESH_MS = 5 * 60 * 1000; // 5 minutes

function isStale(s) {
  if (!s.lastUpdated || s.fetchError) return true;
  return (Date.now() - new Date(s.lastUpdated)) > FRESH_MS;
}

async function refreshAll() {
  const btn = document.getElementById('refreshAllBtn');
  btn.disabled = true;
  btn.textContent = '整理中…';

  const stale = portfolio.filter(isStale);
  const skipped = portfolio.length - stale.length;
  await Promise.allSettled(stale.map(s => fetchAndUpdate(s.id)));

  btn.disabled = false;
  btn.textContent = '重新整理';

  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const time = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const note = skipped > 0 ? `（略過 ${skipped} 筆新資料）` : '';
  document.getElementById('globalRefreshTime').textContent = `${time}${note}`;
}

async function forceRefreshAll() {
  const btn = document.getElementById('forceRefreshBtn');
  btn.disabled = true;
  btn.textContent = '更新中…';

  await Promise.allSettled(portfolio.map(s => fetchAndUpdate(s.id)));

  btn.disabled = false;
  btn.textContent = '更新全部';

  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('globalRefreshTime').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

// ─── P&L column toggle ────────────────────────────────────────────────────────

function togglePnlCol() {
  const btn = document.getElementById('pnlToggleBtn');
  const showing = btn.dataset.show === '1';
  btn.dataset.show = showing ? '0' : '1';
  btn.textContent  = showing ? '顯示損益金額' : '隱藏損益金額';
  // Re-render to apply the table class
  render();
}

// ─── Add form toggle ──────────────────────────────────────────────────────────

function toggleAddForm(forceOpen) {
  const card = document.getElementById('addFormCard');
  const isHidden = card.style.display === 'none';
  card.style.display = (forceOpen ?? isHidden) ? 'block' : 'none';
  if (card.style.display !== 'none') {
    document.getElementById('inp-symbol').focus();
  }
}

// ─── Keyboard shortcut ────────────────────────────────────────────────────────

document.getElementById('inp-note').addEventListener('keydown', e => {
  if (e.key === 'Enter') addStock();
});

// ─── Init ─────────────────────────────────────────────────────────────────────

render();

// On load: only fetch stocks without fresh data (currentPrice already saved in localStorage)
if (portfolio.length > 0) {
  const needsFetch = portfolio.filter(isStale);
  if (needsFetch.length > 0) {
    Promise.allSettled(needsFetch.map(s => fetchAndUpdate(s.id)));
  }
}
</script>
