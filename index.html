<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票損益追蹤</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Full-viewport layout: only tbody scrolls, nothing else */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #111827;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1f2937;
      border-bottom: 1px solid #374151;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #f9fafb;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .last-refresh {
      font-size: 12px;
      color: #9ca3af;
    }

    #versionBadge { color: #6b7280 !important; }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:active { opacity: 0.7; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: #2563eb; color: #fff; }
    .btn-ghost { background: #f0f2f5; color: #444; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 10px 0;
      flex: 1;
      min-height: 0;        /* allow flex child to shrink below content size */
      display: flex;
      flex-direction: column;
    }

    /* Hamburger menu */
    .menu-wrapper { position: relative; }
    .menu-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: #fff;
      border: 1px solid #e4e4e4;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      min-width: 148px;
      z-index: 200;
      overflow: hidden;
    }
    .menu-dropdown.open { display: block; }
    .menu-item {
      padding: 11px 16px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }
    .menu-item:hover { background: #f5f5f5; }
    .menu-item + .menu-item { border-top: 1px solid #f0f0f0; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: #666;
    }

    .form-group input {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    .form-group input:focus { border-color: #2563eb; }

    /* Add stock popup */
    .add-modal {
      max-width: 360px;
      max-height: 50dvh;
      max-height: 50vh;
    }
    .add-modal .modal-body {
      padding: 14px 18px;
      overflow: visible;
    }
    .add-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 14px;
    }
    .symbol-preview {
      font-size: 11px;
      margin-top: 3px;
      min-height: 14px;
      color: #888;
    }

    /* Prevent iOS Safari auto-zoom on input focus (triggered when font-size < 16px) */
    .modal-overlay input { font-size: 16px; }

    /* Holdings table — fills remaining vertical space */
    .holdings-card {
      background: #f3f4f6;
      border-radius: 12px;
      border: 1px solid #e4e4e4;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-bottom: 12px;
    }

    /* Bridge the flex chain through the JS-injected container */
    #holdingsContainer {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Scroll container: both axes, only this scrolls */
    .table-wrapper {
      flex: 1;
      min-height: 0;
      overflow-y: scroll;   /* always-visible scrollbar hints remaining content */
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-wrapper::-webkit-scrollbar-track { background: #e2e5e9; border-radius: 3px; }
    .table-wrapper::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 3px; }
    .table-wrapper::-webkit-scrollbar-thumb:hover { background: #6b7280; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px; /* ensure horizontal scroll kicks in before layout breaks */
    }

    thead th {
      padding: 10px 14px;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      background: #e8eaed;
      border-bottom: 1px solid #dde0e5;
      white-space: nowrap;
      /* Stick to top of .table-wrapper (the scroll container) */
      position: sticky;
      top: 0;
      z-index: 5;
    }
    thead th:first-child { text-align: left; }

    tbody tr {
      transition: background 0.1s;
    }

    td {
      padding: 12px 14px;
      font-size: 14px;
      text-align: right;
      vertical-align: top;
    }
    td:first-child { text-align: left; }

    /* Frozen first 2 data columns */
    .col-buy { position: sticky; left: 0;   width: 80px; min-width: 80px; }
    .col-cur { position: sticky; left: 80px; width: 80px; min-width: 80px; border-right: 1px solid #e8e8e8; }

    thead .col-buy, thead .col-cur { background: #e8eaed; z-index: 7; } /* sticky on both axes */
    tbody td.col-buy, tbody td.col-cur { background: #f3f4f6; z-index: 1; }

    /* Per-stock group: hover lights up both rows, border separates groups */
    tbody.stock-group { border-top: 1px solid #e4e6ea; }
    tbody.stock-group:first-of-type { border-top: none; }
    tbody.stock-group:hover td.col-buy,
    tbody.stock-group:hover td.col-cur { background: #eaecf0 !important; }
    .edit-row td { background: #eff6ff !important; }

    /* P&L column — hidden by default */
    table.hide-pnl .col-pnl { display: none; }

    /* Name row — td provides full-row background; inner div handles sticky */
    .stock-name-row > td {
      background: #f3f4f6;
      padding: 0;
      text-align: left;
    }
    tbody.stock-group:first-of-type .stock-name-row > td { border-top: none; }
    /* This inner div is what actually sticks horizontally */
    .name-sticky {
      position: sticky;
      left: 0;
      z-index: 3;
      padding: 10px 14px 3px;
      display: inline-flex;
      flex-direction: column;
      min-width: 0;
    }
    .name-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .name-info {
      display: flex;
      align-items: baseline;
      gap: 5px;
      overflow: hidden;
      min-width: 0;
    }
    .stock-symbol {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .stock-name {
      font-size: 11px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
    }
    .stock-note {
      font-size: 11px;
      color: #bbb;
      margin-top: 3px;
    }

    /* Timestamp — the important bit */
    .timestamp {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ts-fresh  { color: #10b981; }
    .ts-old    { color: #f59e0b; }
    .ts-stale  { color: #ef4444; }
    .ts-never  { color: #ccc; }
    .ts-error  { color: #ef4444; font-weight: 600; }

    /* Data row */
    .stock-data-row > td { padding: 2px 14px 10px; }

    .price-cell { font-variant-numeric: tabular-nums; }
    .price-change { font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.5; }

    .loading-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #2563eb;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .gain  { color: #16a34a; }
    .loss  { color: #dc2626; }
    .zero  { color: #888; }

    .pct-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
    }
    .pct-gain { background: #dcfce7; color: #16a34a; }
    .pct-loss { background: #fee2e2; color: #dc2626; }
    .pct-zero { background: #f3f4f6; color: #6b7280; }

    .actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }
    .actions .btn { white-space: nowrap; }

    /* ── Batch edit modal ─────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 580px;
      max-height: 85dvh;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 18px;
    }
    .modal-footer {
      padding: 12px 18px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    /* Each editable row */
    .batch-row {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #f5f5f5;
      transition: opacity 0.15s;
    }
    .batch-row:last-child { border-bottom: none; }
    .batch-row input {
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px; /* ≥16px prevents iOS Safari auto-zoom */
      outline: none;
      transition: border-color 0.15s;
    }
    .batch-row input:focus { border-color: #2563eb; }
    .b-sym  { width: 74px; flex-shrink: 0; text-transform: uppercase; }
    .b-buy  { width: 82px; flex-shrink: 0; }
    .b-qty  { width: 68px; flex-shrink: 0; }
    .b-note { flex: 1; min-width: 60px; }
    /* Pending-delete style */
    .batch-row.pending-delete { opacity: 0.35; }
    .batch-row.pending-delete input { text-decoration: line-through; }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #bbb;
      font-size: 14px;
    }

    /* Edit inline form */
    .edit-row td {
      background: #eff6ff;
      padding: 10px 14px;
    }

    .menu-divider { height: 1px; background: #f0f0f0; margin: 4px 0; }
    .menu-section-label {
      padding: 6px 16px 2px;
      font-size: 10px;
      color: #bbb;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .sort-item.active,
    .region-item.active { color: #2563eb; font-weight: 600; }

    @media (max-width: 600px) {
      .header-right { gap: 6px; }
      .header-right .btn { padding: 6px 10px; font-size: 13px; }
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex;align-items:baseline;gap:8px">
    <h1>📈 股票損益追蹤</h1>
    <span id="versionBadge" style="font-size:11px;color:#bbb;font-weight:500;letter-spacing:0.3px"></span>
  </div>
  <div class="header-right">
    <span class="last-refresh" id="globalRefreshTime"></span>
    <button class="btn btn-ghost" onclick="openAddModal()" title="新增持股" style="font-size:18px;line-height:1;padding:6px 12px">＋</button>
    <div class="menu-wrapper">
      <button class="btn btn-primary" id="menuBtn" onclick="toggleMenu()" style="font-size:17px;letter-spacing:1px;padding:7px 13px">≡</button>
      <div class="menu-dropdown" id="menuDropdown">
        <div class="menu-item" onclick="forceRefreshAll()">更新全部</div>
        <div class="menu-item" id="pnlMenuItem" onclick="togglePnlCol()">顯示損益金額</div>
        <div class="menu-item" onclick="openBatchEdit()">批次編輯清單</div>
        <div class="menu-divider"></div>
        <div class="menu-section-label">排序方式</div>
        <div class="menu-item sort-item active" data-sort="newest" onclick="setSort('newest')">加入時間（新→舊）</div>
        <div class="menu-item sort-item" data-sort="oldest" onclick="setSort('oldest')">加入時間（舊→新）</div>
        <div class="menu-item sort-item" data-sort="gain_desc" onclick="setSort('gain_desc')">漲跌幅（高→低）</div>
        <div class="menu-item sort-item" data-sort="gain_asc" onclick="setSort('gain_asc')">漲跌幅（低→高）</div>
        <div class="menu-item sort-item" data-sort="alpha" onclick="setSort('alpha')">名稱 A→Z</div>
        <div class="menu-item sort-item" data-sort="alpha_rev" onclick="setSort('alpha_rev')">名稱 Z→A</div>
        <div class="menu-divider"></div>
        <div class="menu-section-label">市場分組</div>
        <div class="menu-item region-item active" data-region="none" onclick="setRegion('none')">不區分</div>
        <div class="menu-item region-item" data-region="us_first" onclick="setRegion('us_first')">先美股</div>
        <div class="menu-item region-item" data-region="tw_first" onclick="setRegion('tw_first')">先台股</div>
      </div>
    </div>
  </div>
</header>

<div class="container">

  <!-- (add form is now a modal popup) -->

  <!-- Holdings -->
  <div class="holdings-card">
    <div id="holdingsContainer">
      <div class="empty-state">尚未新增任何持股</div>
    </div>
  </div>

</div>

<!-- Add stock modal -->
<div id="addModal" class="modal-overlay" style="display:none" onclick="handleAddModalOverlayClick(event)">
  <div class="modal add-modal">
    <div class="modal-header">
      <span style="font-weight:700;font-size:15px">新增持股</span>
      <button class="btn btn-ghost btn-sm" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="add-form-grid">
        <div class="form-group">
          <label>股票代號</label>
          <input type="text" id="inp-symbol" placeholder="AAPL / 2330" autocomplete="off" autocapitalize="characters"
                 onblur="lookupSymbolPreview()">
          <div id="add-symbol-preview" class="symbol-preview"></div>
        </div>
        <div class="form-group">
          <label>買入價格</label>
          <input type="number" id="inp-buy" placeholder="150.00" step="0.01" min="0">
        </div>
        <div class="form-group">
          <label>股數（選填）</label>
          <input type="number" id="inp-qty" placeholder="100" step="1" min="0">
        </div>
        <div class="form-group">
          <label>備註（選填）</label>
          <input type="text" id="inp-note" placeholder="例：長期持有">
        </div>
      </div>
      <div id="add-error" style="color:#dc2626;font-size:12px;margin-top:10px;display:none"></div>
    </div>
    <div class="modal-footer">
      <div style="flex:1"></div>
      <button class="btn btn-ghost" onclick="closeAddModal()">取消</button>
      <button class="btn btn-primary" onclick="addStock()">新增</button>
    </div>
  </div>
</div>

<!-- Batch edit modal -->
<div id="batchModal" class="modal-overlay" style="display:none" onclick="handleModalOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <span style="font-weight:700;font-size:15px">批次編輯清單</span>
      <button class="btn btn-ghost btn-sm" onclick="closeBatchEdit()">✕</button>
    </div>
    <div class="modal-body" id="batchBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="addFromBatchEdit()">＋ 新增一筆</button>
      <div style="flex:1"></div>
      <button class="btn btn-ghost" onclick="closeBatchEdit()">取消</button>
      <button class="btn btn-primary" onclick="saveBatchEdit()">儲存全部</button>
    </div>
  </div>
</div>

<script>
// ─── Version ──────────────────────────────────────────────────────────────────

const VERSION = '1.0.22';
document.getElementById('versionBadge').textContent = 'v' + VERSION;

// ─── Storage ──────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'stock_portfolio_v1';

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function save(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let portfolio = load();

// ─── Yahoo Finance ────────────────────────────────────────────────────────────

function toYahooSymbol(symbol) {
  const s = symbol.trim();
  // Pure digits → Taiwan stock
  if (/^\d+$/.test(s)) return s + '.TW';
  return s.toUpperCase();
}

async function fetchPrice(symbol) {
  const ys = toYahooSymbol(symbol);
  const direct = `https://query1.finance.yahoo.com/v8/finance/chart/${ys}?interval=1d&range=1d`;
  const urls = [
    direct,
    `https://query2.finance.yahoo.com/v8/finance/chart/${ys}?interval=1d&range=1d`,
    `https://corsproxy.io/?url=${encodeURIComponent(direct)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(direct)}`,
  ];
  let lastErr;
  for (const url of urls) {
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const result = json?.chart?.result?.[0];
      if (!result) throw new Error('無資料');
      return {
        price:    result.meta.regularMarketPrice,
        currency: result.meta.currency || '',
        name:     result.meta.longName || result.meta.shortName || symbol,
      };
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('抓取失敗');
}

// ─── ID ───────────────────────────────────────────────────────────────────────

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// ─── Time display ─────────────────────────────────────────────────────────────

function fmtTime(isoStr) {
  if (!isoStr) return null;
  const d = new Date(isoStr);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = diffMs / 60000;

  const pad = n => String(n).padStart(2, '0');
  const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

  // Different day: show date
  const isToday = d.toDateString() === now.toDateString();
  const label = isToday
    ? timeStr
    : `${d.getMonth()+1}/${d.getDate()} ${timeStr}`;

  return { label, diffMin };
}

function timestampHtml(isoStr, errMsg, inline = false) {
  const tag = inline ? 'span' : 'div';
  if (errMsg) {
    return `<${tag} class="timestamp ts-error">⚠ ${errMsg}</${tag}>`;
  }
  if (!isoStr) {
    return `<${tag} class="timestamp ts-never">—</${tag}>`;
  }
  const { label, diffMin } = fmtTime(isoStr);
  let cls = 'ts-fresh';
  let icon = '●';
  if (diffMin > 120) { cls = 'ts-stale'; icon = '●'; }
  else if (diffMin > 30) { cls = 'ts-old'; icon = '●'; }

  return `<${tag} class="timestamp ${cls}" title="更新時間：${label}">${icon} ${label}</${tag}>`;
}

// ─── Number formatting ────────────────────────────────────────────────────────

function fmtNum(n, decimals = 2) {
  if (n == null || isNaN(n)) return '—';
  return n.toLocaleString('zh-TW', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function pctHtml(pct) {
  if (pct == null || isNaN(pct)) return '<span class="pct-badge pct-zero">—</span>';
  const sign = pct > 0 ? '+' : '';
  const cls = pct > 0 ? 'pct-gain' : pct < 0 ? 'pct-loss' : 'pct-zero';
  return `<span class="pct-badge ${cls}">${sign}${fmtNum(pct)}%</span>`;
}

function pnlClass(v) {
  if (v == null || isNaN(v)) return 'zero';
  return v > 0 ? 'gain' : v < 0 ? 'loss' : 'zero';
}

// ─── Render ───────────────────────────────────────────────────────────────────

function render() {
  const container = document.getElementById('holdingsContainer');

  if (portfolio.length === 0) {
    container.innerHTML = '<div class="empty-state">尚未新增任何持股</div>';
    return;
  }

  // Table
  const pnlHidden = !pnlShowing;

  const groups = getSortedPortfolio().map(s => {
    const diff    = s.currentPrice != null ? s.currentPrice - s.buyPrice : null;
    const diffPct = diff != null ? (diff / s.buyPrice) * 100 : null;

    // ── Name row ──────────────────────────────────────────────────────────────
    const nameSpan = s.fetchedName
      ? `<span class="stock-name">${escHtml(s.fetchedName)}</span>` : '';
    const tsSpan = s.loading
      ? '<span class="timestamp ts-never">…</span>'
      : timestampHtml(s.lastUpdated, s.fetchError, true);
    const noteDiv = s.note
      ? `<div class="stock-note">${escHtml(s.note)}</div>` : '';

    const nameRow = `<tr class="stock-name-row">
      <td colspan="99">
        <div class="name-sticky">
          <div class="name-info">
            <span class="stock-symbol">${escHtml(s.symbol.toUpperCase())}</span>
            ${nameSpan}
            ${tsSpan}
          </div>
          ${noteDiv}
        </div>
      </td>
    </tr>`;

    // ── Data row ──────────────────────────────────────────────────────────────
    const sign   = diff != null ? (diff >= 0 ? '+' : '') : '';
    const chgCls = diff != null ? (diff > 0 ? 'gain' : diff < 0 ? 'loss' : 'zero') : 'zero';

    const curPriceStr = s.loading
      ? '<span class="loading-dot"></span>'
      : s.currentPrice != null ? fmtNum(s.currentPrice) : '—';
    const chgAmtStr  = diff != null ? `<span class="${chgCls}">${sign}${fmtNum(diff)}</span>` : '—';
    const chgPctStr  = diffPct != null ? `<span class="${chgCls}">(${sign}${fmtNum(diffPct)}%)</span>` : '—';

    let pnlAmtStr = '—';
    if (s.qty > 0 && diff != null) {
      const pnlAmt = diff * s.qty;
      const psign = pnlAmt >= 0 ? '+' : '';
      pnlAmtStr = `<span class="${pnlClass(pnlAmt)}">${psign}${fmtNum(pnlAmt)}</span>`;
    }

    const dataRow = `<tr class="stock-data-row">
      <td class="col-buy price-cell">${fmtNum(s.buyPrice)}</td>
      <td class="col-cur price-cell">${curPriceStr}</td>
      <td class="price-cell">${chgAmtStr}</td>
      <td class="price-cell">${chgPctStr}</td>
      <td class="col-pnl">${pnlAmtStr}</td>
      <td>
        <div class="actions">
          <button class="btn btn-ghost btn-sm" onclick="fetchAndUpdate('${s.id}')">更新</button>
          <button class="btn btn-ghost btn-sm" onclick="startEdit('${s.id}')">編輯</button>
          <button class="btn btn-danger btn-sm" onclick="deleteStock('${s.id}')">刪除</button>
        </div>
      </td>
    </tr>`;

    return `<tbody class="stock-group" data-stock-id="${s.id}">${nameRow}${dataRow}</tbody>`;
  }).join('');

  const tableClass = pnlHidden ? 'hide-pnl' : '';
  container.innerHTML = `
    <div class="table-wrapper">
      <table class="${tableClass}">
        <thead>
          <tr>
            <th class="col-buy">買入價</th>
            <th class="col-cur">現價</th>
            <th>漲跌</th>
            <th></th>
            <th class="col-pnl">損益金額</th>
            <th></th>
          </tr>
        </thead>
        ${groups}
      </table>
    </div>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─── CRUD ─────────────────────────────────────────────────────────────────────

function addStock() {
  const symbol   = document.getElementById('inp-symbol').value.trim();
  const buyPrice = parseFloat(document.getElementById('inp-buy').value);
  const qty      = parseFloat(document.getElementById('inp-qty').value) || 0;
  const note     = document.getElementById('inp-note').value.trim();

  const errEl = document.getElementById('add-error');

  if (!symbol) { showErr(errEl, '請輸入股票代號'); return; }
  if (isNaN(buyPrice) || buyPrice <= 0) { showErr(errEl, '請輸入有效的買入價格'); return; }
  errEl.style.display = 'none';

  const entry = { id: uid(), symbol, buyPrice, qty, note, currentPrice: null, fetchedName: '', currency: '', lastUpdated: null, fetchError: null };
  portfolio.push(entry);
  save(portfolio);

  closeAddModal();

  render();
  fetchAndUpdate(entry.id);

  // If batch edit is open, refresh its list to include the new entry
  if (_batchEditOpen) {
    document.getElementById('batchBody').innerHTML =
      getSortedPortfolio().map(s => batchRowHtml(s.id, s.symbol, s.buyPrice, s.qty, s.note)).join('');
  }
}

function showErr(el, msg) {
  el.textContent = msg;
  el.style.display = 'block';
}

function deleteStock(id) {
  portfolio = portfolio.filter(s => s.id !== id);
  save(portfolio);
  render();
}

// ─── Edit inline ──────────────────────────────────────────────────────────────

function startEdit(id) {
  const s = portfolio.find(p => p.id === id);
  if (!s) return;

  const container = document.getElementById('holdingsContainer');

  closeAllEdits();

  const editRow = document.createElement('tr');
  editRow.className = 'edit-row';
  editRow.dataset.editId = id;
  editRow.innerHTML = `
    <td colspan="99">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:4px 0">
        <div class="form-group" style="min-width:100px">
          <label>代號</label>
          <input type="text" id="edit-symbol-${id}" value="${escHtml(s.symbol)}" style="width:100%">
        </div>
        <div class="form-group" style="min-width:110px">
          <label>買入價格</label>
          <input type="number" id="edit-buy-${id}" value="${s.buyPrice}" step="0.01" min="0" style="width:100%">
        </div>
        <div class="form-group" style="min-width:100px">
          <label>股數</label>
          <input type="number" id="edit-qty-${id}" value="${s.qty || ''}" step="1" min="0" style="width:100%">
        </div>
        <div class="form-group" style="flex:1;min-width:130px">
          <label>備註</label>
          <input type="text" id="edit-note-${id}" value="${escHtml(s.note || '')}" style="width:100%">
        </div>
        <button class="btn btn-primary btn-sm" onclick="saveEdit('${id}')">儲存</button>
        <button class="btn btn-ghost btn-sm" onclick="closeAllEdits()">取消</button>
      </div>
    </td>`;

  const targetRow = container.querySelector(`tbody.stock-group[data-stock-id="${id}"] tr.stock-data-row`);
  if (targetRow) targetRow.after(editRow);
}

function closeAllEdits() {
  document.querySelectorAll('.edit-row').forEach(r => r.remove());
}

function saveEdit(id) {
  const symbol   = document.getElementById(`edit-symbol-${id}`)?.value.trim();
  const buyPrice = parseFloat(document.getElementById(`edit-buy-${id}`)?.value);
  const qty      = parseFloat(document.getElementById(`edit-qty-${id}`)?.value) || 0;
  const note     = document.getElementById(`edit-note-${id}`)?.value.trim() || '';

  if (!symbol || isNaN(buyPrice) || buyPrice <= 0) return;

  const s = portfolio.find(p => p.id === id);
  if (!s) return;

  const symbolChanged = s.symbol !== symbol;
  s.symbol = symbol; s.buyPrice = buyPrice; s.qty = qty; s.note = note;
  if (symbolChanged) { s.currentPrice = null; s.fetchedName = ''; s.lastUpdated = null; s.fetchError = null; }

  save(portfolio);
  render();
  if (symbolChanged) fetchAndUpdate(id);
}

// ─── Fetch & refresh ──────────────────────────────────────────────────────────

async function fetchAndUpdate(id) {
  const s = portfolio.find(p => p.id === id);
  if (!s) return;

  s.loading = true;
  s.fetchError = null;
  render();

  try {
    const { price, currency, name } = await fetchPrice(s.symbol);
    s.currentPrice = price;
    s.currency     = currency;
    s.fetchedName  = name;
    s.lastUpdated  = new Date().toISOString();
    s.fetchError   = null;
  } catch (e) {
    s.fetchError  = e.message || '抓取失敗';
    s.lastUpdated = new Date().toISOString(); // Still record the attempt time
  } finally {
    s.loading = false;
    save(portfolio);
    render();
  }
}

const FRESH_MS = 5 * 60 * 1000; // 5 minutes

function isStale(s) {
  if (!s.lastUpdated || s.fetchError) return true;
  return (Date.now() - new Date(s.lastUpdated)) > FRESH_MS;
}

async function refreshAll() {
  const btn = document.getElementById('refreshAllBtn');
  btn.disabled = true;
  btn.textContent = '整理中…';

  const stale = portfolio.filter(isStale);
  const skipped = portfolio.length - stale.length;
  await Promise.allSettled(stale.map(s => fetchAndUpdate(s.id)));

  btn.disabled = false;
  btn.textContent = '重新整理';

  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const time = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const note = skipped > 0 ? `（略過 ${skipped} 筆新資料）` : '';
  document.getElementById('globalRefreshTime').textContent = `${time}${note}`;
}

async function forceRefreshAll() {
  const btn = document.getElementById('menuBtn');
  btn.disabled = true;
  closeMenu();

  await Promise.allSettled(portfolio.map(s => fetchAndUpdate(s.id)));

  btn.disabled = false;

  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('globalRefreshTime').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

// ─── P&L column toggle ────────────────────────────────────────────────────────

let pnlShowing = false;

function togglePnlCol() {
  pnlShowing = !pnlShowing;
  document.getElementById('pnlMenuItem').textContent = pnlShowing ? '隱藏損益金額' : '顯示損益金額';
  closeMenu();
  render();
}

// ─── Hamburger menu ───────────────────────────────────────────────────────────

function toggleMenu() {
  document.getElementById('menuDropdown').classList.toggle('open');
}

function closeMenu() {
  document.getElementById('menuDropdown').classList.remove('open');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.menu-wrapper')) closeMenu();
});

// ─── Batch edit ───────────────────────────────────────────────────────────────

let _batchNewCounter = 0;
let _batchEditOpen = false;

function openBatchEdit() {
  closeMenu();
  _batchEditOpen = true;
  _batchNewCounter = 0;
  const body = document.getElementById('batchBody');
  body.innerHTML = getSortedPortfolio().map(s => batchRowHtml(s.id, s.symbol, s.buyPrice, s.qty, s.note)).join('');
  document.getElementById('batchModal').style.display = 'flex';
}

function addFromBatchEdit() {
  openAddModal();
  // addStock() will refresh batchBody when _batchEditOpen is true
}

function batchRowHtml(id, symbol, buyPrice, qty, note) {
  return `<div class="batch-row" data-id="${escHtml(String(id))}">
    <input class="b-sym"  value="${escHtml(symbol)}"                     placeholder="代號"  autocapitalize="characters">
    <input class="b-buy"  value="${buyPrice != null ? buyPrice : ''}"     placeholder="買入價" type="number" step="0.01" min="0">
    <input class="b-qty"  value="${qty > 0 ? qty : ''}"                   placeholder="股數"  type="number" step="1"    min="0">
    <input class="b-note" value="${escHtml(note || '')}"                   placeholder="備註">
    <button class="btn btn-ghost btn-sm" style="flex-shrink:0;color:#aaa"
            onclick="toggleBatchDelete(this)" title="標記刪除">✕</button>
  </div>`;
}

function toggleBatchDelete(btn) {
  btn.closest('.batch-row').classList.toggle('pending-delete');
}

function saveBatchEdit() {
  const rows = document.querySelectorAll('#batchBody .batch-row:not(.pending-delete)');
  const newPortfolio = [];
  const toFetch = [];

  rows.forEach(row => {
    const id      = row.dataset.id;
    const symbol  = row.querySelector('.b-sym').value.trim();
    const buyPrice = parseFloat(row.querySelector('.b-buy').value);
    const qty     = parseFloat(row.querySelector('.b-qty').value) || 0;
    const note    = row.querySelector('.b-note').value.trim();
    if (!symbol || isNaN(buyPrice) || buyPrice <= 0) return;

    if (id.startsWith('new_')) {
      // Brand-new entry
      const entry = { id: uid(), symbol, buyPrice, qty, note,
                      currentPrice: null, fetchedName: '', currency: '',
                      lastUpdated: null, fetchError: null };
      newPortfolio.push(entry);
      toFetch.push(entry.id);
    } else {
      const existing = portfolio.find(p => p.id === id);
      if (!existing) return;
      const symChanged = existing.symbol.toUpperCase() !== symbol.toUpperCase();
      existing.symbol   = symbol;
      existing.buyPrice = buyPrice;
      existing.qty      = qty;
      existing.note     = note;
      if (symChanged) {
        existing.currentPrice = null; existing.fetchedName = '';
        existing.lastUpdated  = null; existing.fetchError  = null;
        toFetch.push(existing.id);
      }
      newPortfolio.push(existing);
    }
  });

  portfolio = newPortfolio;
  save(portfolio);
  closeBatchEdit();
  render();
  toFetch.forEach(id => fetchAndUpdate(id));
}

function closeBatchEdit() {
  _batchEditOpen = false;
  document.getElementById('batchModal').style.display = 'none';
}

function handleModalOverlayClick(e) {
  if (e.target === e.currentTarget) closeBatchEdit();
}

// ─── Sort ─────────────────────────────────────────────────────────────────────

let sortMode   = 'newest';
let regionMode = 'none';  // 'none' | 'us_first' | 'tw_first'

function isTaiwanStock(s) {
  return /^\d+$/.test(s.symbol.trim());
}

function getSortedPortfolio() {
  let arr = [...portfolio];

  // Primary sort
  switch (sortMode) {
    case 'oldest': break;
    case 'gain_desc':
      arr.sort((a, b) => {
        const ga = a.currentPrice != null ? (a.currentPrice - a.buyPrice) / a.buyPrice : -Infinity;
        const gb = b.currentPrice != null ? (b.currentPrice - b.buyPrice) / b.buyPrice : -Infinity;
        return gb - ga;
      }); break;
    case 'gain_asc':
      arr.sort((a, b) => {
        const ga = a.currentPrice != null ? (a.currentPrice - a.buyPrice) / a.buyPrice : Infinity;
        const gb = b.currentPrice != null ? (b.currentPrice - b.buyPrice) / b.buyPrice : Infinity;
        return ga - gb;
      }); break;
    case 'alpha':
      arr.sort((a, b) => a.symbol.toUpperCase().localeCompare(b.symbol.toUpperCase())); break;
    case 'alpha_rev':
      arr.sort((a, b) => b.symbol.toUpperCase().localeCompare(a.symbol.toUpperCase())); break;
    case 'newest':
    default:
      arr.reverse(); break;
  }

  // Region grouping (stable: preserves internal sort order)
  if (regionMode !== 'none') {
    const tw = arr.filter(s =>  isTaiwanStock(s));
    const us = arr.filter(s => !isTaiwanStock(s));
    arr = regionMode === 'tw_first' ? [...tw, ...us] : [...us, ...tw];
  }

  return arr;
}

function setSort(mode) {
  sortMode = mode;
  document.querySelectorAll('.sort-item').forEach(el => {
    el.classList.toggle('active', el.dataset.sort === mode);
  });
  closeMenu();
  render();
}

function setRegion(mode) {
  regionMode = mode;
  document.querySelectorAll('.region-item').forEach(el => {
    el.classList.toggle('active', el.dataset.region === mode);
  });
  closeMenu();
  render();
}

// ─── Add stock modal ──────────────────────────────────────────────────────────

function openAddModal() {
  document.getElementById('add-symbol-preview').textContent = '';
  document.getElementById('add-error').style.display = 'none';
  document.getElementById('inp-symbol').value = '';
  document.getElementById('inp-buy').value = '';
  document.getElementById('inp-qty').value = '';
  document.getElementById('inp-note').value = '';
  document.getElementById('addModal').style.display = 'flex';
  setTimeout(() => document.getElementById('inp-symbol').focus(), 50);
}

function closeAddModal() {
  document.getElementById('addModal').style.display = 'none';
}

function handleAddModalOverlayClick(e) {
  if (e.target === e.currentTarget) closeAddModal();
}

// ─── Live symbol name preview ─────────────────────────────────────────────────

let _previewReqId = 0;

async function lookupSymbolPreview() {
  const symbol = document.getElementById('inp-symbol').value.trim();
  const el = document.getElementById('add-symbol-preview');
  if (!symbol) { el.textContent = ''; return; }

  const reqId = ++_previewReqId;
  el.style.color = '#aaa';
  el.textContent = '查詢中…';

  try {
    const { name } = await fetchPrice(symbol);
    if (reqId !== _previewReqId) return;
    el.style.color = '#2563eb';
    el.textContent = name;
  } catch {
    if (reqId !== _previewReqId) return;
    el.style.color = '#ef4444';
    el.textContent = '找不到股票';
  }
}

// ─── Keyboard shortcut ────────────────────────────────────────────────────────

document.getElementById('inp-note').addEventListener('keydown', e => {
  if (e.key === 'Enter') addStock();
});

// ─── Init ─────────────────────────────────────────────────────────────────────

render();

// On load: only fetch stocks without fresh data (currentPrice already saved in localStorage)
if (portfolio.length > 0) {
  const needsFetch = portfolio.filter(isStale);
  if (needsFetch.length > 0) {
    Promise.allSettled(needsFetch.map(s => fetchAndUpdate(s.id)));
  }
}
</script>
