<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>實價登錄（卡片版）</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f6f8;
    margin: 0;
    padding: 16px;
}

/* 卡片容器 */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
}

/* 單筆卡片 */
.card {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

/* 標題列 */
.header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.date {
    font-size: 13px;
    color: #666;
}

.price {
    font-size: 18px;
    font-weight: bold;
    color: #d94848;
}

/* 2x2 區塊 */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

/* 每格 */
.item {
    background: #fafafa;
    border-radius: 8px;
    padding: 8px;
}

.label {
    font-size: 11px;
    color: #888;
}

.value {
    font-size: 14px;
    font-weight: 500;
    margin-top: 2px;
}

/* 次要資訊 */
.extra {
    margin-top: 10px;
    font-size: 12px;
    color: #666;
    line-height: 1.4;
}

</style>
</head>

<body>

<div class="container">

    <!-- 卡片 1 -->
    <div class="card">
        <div class="header">
            <div class="date">2025/12</div>
            <div class="price">1830萬</div>
        </div>

        <div class="grid">
            <div class="item">
                <div class="label">單價</div>
                <div class="value">52.0萬/坪</div>
            </div>
            <div class="item">
                <div class="label">坪數</div>
                <div class="value">35.2坪</div>
            </div>
            <div class="item">
                <div class="label">樓層</div>
                <div class="value">10F / 15F</div>
            </div>
            <div class="item">
                <div class="label">屋齡</div>
                <div class="value">12年</div>
            </div>
        </div>

        <div class="extra">
            車位：坡道平面（含車位價）<br>
            備註：標準三房，無特殊交易
        </div>
    </div>

    <!-- 卡片 2 -->
    <div class="card">
        <div class="header">
            <div class="date">2025/10</div>
            <div class="price">1700萬</div>
        </div>

        <div class="grid">
            <div class="item">
                <div class="label">單價</div>
                <div class="value">50.7萬/坪</div>
            </div>
            <div class="item">
                <div class="label">坪數</div>
                <div class="value">33.5坪</div>
            </div>
            <div class="item">
                <div class="label">樓層</div>
                <div class="value">8F / 15F</div>
            </div>
            <div class="item">
                <div class="label">屋齡</div>
                <div class="value">12年</div>
            </div>
        </div>

        <div class="extra">
            車位：機械車位<br>
            備註：低樓層成交
        </div>
    </div>

    <!-- 卡片 3 -->
    <div class="card">
        <div class="header">
            <div class="date">2025/08</div>
            <div class="price">1920萬</div>
        </div>

        <div class="grid">
            <div class="item">
                <div class="label">單價</div>
                <div class="value">53.1萬/坪</div>
            </div>
            <div class="item">
                <div class="label">坪數</div>
                <div class="value">36.1坪</div>
            </div>
            <div class="item">
                <div class="label">樓層</div>
                <div class="value">12F / 15F</div>
            </div>
            <div class="item">
                <div class="label">屋齡</div>
                <div class="value">11年</div>
            </div>
        </div>

        <div class="extra">
            車位：坡道平面<br>
            備註：高樓層景觀戶
        </div>
    </div>

</div>

</body>
</html>
