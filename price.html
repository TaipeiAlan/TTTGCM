<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>價格表</title>

<style>
body {
    font-family: sans-serif;
    background: #f5f6f8;
    margin: 0;
}

/* ===== 表格 ===== */
.table {
    overflow-x: auto;
}

table {
    border-collapse: collapse;
    width: 100%;
    min-width: 600px;
}

/* 標題 */
th {
    background: #f2d2a4;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ddd;
}

/* 樓層 */
.floor {
    background: #e9dcc8;
    font-weight: bold;
    text-align: center;
    width: 60px;
}

/* 每格 */
td {
    border: 1px solid #ddd;
    padding: 6px;
    background: #fff;
}

/* ===== 2x2內容 ===== */
.cell {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 4px;
    font-size: 12px;
}

/* label */
.label {
    color: #888;
    font-size: 10px;
}

/* value */
.value {
    font-weight: 600;
}

/* 單價強調 */
.price {
    color: #d94848;
    font-size: 14px;
}

/* 尚未登錄 */
.empty {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    padding: 20px 0;
}

/* 小角標 */
.tag {
    position: absolute;
    top: 0;
    right: 0;
    background: orange;
    color: white;
    font-size: 10px;
    padding: 2px 4px;
    border-radius: 0 4px 0 4px;
}

/* cell wrapper */
.cell-wrap {
    position: relative;
}

</style>
</head>

<body>

<div class="table">
<table>

<thead>
<tr>
    <th>樓層</th>
    <th>A1</th>
    <th>A2</th>
    <th>A3</th>
</tr>
</thead>

<tbody>

<tr>
    <td class="floor">22F</td>

    <!-- 有資料 -->
    <td>
        <div class="cell-wrap">
            <div class="tag">1</div>
            <div class="cell">
                <div>
                    <div class="label">日期</div>
                    <div class="value">114/07</div>
                </div>
                <div>
                    <div class="label">單價</div>
                    <div class="value price">103.9</div>
                </div>
                <div>
                    <div class="label">總價</div>
                    <div class="value">3,976萬</div>
                </div>
                <div>
                    <div class="label">車位</div>
                    <div class="value">含</div>
                </div>
            </div>
        </div>
    </td>

    <!-- 有資料 -->
    <td>
        <div class="cell-wrap">
            <div class="tag">1</div>
            <div class="cell">
                <div>
                    <div class="label">日期</div>
                    <div class="value">114/07</div>
                </div>
                <div>
                    <div class="label">單價</div>
                    <div class="value price">104.1</div>
                </div>
                <div>
                    <div class="label">總價</div>
                    <div class="value">4,266萬</div>
                </div>
                <div>
                    <div class="label">車位</div>
                    <div class="value">含</div>
                </div>
            </div>
        </div>
    </td>

    <!-- 空 -->
    <td>
        <div class="empty">尚未登錄</div>
    </td>
</tr>

<tr>
    <td class="floor">21F</td>
    <td><div class="empty">尚未登錄</div></td>
    <td><div class="empty">尚未登錄</div></td>
    <td><div class="empty">尚未登錄</div></td>
</tr>

</tbody>

</table>
</div>

</body>
</html>
